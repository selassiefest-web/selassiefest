<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Follow-up Walk, Nov 6 to 8</title>
<style>
body{font:16px/1.4 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:12px;color:#1a1a1a}
h1{font-size:1.4rem}
h2{margin-top:2rem;background:#0b5d3b;color:#fff;padding:8px 12px;border-radius:6px;font-size:1.1rem}h2 small{font-weight:400}
.stop{border:1px solid #ccc;border-radius:8px;padding:10px 12px;margin:10px 0}.t0{background:#ffffff}.t1{background:#f1f2f4}.t2{background:#dfe2e6}.t3{background:#e3effa}.t4{background:#c8def2}
.stop{border-width:2px}.stop.done{border-left:10px solid #0b5d3b}.stop.done h3:after{content:" ¹3 done";color:#0b5d3b;font-size:.85rem;margin-left:6px}
.stop h3{margin:0;font-size:1.05rem}.stop h3 small{color:#666;font-weight:400;font-size:.8rem}
.n{display:inline-block;background:#b8860b;color:#fff;border-radius:50%;min-width:1.6em;text-align:center;margin-right:4px}
.addr{margin:4px 0;font-weight:600}.was{margin:2px 0;color:#555;font-size:.9rem}.q{margin:6px 0 2px}
.scan{margin:4px 0;font-size:.9rem;color:#555}.scan.hit{color:#0b5d3b;font-weight:700}
.opts label{display:inline-block;margin:3px 10px 3px 0;padding:4px 8px;border:1px solid #bbb;border-radius:14px}
.note{width:100%;box-sizing:border-box;padding:6px;margin-top:4px}.next{margin:8px 0 0;color:#0b5d3b}
table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border:1px solid #ccc;padding:4px 6px;vertical-align:top;text-align:left}
button{font-size:1rem;padding:8px 14px;margin:6px 6px 6px 0}pre{white-space:pre-wrap;background:#f5f5f5;padding:8px;font-size:.8rem}
#msg{padding:20px;text-align:center}
@media print{button,pre{display:none}}
</style>
</head>
<body>
<h1>Follow-up walk: what happened at each stop</h1>
<div id="msg">Loading…</div>
<div id="app" hidden>
<p>Fri Nov 6 to Sun Nov 8. Tap what happened at each stop and add a note. Every answer saves to the tracker as you tap it, and shows on any device you sign in on. <span id="cnt"></span></p>
<p><button id="clrBtn">Clear</button><button id="refBtn">Refresh scans</button></p>
<p id="saveMsg" class="scan"></p>
<div id="list"></div>
</div>
<script src="/assets/js/supabase-client.js"></script>
<script>
// Private page: shows nothing without a staff session from /full-spectrum/partners.html (same sign-in, same localStorage key).
// Partner names and addresses are read live from Supabase after sign-in and are never stored in this file.
(function(){
  var KEY = 'fsPartnerSession', LS = 'walk';
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var sess; try { sess = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){}
  if (!sess){ $('msg').innerHTML = 'Sign in first at <a href="/full-spectrum/partners.html">/full-spectrum/partners.html</a>, then reopen this page.'; return; }

    var DAYS = [
    ['2026-11-06', 'Friday Nov 6: weekday-only stops', 'Schools, child care centers, hospitals, fire houses and the phone list only work on a weekday. Start with the calls at 9 am, then the child care stops, then the side trips.'],
    ['2026-11-07', 'Saturday Nov 7: the shops (79th St, then 71st St)', 'Barbershops, salons, markets and restaurants are busiest and open on Saturday. Walk 79th east to west, then 71st east to west.'],
    ['2026-11-08', 'Sunday Nov 8: churches after service, then 75th St', 'Churches 12:30 to 3 pm (79th east to west, then 75th). Then walk 75th west to east. Many shops are closed Sunday: mark them Not visited and they roll to Monday Nov 9.']
  ];
  var isChild = function(r){ return /child/i.test(r.category || ''); }, isFaith = function(r){ return r.category === 'Faith'; };

  function plan(rows){
    var desk = [], legs = {'79':[], '75':[], '71':[], side:[]};
    rows.forEach(function(r){
      var a = r.address || '', ns = r.next_step || '', m = a.match(/^(\d+)(?:-\d+)?\s+E\.\s+(79th|75th|71st)\s+St/);
      var deskLike = !a || !/Chicago, IL/.test(a) || /^(Submit|Call 1-|Call 773-535-6100|Find|Email|HOLD|Use |Ask)/.test(ns) || /c\/o|Suite/.test(a);
      if (deskLike && !(m && /hand-delivered|Deliver the letter/.test(ns))){ desk.push(r); return; }
      if (m){ var n = +m[1], st = {'79th':'79','75th':'75','71st':'71'}[m[2]];
        if (st === '75' && n < 1600){ r.n = 0; legs.side.push(r); } else { r.n = n; legs[st].push(r); } }
      else if (/75th St\. and S\. Coles/.test(a)){ r.n = 1960; legs['75'].push(r); }
      else { r.n = 0; legs.side.push(r); }
    });
    legs['79'].sort(function(a,b){ return b.n - a.n; });
    legs['75'].sort(function(a,b){ return a.n - b.n; });
    legs['71'].sort(function(a,b){ return b.n - a.n; });
    var zip = function(r){ return +((r.address.match(/\b6\d{4}\b/) || ['0'])[0]); };
    legs.side.sort(function(a,b){ return zip(a) - zip(b) || a.address.localeCompare(b.address); });
    var flat = legs['79'].concat(legs['75'], legs['71']);
    var notChildFaith = function(r){ return !isChild(r) && !isFaith(r); };
    return { desk: desk, days: [
      flat.filter(isChild).concat(legs.side),
      legs['79'].concat(legs['71']).filter(notChildFaith),
      legs['79'].filter(isFaith).concat(legs['75'].filter(isFaith), legs['75'].filter(notChildFaith))
    ]};
  }

  // 15 pale tints, black text stays readable on all; neighbors always differ. Order: white, greys, blues, greens, yellows, oranges, pinks, purples.
  var TINTS = ['#ffffff','#f1f2f4','#dfe2e6','#e3effa','#c8def2','#e4f5e6','#c6e8cb','#fdf7d3','#f6e7a0','#fde8d8','#f8cfb0','#fbe4ee','#f3c3d8','#efe6fa','#d8c7f0'];
  var idx = 0, byId = {}, cur = {}, cnt = function(){};
  // Unsaved answers wait in this queue (kept on the phone) and are retried until Supabase confirms them.
  var q = {}; try { q = JSON.parse(localStorage.getItem('walkq') || '{}'); } catch(e){}
  var saveQ = function(){ localStorage.setItem('walkq', JSON.stringify(q)); };
  var CODE = {'spoke to owner/manager':'talked', 'left with staff':'staff', 'got contact':'contact', 'closed/gone':'closed'};
  function parseWalk(sum){
    var m = /^Walk \d{4}-\d{2}-\d{2}: ([^.]*?)(?:\. ([\s\S]*))?$/.exec(sum || '');
    if (!m) return null;
    var o = /^not visited/.test(m[1]) ? 'skip' : CODE[m[1]];
    return o ? {o: o, t: m[2] || ''} : null;
  }
  var firstAddr = function(a){ return String(a || '').split(/ and /)[0].replace(/\s+$/, '') + (/Chicago/.test(String(a || '').split(/ and /)[0]) ? '' : ', Chicago, IL'); };
  function dirs(r, prev){
    if (!r.address) return '';
    var base = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(firstAddr(r.address)) + (prev && prev.address ? '&origin=' + encodeURIComponent(firstAddr(prev.address)) : '');
    return '<p class="scan"><a href="' + base + '&travelmode=walking" target="_blank" rel="noopener">Walking directions</a> &middot; <a href="' + base + '&travelmode=driving" target="_blank" rel="noopener">Driving</a>' + (prev ? ' (from the previous stop)' : ' (from where you are)') + '</p>';
  }
  function scanLine(r){
    if (!r.pitch_key) return '';
    var v = r.scans || 0;
    return '<p class="scan' + (v > 0 ? ' hit' : '') + '">QR scans: ' + v + (r.scan_last ? ' &middot; last ' + esc(new Date(r.scan_last).toLocaleString()) : '') + '</p>' +
      (r.hours_note ? '<p class="scan">Hours: ' + esc(r.hours_note) + '</p>' : '');
  }
  function stop(r, next, prev){
    idx++;
    var wasDel = /hand-delivered|delivered or emailed|Wave 2 letter/.test(r.next_step || '');
    var opts = [['talked','Spoke to owner / manager'],['staff','Left with staff'],['contact','Got a contact name or email'],['closed','Closed / gone'],['skip','Not visited']]
      .map(function(o){ return '<label><input type="radio" name="o' + idx + '" value="' + o[0] + '"> ' + o[1] + '</label>'; }).join('');
    var tel = r.phone ? ' &middot; <a href="tel:' + esc(r.phone.replace(/\D/g,'')) + '">' + esc(r.phone) + '</a>' : '';
    return '<section class="stop" style="background:' + TINTS[(idx - 1) % TINTS.length] + '" data-id="' + r.id + '" data-name="' + esc(r.name) + '">' +
      '<h3><span class="n">' + idx + '</span> ' + esc(r.name) + ' <small>' + esc(r.category) + '</small></h3>' +
      '<p class="addr">' + esc(r.address) + tel + '</p>' + dirs(r, prev) +
      '<p class="was">' + (wasDel ? 'Tracker says the letter was already delivered. ' : '') + esc(r.next_step) + '</p>' + scanLine(r) +
      '<p class="q"><b>What happened?</b></p><div class="opts">' + opts + '</div>' +
      '<input class="note" placeholder="Contact name, email, what they said">' +
      (next ? '<p class="next">&rarr; Then go to <b>' + esc(next.name) + '</b>, ' + esc((next.address || '').split(',')[0]) + '</p>' : '<p class="next">&#10003; End of the day</p>') +
      '</section>';
  }

  function render(rows){
    idx = 0;
    var p = plan(rows), html = '', total = 0;
    p.days.forEach(function(L, i){
      total += L.length;
      html += '<h2>' + DAYS[i][1] + ' <small>(' + L.length + ' stops)</small></h2><p>' + DAYS[i][2] + '</p>';
      if (i === 0) html += '<h3>9 am: calls and web forms (' + p.desk.length + ')</h3><table><tr><th>Who</th><th>Phone</th><th>Do</th></tr>' +
        p.desk.map(function(r){ return '<tr><td>' + esc(r.name) + '<br><small>' + esc(r.category) + '</small></td><td>' + esc(r.phone || '') + '</td><td>' + esc(r.next_step) + '</td></tr>'; }).join('') + '</table>';
      html += L.map(function(r, j){ return stop(r, L[j+1], L[j-1]); }).join('');
    });
    $('list').innerHTML = html;
    $('app').hidden = false; $('msg').hidden = true;
    cnt = function(){ $('cnt').textContent = Object.keys(cur).filter(function(k){ return cur[k].o; }).length + ' of ' + total + ' logged.'; };
    document.querySelectorAll('.stop').forEach(function(s){
      var id = s.dataset.id, v = cur[id] || {};
      if (v.o){ var r = s.querySelector('input[value="' + v.o + '"]'); if (r) r.checked = true; s.classList.add('done'); }
      s.querySelector('.note').value = v.t || '';
      s.addEventListener('change', function(){ var r = s.querySelector('input:checked'); var t = s.querySelector('.note').value;
        if (!r){ setMsg('Pick what happened to save this stop.'); return; }
        cur[id] = {o: r.value, t: t}; s.classList.add('done'); cnt();
        q[id] = {o: r.value, t: t, name: s.dataset.name}; saveQ(); flush(); });
    });
    cnt();
  }

  var stage = {talked:'in_conversation', staff:'reached_out', contact:'in_conversation', closed:'declined'};
  var label = {talked:'spoke to owner/manager', staff:'left with staff', contact:'got contact', closed:'closed/gone', skip:'not visited, rolled to Mon Nov 9'};
  function setMsg(t){ $('saveMsg').textContent = t; }
  function iso(n){ var x = new Date(); x.setDate(x.getDate() + n); return x.toISOString().slice(0,10); }
  var busy = false;
  async function flush(){
    if (busy) return; busy = true;
    try {
      var ids = Object.keys(q);
      for (var i = 0; i < ids.length; i++){
        var id = ids[i], it = q[id], r0 = byId[id] || {}, o = it.o, t = it.t;
        var args = { p_session: sess.sessionToken, p_partner: id, p_kind: 'visit', p_summary: 'Walk ' + iso(0) + ': ' + label[o] + (t ? '. ' + t : '') };
        if (o === 'skip'){ args.p_next_step = r0.next_step || 'Walk follow-up'; args.p_next_due = '2026-11-09'; }
        else { args.p_stage = stage[o]; args.p_next_step = o === 'closed' ? 'Closed / gone, no further action' : 'Follow up on the walk: ' + (t || 'check in by phone'); args.p_next_due = o === 'closed' ? null : iso(7); }
        try { var c = await window.sfSupabaseReady; var r = await c.rpc('fs_partner_log', args); if (r.error) throw r.error;
          if (q[id] && q[id].o === o && q[id].t === t) delete q[id]; saveQ();
          setMsg('Saved to tracker: ' + (it.name || '') + ' (' + new Date().toLocaleTimeString() + ')'); }
        catch(err){ if (/session/i.test(err.message || '')){ setMsg('Session ended. Sign in again at /full-spectrum/partners.html. Your answers are kept on this phone.'); break; }
          break; }
      }
    } finally { busy = false; var n = Object.keys(q).length; if (n) setMsg(n + ' answer' + (n > 1 ? 's' : '') + ' NOT saved yet (no signal?). They are kept on this phone and retry automatically.'); }
  }
  setInterval(flush, 15000); window.addEventListener('online', flush);
  $('clrBtn').onclick = function(){ if (confirm('Forget unsaved answers on this phone? (Saved ones stay on the tracker.)')){ localStorage.removeItem('walkq'); location.reload(); } };
  $('refBtn').onclick = function(){ load(); };

  async function load(){
    try {
      var c = await window.sfSupabaseReady;
      var r = await c.rpc('fs_walk_load', { p_session: sess.sessionToken });
      if (r.error) throw r.error;
      var rows = (r.data && r.data.partners) || [];
      byId = {}; cur = {};
      rows.forEach(function(p){ byId[p.id] = p; var sv = parseWalk(p.walk_last); if (sv) cur[p.id] = sv; if (q[p.id]) cur[p.id] = {o: q[p.id].o, t: q[p.id].t}; });
      render(rows); flush();
    } catch(err){
      $('msg').hidden = false;
      $('msg').innerHTML = /session/i.test(err.message || '') ? 'Your session ended. Sign in again at <a href="/full-spectrum/partners.html">/full-spectrum/partners.html</a>.' : 'Could not load: ' + esc(err.message) + '. <a href="">Try again</a>';
    }
  }
  load();
})();
</script>
</body>
</html>
