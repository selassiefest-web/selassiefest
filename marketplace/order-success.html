<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg-black: #0D0D0D;
      --text-white: #F5F5F5;
      --roots-green: #0E5E36;
      --gold-accent: #E5A93C;
      --card-bg: rgba(255,255,255,0.04);
      --border-dim: rgba(255,255,255,0.08);
    }
    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: 'Jost', sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    a { text-decoration: none; transition: all .2s ease; }
    .brand-link { display: inline-block; margin-bottom: 2.5rem; }
    .site-title { font-weight: 200; font-size: 1.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-white); }
    .success-card {
      background: var(--card-bg);
      border: 1px solid var(--border-dim);
      border-radius: 32px;
      padding: 3rem 2.5rem;
      max-width: 480px;
    }
    .success-icon { font-size: 3rem; color: var(--roots-green); margin-bottom: 1.2rem; }
    h1 { font-weight: 400; font-size: 1.7rem; margin-bottom: 1rem; }
    p { color: #ccc; font-weight: 300; margin-bottom: .6rem; }
    .back-link {
      display: inline-block;
      margin-top: 1.8rem;
      color: var(--gold-accent);
      font-weight: 500;
      border: 1px solid var(--gold-accent);
      padding: .7rem 1.8rem;
      border-radius: 40px;
    }
    .back-link:hover { background: var(--gold-accent); color: #0a0a0a; }
</style>
</head>
<body>
<a href="/" class="brand-link"><div class="site-title">SELASSIEFEST</div></a>
<div class="success-card">
  <i class="fas fa-circle-check success-icon"></i>
  <h1>Order Confirmed!</h1>
  <p>Your payment went through and your pre-order has been sent to our team.</p>
  <p>We'll see you at pickup during SelassieFest — bring this confirmation or your receipt email if asked.</p>
  <a href="/marketplace/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Menu</a>
</div>
</body>
