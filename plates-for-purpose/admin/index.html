<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Plates for Purpose — Restaurant Directory (Staff)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600;700&display=swap');

:root {
  --bg-black: #0a0a0a;
  --text-white: #f5f5f0;
  --roots-green: #0E5E36;
  --gold-accent: #E5A93C;
  --border-dim: rgba(255,255,255,0.10);
  --card-bg: rgba(255,255,255,0.04);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-black);
  color: var(--text-white);
  font-family: 'Jost', sans-serif;
  padding: 28px 20px 80px;
}

a { color: inherit; text-decoration: none; }

.header {
  max-width: 900px;
  margin: 0 auto 20px;
}

.header .kicker {
  font-size: 0.72rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gold-accent);
  margin-bottom: 6px;
}

.header h1 {
  font-weight: 300;
  font-size: 1.6rem;
  margin-bottom: 8px;
}

.header p {
  color: #aaa;
  font-weight: 300;
  font-size: 0.88rem;
  max-width: 640px;
  line-height: 1.6;
}

.ticker {
  display: inline-block;
  margin-top: 10px;
  font-size: 0.8rem;
  color: var(--gold-accent);
  font-weight: 300;
  padding: 7px 16px;
  border: 1px solid rgba(229,169,60,0.3);
  border-radius: 30px;
}

.controls {
  max-width: 900px;
  margin: 18px auto;
}

.controls input {
  width: 100%;
  font-family: inherit;
  font-size: 0.9rem;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--border-dim);
  background: rgba(255,255,255,0.05);
  color: var(--text-white);
}

#state-message {
  max-width: 900px;
  margin: 40px auto;
  text-align: center;
  color: #aaa;
  font-weight: 300;
}

.list {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.row {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--card-bg);
  border: 1px solid var(--border-dim);
  border-radius: 12px;
  padding: 14px 18px;
  transition: 0.15s;
}

.row:hover {
  border-color: var(--gold-accent);
  background: rgba(255,255,255,0.06);
}

.row-logo {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  border-radius: 8px;
  background: rgba(255,255,255,0.05);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.row-logo img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.row-logo.missing {
  font-size: 0.6rem;
  color: #666;
  text-align: center;
  letter-spacing: 0.02em;
  line-height: 1.2;
}

.row-info {
  flex: 1;
  min-width: 0;
}

.row-name {
  font-weight: 400;
  font-size: 0.98rem;
  margin-bottom: 2px;
}

.row-address {
  font-size: 0.76rem;
  color: #999;
}

.row-ask {
  font-size: 0.76rem;
  color: var(--gold-accent);
  white-space: nowrap;
  flex-shrink: 0;
  max-width: 220px;
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
}

.row-arrow {
  flex-shrink: 0;
  font-size: 1.2rem;
  color: #666;
}

.row:hover .row-arrow { color: var(--gold-accent); }
</style>
</head>
<body>

<div class="header">
  <div class="kicker">Ras Tafari Inc &middot; Staff Tool</div>
  <h1>Plates for Purpose — Restaurant Directory</h1>
  <p>Click any restaurant to open its own ask page in a new tab, exactly as it appears when scanned from that restaurant's QR card.</p>
  <div id="ticker" class="ticker" hidden></div>
</div>

<div class="controls">
  <input type="text" id="filter-input" placeholder="Filter by restaurant name…">
</div>

<div id="state-message">Loading restaurants&hellip;</div>
<div class="list" id="list" hidden></div>

<script src="/assets/js/supabase-client.js"></script>
<script>
  const LOGOS_PUBLIC_BASE = 'https://xdjbgcqaynnzykrglgnf.supabase.co/storage/v1/object/public/plates-for-purpose-logos';
  let restaurants = [];

  async function init() {
    try {
      const client = await window.sfSupabaseReady;
      const { data, error } = await client
        .from('plates_for_purpose_restaurants_public')
        .select('slug, business_name, address, donation_ask, target_ask_value, logo_path')
        .order('business_name');
      if (error) throw error;
      restaurants = data || [];
    } catch (err) {
      console.error('Failed to load restaurants:', err);
      document.getElementById('state-message').textContent = 'Could not load the restaurant list. Check the console for details.';
      return;
    }

    if (!restaurants.length) {
      document.getElementById('state-message').textContent = 'No restaurants found in plates_for_purpose_restaurants yet.';
      return;
    }

    document.getElementById('state-message').hidden = true;
    document.getElementById('list').hidden = false;
    render(restaurants);
    loadTicker();
  }

  async function loadTicker() {
    const count = await window.sfSupabase.fetchPlatesForPurposeConfirmedCount();
    const withLogo = restaurants.filter((r) => r.logo_path).length;
    const ticker = document.getElementById('ticker');
    ticker.textContent = `${count} confirmed · ${withLogo} of ${restaurants.length} have a logo on file`;
    ticker.hidden = false;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
    );
  }

  function render(list) {
    const container = document.getElementById('list');
    container.innerHTML = '';
    list.forEach((r) => {
      const url = `/plates-for-purpose/ask/?r=${encodeURIComponent(r.slug)}`;
      const row = document.createElement('a');
      row.className = 'row';
      row.href = url;
      row.target = '_blank';
      row.rel = 'noopener';
      row.innerHTML = `
        <div class="row-logo${r.logo_path ? '' : ' missing'}">
          ${r.logo_path ? `<img src="${LOGOS_PUBLIC_BASE}/${r.logo_path}" alt="">` : 'no<br>logo'}
        </div>
        <div class="row-info">
          <div class="row-name">${escapeHtml(r.business_name)}</div>
          ${r.address ? `<div class="row-address">${escapeHtml(r.address)}</div>` : ''}
        </div>
        <div class="row-ask">${escapeHtml(r.donation_ask || '')}</div>
        <div class="row-arrow">&rarr;</div>
      `;
      container.appendChild(row);
    });
  }

  document.getElementById('filter-input').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    const filtered = q ? restaurants.filter((r) => r.business_name.toLowerCase().includes(q)) : restaurants;
    render(filtered);
  });

  init();
</script>
</body>
</html>
