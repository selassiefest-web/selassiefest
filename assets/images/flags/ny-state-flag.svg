<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#00308F"/>
  <ellipse cx="300" cy="195" rx="150" ry="120" fill="#FFFFFF"/>
  <ellipse cx="300" cy="195" rx="142" ry="112" fill="#F5F5F0"/>

  <!-- shield -->
  <path d="M 240 130 L 360 130 L 360 210 Q 360 250 300 270 Q 240 250 240 210 Z" fill="#FFFFFF" stroke="#00308F" stroke-width="4"/>

  <!-- sky band with sun -->
  <rect x="244" y="134" width="112" height="45" fill="#BFD9F2"/>
  <circle cx="300" cy="156" r="16" fill="#F4B400"/>

  <!-- mountains -->
  <polygon points="244,179 275,150 300,179" fill="#4C7A3D"/>
  <polygon points="300,179 330,148 356,179" fill="#3D6630"/>

  <!-- river with ship -->
  <rect x="244" y="179" width="112" height="55" fill="#7FAEDC"/>
  <polygon points="285,205 315,205 305,222 295,222" fill="#5A3A22"/>
  <line x1="300" y1="192" x2="300" y2="205" stroke="#5A3A22" stroke-width="3"/>
  <polygon points="300,192 314,200 300,205" fill="#EDEDED"/>

  <!-- ribbon -->
  <path d="M 220 268 L 380 268 L 365 288 L 235 288 Z" fill="#C8102E"/>
  <text x="300" y="283" font-family="Georgia, serif" font-size="15" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">EXCELSIOR</text>

  <!-- flanking figures, simplified as abstract silhouettes -->
  <ellipse cx="215" cy="200" rx="16" ry="55" fill="#00308F" opacity="0.85"/>
  <ellipse cx="385" cy="200" rx="16" ry="55" fill="#00308F" opacity="0.85"/>
  <circle cx="215" cy="140" r="12" fill="#E8C39E"/>
  <circle cx="385" cy="140" r="12" fill="#E8C39E"/>
</svg>
