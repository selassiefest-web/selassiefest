<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Signed Letter of Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{ --bg:#eceee9; --fg:#1b201c; --muted:#5b645d; --accent:#1f7a45; --accent-ink:#fff; --red:#b8322a; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#111412; --fg:#e7ece8; --muted:#9ba69e; --accent:#6dcf95; --accent-ink:#0f1a13; --red:#f07a70; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#111412; --fg:#e7ece8; --muted:#9ba69e; --accent:#6dcf95; --accent-ink:#0f1a13; --red:#f07a70; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Source Serif 4",Georgia,serif}
.bar{max-width:820px;margin:0 auto;padding-block:18px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-family:"Archivo",system-ui,sans-serif}
.bar button{font:700 1rem "Archivo",system-ui,sans-serif;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 16px;cursor:pointer}
.bar span{color:var(--muted);font-size:.92rem}
.paper{max-width:820px;margin:0 auto 48px;background:#fff;color:#161616;padding:clamp(24px,6vw,64px);box-shadow:0 1px 4px rgba(0,0,0,.18);font-size:16.5px;line-height:1.65}
.lh{border-bottom:2px solid #1f7a45;padding-bottom:10px;margin-bottom:22px}
.lh b{font:800 1.3rem "Archivo",system-ui,sans-serif;display:block}
.lh span{color:#555;font-size:.92rem}
.paper p{margin:0 0 14px}
.sig{height:64px;display:flex;align-items:flex-end;margin-top:6px}
.sig img{max-height:62px}
.foot{margin-top:28px;border-top:1px solid #ddd;padding-top:10px;font:12px/1.4 "Archivo",system-ui,sans-serif;color:#666}
.err{max-width:820px;margin:40px auto;padding:0 16px;color:var(--red);font-family:"Archivo",system-ui,sans-serif}
@media print{ @page{size:letter;margin:.7in} body{background:#fff} .bar{display:none} .paper{box-shadow:none;padding:0;max-width:none;margin:0} }
</style>
</head>
<body>
<div class="bar"><span>Signed letter of support &middot; print or save it as a PDF to attach to an application.</span><button type="button" id="print">Print / save as PDF</button></div>
<div class="paper" id="paper" hidden></div>
<p class="err" id="err" hidden></p>
<script src="/assets/js/supabase-client.js"></script>
<script>
(function(){
  var esc = function(s){ return String(s || "").replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); };
  function list(a){ return a.length <= 1 ? (a[0] || "") : a.length === 2 ? a.join(" and ") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1]; }
  document.getElementById("print").addEventListener("click", function(){ window.print(); });
  var t = new URLSearchParams(location.search).get("t") || "";
  fetch(SUPABASE_URL + "/functions/v1/support-letter", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ action:"view", t: t }) })
    .then(function(r){ return r.json(); }).then(function(o){
      if (!o.ok) throw new Error(o.error || "This letter isn't available.");
      var L = o.letter, org = esc(L.org_name);
      var date = new Date(L.letter_date + "T12:00:00").toLocaleDateString("en-US", { month:"long", day:"numeric", year:"numeric" });
      var h = '<div class="lh"><b>' + org + '</b>' + (L.address ? '<span>' + esc(L.address) + '</span>' : '') + '</div>';
      h += '<p>' + date + '</p><p>To the grant review committees and the Chicago Park District:</p>';
      h += '<p>On behalf of ' + org + ', I am writing in support of Ras Tafari Inc. and ' + esc(list(L.programs)) + '. ' + esc(L.org_about) + '</p>';
      if (L.relationship) h += '<p>' + esc(L.relationship) + '</p>';
      h += '<p>' + esc(L.why).replace(/\n/g, "<br>") + '</p>';
      if (L.commitment) h += '<p>To help this work succeed, ' + org + ' will ' + esc(L.commitment.replace(/^we will\s+/i, "")) + '</p>';
      h += '<p>I am glad to recommend Ras Tafari Inc. and urge you to support this work.</p><p>Sincerely,</p>';
      h += '<div class="sig"><img alt="Signature of ' + esc(L.signer_name) + '" src="' + L.signature_png + '"></div>';
      h += '<p>' + esc(L.signer_name) + (L.signer_title ? '<br>' + esc(L.signer_title) : '') + '<br>' + org + '<br>' + esc(L.email) + (L.phone ? ' &middot; ' + esc(L.phone) : '') + '</p>';
      h += '<div class="foot">Signed electronically on ' + new Date(L.created_at).toLocaleString("en-US", { timeZone:"America/Chicago", month:"long", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" }) + ' CT through selassiefest.com. Letter ID ' + esc(L.id) + '.</div>';
      var p = document.getElementById("paper"); p.innerHTML = h; p.hidden = false;
      document.title = "Letter of Support: " + L.org_name;
    }).catch(function(e){ var x = document.getElementById("err"); x.textContent = e.message; x.hidden = false; });
})();
</script>
</body>
</html>
