<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Bylaws Revision Workspace | South Shore Cultural Center Advisory Council</title>
  <meta name="description" content="The Bylaws Subcommittee's working draft, proposals, and version history for the South Shore Cultural Center Advisory Council bylaws revision." />
  <link rel="icon" href="/sscc-bylaws/seal.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #fbf7ee; --panel: #ffffff; --ink: #1d1a15; --ink-2: #4a4338; --ink-3: #7a705f;
      --line: #e4dccb; --line-2: #d3c7ad; --black: #161410; --gold: #b8912f; --gold-2: #8a6a1c; --gold-soft: #f4ead0;
      --ins: #1c6b3f; --ins-bg: #e3f1e7; --del: #9b2c2c; --del-bg: #f7e3e0;
      --open: #2f5f8a; --open-bg: #e4edf6; --warn: #8a5a00; --warn-bg: #fbeed3;
      --radius: 8px; --shadow: 0 1px 2px rgba(29,26,21,.06), 0 4px 16px rgba(29,26,21,.05);
      --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
      --sans: Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #14120e; --panel: #1c1914; --ink: #efe8da; --ink-2: #cfc5b2; --ink-3: #9d927e;
        --line: #332d24; --line-2: #463e31; --black: #0b0a08; --gold: #d4b25a; --gold-2: #e5c878; --gold-soft: #2c2616;
        --ins: #7fd3a0; --ins-bg: #173424; --del: #f0a39a; --del-bg: #3a1c19;
        --open: #9cc4ea; --open-bg: #1b2a3a; --warn: #f0c46c; --warn-bg: #362b12;
        --shadow: none; color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --paper: #14120e; --panel: #1c1914; --ink: #efe8da; --ink-2: #cfc5b2; --ink-3: #9d927e;
      --line: #332d24; --line-2: #463e31; --black: #0b0a08; --gold: #d4b25a; --gold-2: #e5c878; --gold-soft: #2c2616;
      --ins: #7fd3a0; --ins-bg: #173424; --del: #f0a39a; --del-bg: #3a1c19;
      --open: #9cc4ea; --open-bg: #1b2a3a; --warn: #f0c46c; --warn-bg: #362b12;
      --shadow: none; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-padding-top: 120px; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
    a { color: var(--gold-2); }
    button, input, select, textarea { font: inherit; color: inherit; }
    h1, h2, h3 { margin: 0; font-weight: 600; }

    /* ---------- header ---------- */
    .masthead { background: var(--black); color: #f3ead6; border-bottom: 3px solid var(--gold); }
    .masthead-inner { max-width: 1240px; margin: 0 auto; padding: 18px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .seal { width: 58px; height: 58px; flex-shrink: 0; border-radius: 50%; }
    .titles { flex: 1 1 300px; min-width: 0; }
    .eyebrow { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: #d9bd72; font-weight: 600; }
    .titles h1 { font-family: var(--serif); font-size: 1.65rem; letter-spacing: 0.01em; line-height: 1.2; margin-top: 2px; }
    .status-line { font-size: 0.82rem; color: #c9bfa8; margin-top: 4px; }
    .status-line b { color: #f3ead6; font-weight: 600; }
    .who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.85rem; color: #c9bfa8; }
    .who .name { color: #f3ead6; font-weight: 500; }
    .role-chip { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; border: 1px solid #d9bd72; color: #d9bd72; padding: 1px 7px; border-radius: 999px; }

    .tabs { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
    .tabs-inner { max-width: 1240px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
    .tabs-inner::-webkit-scrollbar { display: none; }
    .tab { background: none; border: none; border-bottom: 3px solid transparent; padding: 13px 12px 10px; cursor: pointer; font-weight: 500; color: var(--ink-3); white-space: nowrap; font-size: 0.92rem; }
    .tab:hover { color: var(--ink); }
    .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
    .tab .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 5px; border-radius: 999px; background: var(--gold-soft); color: var(--gold-2); font-size: 0.72rem; font-weight: 600; text-align: center; }

    main { max-width: 1240px; margin: 0 auto; padding: 22px 20px 80px; }
    .view-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 16px; }
    .view-head h2 { font-family: var(--serif); font-size: 1.45rem; }
    .view-head p { margin: 4px 0 0; color: var(--ink-3); max-width: 70ch; font-size: 0.92rem; }

    /* ---------- controls ---------- */
    .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); padding: 7px 13px; border-radius: 6px; cursor: pointer; font-size: 0.86rem; font-weight: 500; text-decoration: none; white-space: nowrap; }
    .btn:hover { border-color: var(--gold); }
    .btn:focus-visible, .tab:focus-visible, .chip:focus-visible, .toc a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .btn.primary { background: var(--black); color: #f3ead6; border-color: var(--black); }
    :root[data-theme="dark"] .btn.primary { background: var(--gold); color: #14120e; border-color: var(--gold); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { background: var(--gold); color: #14120e; border-color: var(--gold); } }
    .btn.gold { background: var(--gold); border-color: var(--gold); color: #1d1a15; }
    .btn.ghost { background: transparent; }
    .btn.danger { color: var(--del); }
    .btn.small { padding: 4px 9px; font-size: 0.8rem; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .masthead .btn { background: transparent; color: #f3ead6; border-color: #6d5f3d; }
    .masthead .btn:hover { border-color: #d9bd72; }
    .field { display: grid; gap: 4px; }
    .field label, .label { font-size: 0.78rem; font-weight: 600; color: var(--ink-2); letter-spacing: 0.02em; }
    .field .hint { font-size: 0.78rem; color: var(--ink-3); }
    input[type="text"], input[type="email"], select, textarea {
      width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--panel);
    }
    textarea { resize: vertical; line-height: 1.5; }
    textarea.doc { font-family: var(--serif); font-size: 1rem; min-height: 220px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 22%, transparent); }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 4px 11px; font-size: 0.8rem; cursor: pointer; color: var(--ink-2); }
    .chip[aria-pressed="true"] { background: var(--black); color: #f3ead6; border-color: var(--black); }
    :root[data-theme="dark"] .chip[aria-pressed="true"] { background: var(--gold); color: #14120e; border-color: var(--gold); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { background: var(--gold); color: #14120e; border-color: var(--gold); } }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .toolbar .grow { flex: 1 1 200px; }
    .notice { border: 1px solid var(--line-2); border-left: 4px solid var(--gold); background: var(--gold-soft); padding: 10px 14px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 16px; }
    .notice.warn { border-left-color: var(--warn); background: var(--warn-bg); }
    .muted { color: var(--ink-3); }
    .empty { text-align: center; color: var(--ink-3); padding: 34px 16px; border: 1px dashed var(--line-2); border-radius: var(--radius); }

    /* ---------- badges ---------- */
    .badge { display: inline-block; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; background: var(--line); color: var(--ink-2); white-space: nowrap; }
    .b-open { background: var(--open-bg); color: var(--open); }
    .b-accepted, .b-resolved { background: var(--ins-bg); color: var(--ins); }
    .b-rejected { background: var(--del-bg); color: var(--del); }
    .b-deferred, .b-stale { background: var(--warn-bg); color: var(--warn); }
    .b-withdrawn { background: var(--line); color: var(--ink-3); }
    .b-kind { background: transparent; border: 1px solid var(--line-2); color: var(--ink-2); }

    /* ---------- draft / document ---------- */
    .doc-layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px; align-items: start; }
    .toc { position: sticky; top: 66px; max-height: calc(100vh - 86px); overflow: auto; font-size: 0.84rem; padding-right: 6px; }
    .toc .art { margin: 12px 0 4px; font-weight: 600; color: var(--ink); font-size: 0.8rem; letter-spacing: 0.02em; }
    .toc .art:first-child { margin-top: 0; }
    .toc a { display: flex; gap: 6px; justify-content: space-between; color: var(--ink-2); text-decoration: none; padding: 3px 6px; border-radius: 4px; }
    .toc a:hover { background: var(--gold-soft); }
    .toc a .n { color: var(--ink-3); font-variant-numeric: tabular-nums; margin-right: 4px; }
    .toc .dot { flex-shrink: 0; min-width: 18px; height: 18px; border-radius: 999px; background: var(--open-bg); color: var(--open); font-size: 0.68rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
    .toc-select { display: none; margin-bottom: 12px; }
    .paper { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 34px clamp(18px, 4vw, 54px) 40px; }
    .paper-title { text-align: center; font-family: var(--serif); margin-bottom: 26px; }
    .paper-title .t1 { font-size: 0.78rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-2); font-family: var(--sans); font-weight: 600; }
    .paper-title .t2 { font-size: 1.7rem; margin-top: 4px; }
    .paper-title .t3 { font-size: 0.85rem; color: var(--ink-3); margin-top: 4px; font-family: var(--sans); }
    .article-h { font-family: var(--serif); text-align: center; font-size: 1.12rem; letter-spacing: 0.06em; text-transform: uppercase; margin: 34px 0 6px; padding-top: 22px; border-top: 1px solid var(--line); }
    .article-h:first-of-type { border-top: none; padding-top: 0; margin-top: 8px; }
    .section { position: relative; padding: 14px 16px 12px; margin: 6px -16px; border-radius: 6px; scroll-margin-top: 80px; }
    .section:hover { background: color-mix(in srgb, var(--gold-soft) 45%, transparent); }
    .section.flash { animation: flash 1.6s ease; }
    @keyframes flash { 0%, 40% { background: var(--gold-soft); } 100% { background: transparent; } }
    .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .sec-title { font-family: var(--serif); font-size: 1.05rem; font-weight: 600; }
    .sec-title .num { color: var(--gold-2); }
    .sec-tools { display: flex; gap: 6px; align-items: center; opacity: 0.25; transition: opacity .15s; }
    .section:hover .sec-tools, .section:focus-within .sec-tools, .sec-tools.has-open { opacity: 1; }
    @media (hover: none) { .sec-tools { opacity: 1; } }
    .body { font-family: var(--serif); font-size: 1.02rem; line-height: 1.65; color: var(--ink); margin-top: 6px; }
    .body p { margin: 0 0 8px; }
    .body p.clause { padding-left: 22px; position: relative; }
    .body p.clause::before { content: ""; position: absolute; left: 6px; top: 0.72em; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
    .body p.lead { margin-bottom: 6px; }
    .ref { font-family: var(--sans); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; color: var(--ink-3); text-transform: uppercase; }

    /* ---------- redline ---------- */
    ins, .ins { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; background: var(--ins-bg); color: var(--ins); border-radius: 2px; }
    del, .del { text-decoration: line-through; background: var(--del-bg); color: var(--del); border-radius: 2px; }
    .redline { font-family: var(--serif); font-size: 1rem; line-height: 1.65; white-space: normal; }
    .redline .pb { display: block; height: 8px; }
    .redline .pb-mark { font-family: var(--sans); font-size: 0.75em; padding: 0 2px; }
    .whole-ins { background: var(--ins-bg); border-left: 3px solid var(--ins); padding: 8px 12px; border-radius: 4px; }
    .whole-del { background: var(--del-bg); border-left: 3px solid var(--del); padding: 8px 12px; border-radius: 4px; }
    .whole-del .body, .whole-del .sec-title { text-decoration: line-through; color: var(--del); }
    .legend { font-size: 0.78rem; color: var(--ink-3); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

    /* ---------- proposals ---------- */
    .cards { display: grid; gap: 14px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); scroll-margin-top: 80px; }
    .card.flash { animation: flash 1.6s ease; }
    .card-head { padding: 14px 18px 10px; display: grid; gap: 6px; }
    .card-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .pid { font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: 0.82rem; font-weight: 600; }
    .card-summary { font-family: var(--serif); font-size: 1.12rem; font-weight: 600; line-height: 1.35; }
    .meta { font-size: 0.8rem; color: var(--ink-3); }
    .card-body { padding: 4px 18px 14px; display: grid; gap: 12px; }
    .rationale { font-size: 0.9rem; color: var(--ink-2); border-left: 3px solid var(--line-2); padding: 2px 0 2px 12px; }
    .rationale .label { display: block; margin-bottom: 2px; }
    .decision { font-size: 0.86rem; background: var(--paper); border-radius: 6px; padding: 8px 12px; }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 18px; border-top: 1px solid var(--line); }
    .card-actions .spacer { flex: 1; }
    .thread { border-top: 1px solid var(--line); padding: 10px 18px 14px; display: grid; gap: 10px; }
    .thread summary { cursor: pointer; font-size: 0.84rem; font-weight: 500; color: var(--ink-2); }
    .comment { font-size: 0.9rem; }
    .comment .who2 { font-weight: 600; font-size: 0.82rem; }
    .comment .when { color: var(--ink-3); font-size: 0.76rem; margin-left: 6px; }
    .comment p { margin: 2px 0 0; white-space: pre-wrap; }
    .comment-form { display: flex; gap: 8px; align-items: flex-end; }
    .comment-form textarea { min-height: 42px; height: 42px; }

    /* ---------- versions ---------- */
    .timeline { display: grid; gap: 14px; }
    .ver { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
    .ver-top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .ver-label { font-family: var(--serif); font-size: 1.3rem; font-weight: 600; }
    .ver-current { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; background: var(--gold); color: #1d1a15; padding: 2px 8px; border-radius: 4px; }
    .ver-summary { margin: 6px 0 10px; }
    .change-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .change-list li { border-top: 1px solid var(--line); padding-top: 8px; font-size: 0.9rem; }
    .change-list details summary { cursor: pointer; }
    .change-list .redline { margin: 8px 0 4px; }
    .pending-box { border: 1px dashed var(--gold); border-radius: var(--radius); padding: 14px 18px; background: var(--gold-soft); margin-bottom: 16px; display: grid; gap: 10px; }
    .pending-box .row { display: grid; grid-template-columns: 140px minmax(0, 1fr) auto; gap: 10px; align-items: end; }

    .compare-row { display: grid; grid-template-columns: repeat(2, minmax(0, 200px)) auto; gap: 10px; align-items: end; margin-bottom: 16px; }
    .diff-sec { border-top: 1px solid var(--line); padding: 14px 0; }
    .diff-sec:first-child { border-top: none; }

    /* ---------- members / about ---------- */
    .grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 24px; align-items: start; }
    .member-list { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
    .member-list li { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
    .member-list li:first-child { border-top: none; }
    .member-list .grow { flex: 1; min-width: 0; }
    .member-list .email { font-size: 0.8rem; color: var(--ink-3); overflow-wrap: anywhere; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 12px; }
    .steps { counter-reset: s; list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    .steps li { counter-increment: s; position: relative; padding-left: 40px; }
    .steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--black); color: #d9bd72; font-weight: 600; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; }
    .prose { max-width: 72ch; }
    .prose p { margin: 0 0 12px; }

    /* ---------- modal ---------- */
    dialog { border: 1px solid var(--line-2); border-radius: 10px; padding: 0; width: min(860px, calc(100vw - 24px)); max-height: calc(100vh - 32px); background: var(--panel); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.28); }
    dialog::backdrop { background: rgba(20,18,14,.55); }
    .dlg { display: grid; grid-template-rows: auto 1fr auto; max-height: calc(100vh - 34px); }
    .dlg-head { padding: 16px 20px 10px; border-bottom: 1px solid var(--line); }
    .dlg-head h3 { font-family: var(--serif); font-size: 1.2rem; }
    .dlg-body { padding: 16px 20px; overflow: auto; display: grid; gap: 14px; }
    .dlg-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
    .dlg-foot .err { color: var(--del); font-size: 0.86rem; margin-right: auto; }
    .preview { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; background: var(--paper); }
    .kind-pick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .kind-pick label { border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 10px; cursor: pointer; font-size: 0.84rem; display: grid; gap: 2px; }
    .kind-pick label b { font-weight: 600; }
    .kind-pick label span { color: var(--ink-3); font-size: 0.76rem; }
    .kind-pick input { position: absolute; opacity: 0; pointer-events: none; }
    .kind-pick label:has(input:checked) { border-color: var(--gold); background: var(--gold-soft); }
    .kind-pick label:has(input:focus-visible) { outline: 2px solid var(--gold); outline-offset: 2px; }

    .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--black); color: #f3ead6; padding: 10px 16px; border-radius: 8px; font-size: 0.88rem; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: calc(100vw - 32px); }
    .toast.err { background: var(--del); color: #fff; }

    footer { max-width: 1240px; margin: 0 auto; padding: 0 20px 40px; color: var(--ink-3); font-size: 0.78rem; }

    /* ---------- packet / print ---------- */
    .packet .amend { border-top: 1px solid var(--line); padding: 16px 0; break-inside: avoid; }
    .packet .amend h4 { margin: 0 0 6px; font-family: var(--serif); font-size: 1.02rem; }
    .sig-block { display: grid; gap: 14px; margin-top: 22px; font-family: var(--serif); }
    .sig-block div { border-bottom: 1px solid var(--ink-3); padding-bottom: 4px; min-height: 30px; }
    @media print {
      .masthead, .tabs, footer, .no-print, .toast { display: none !important; }
      body { background: #fff; color: #000; font-size: 11pt; }
      main { padding: 0; max-width: none; }
      .paper, .card, .ver { box-shadow: none; border: none; padding: 0; }
      ins { color: #0a5a2a; background: none; } del { color: #8b1d1d; background: none; }
      a { color: inherit; text-decoration: none; }
    }

    @media (max-width: 900px) {
      .doc-layout { grid-template-columns: 1fr; }
      .toc { display: none; }
      .toc-select { display: block; }
      .grid-2 { grid-template-columns: 1fr; }
      .kind-pick { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      main { padding: 16px 16px 60px; }
      .masthead-inner { padding: 14px 16px; }
      .titles h1 { font-size: 1.3rem; }
      .seal { width: 46px; height: 46px; }
      .pending-box .row, .compare-row { grid-template-columns: 1fr; }
      .section { margin: 6px -8px; padding: 12px 8px; }
      .comment-form { flex-direction: column; align-items: stretch; }
    }
    @media (prefers-reduced-motion: reduce) { .section.flash, .card.flash { animation: none; } }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <img class="seal" src="/sscc-bylaws/seal.png" alt="South Shore Cultural Center Advisory Council seal" />
      <div class="titles">
        <div class="eyebrow">South Shore Cultural Center Advisory Council</div>
        <h1>Bylaws Revision Workspace</h1>
        <div class="status-line" id="status-line">Loading&hellip;</div>
      </div>
      <div class="who" id="who"></div>
    </div>
  </header>

  <nav class="tabs" aria-label="Workspace sections">
    <div class="tabs-inner" role="tablist">
      <button class="tab" role="tab" data-view="draft">Working draft</button>
      <button class="tab" role="tab" data-view="proposals">Proposals<span class="count" id="count-open" hidden></span></button>
      <button class="tab" role="tab" data-view="versions">Versions</button>
      <button class="tab" role="tab" data-view="compare">Compare</button>
      <button class="tab" role="tab" data-view="packet">Adoption packet</button>
      <button class="tab" role="tab" data-view="members">Subcommittee</button>
      <button class="tab" role="tab" data-view="about">How this works</button>
    </div>
  </nav>

  <main id="main" tabindex="-1"><p class="muted">Loading the bylaws&hellip;</p></main>

  <footer>A working space for the Bylaws Subcommittee. Nothing here is adopted until the voting membership adopts it under Article X of the bylaws.</footer>

  <dialog id="dlg"></dialog>

  <script src="/assets/js/supabase-client.js"></script>
  <script>
  (function () {
    'use strict';
    const FN_URL = 'https://xdjbgcqaynnzykrglgnf.supabase.co/functions/v1/sscc-bylaws-login';
    const SESSION_KEY = 'sscc_bylaws_session';
    const main = document.getElementById('main');
    const dlg = document.getElementById('dlg');

    const S = {
      pub: null,          // { draft, versions, pending_changes }
      member: null,       // { me, proposals, members } when signed in
      token: null,
      view: 'draft',
      filter: { status: 'open', article: '', q: '' },
      draftCompare: '',   // version num to show changes against in the draft
      compare: { from: '', to: 'draft' },
      packet: { from: '', to: 'draft', clean: false },
    };

    // ---------------- utils ----------------
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const $ = (sel, root) => (root || document).querySelector(sel);
    const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
    const fmtDate = (d) => new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const fmtWhen = (d) => new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    const paras = (body) => String(body || '').split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
    const KIND = { amend: 'Amend', add: 'Add section', delete: 'Delete section', issue: 'Issue' };
    const STATUS = ['open', 'deferred', 'accepted', 'rejected', 'resolved', 'withdrawn'];
    let toastTimer;
    function toast(msg, isErr) {
      let t = $('.toast');
      if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
      t.textContent = msg; t.classList.toggle('err', !!isErr); t.hidden = false;
      clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, isErr ? 6000 : 3000);
    }
    function errMsg(e) {
      const m = (e && (e.message || e.error_description)) || String(e);
      if (/not signed in/.test(m)) return 'Your session has ended. Please sign in again.';
      return m.replace(/^stale: /, '');
    }

    function renderBody(body) {
      return paras(body).map((p) => `<p class="${/:$/.test(p) ? 'lead' : 'clause'}">${esc(p)}</p>`).join('');
    }

    // ---------------- word diff ----------------
    function tokenize(text) {
      const out = [];
      String(text || '').split(/(\n\s*\n)/).forEach((chunk, i) => {
        if (i % 2 === 1) { out.push('\n\n'); return; }
        (chunk.match(/\s+|[^\s]+/g) || []).forEach((t) => out.push(/^\s+$/.test(t) ? ' ' : t));
      });
      return out;
    }
    function diffTokens(a, b) {
      const n = a.length, m = b.length;
      // trim common prefix/suffix to keep the table small
      let pre = 0; while (pre < n && pre < m && a[pre] === b[pre]) pre++;
      let suf = 0; while (suf < n - pre && suf < m - pre && a[n - 1 - suf] === b[m - 1 - suf]) suf++;
      const A = a.slice(pre, n - suf), B = b.slice(pre, m - suf);
      const rows = A.length + 1, cols = B.length + 1;
      const L = new Uint16Array(rows * cols);
      for (let i = A.length - 1; i >= 0; i--)
        for (let j = B.length - 1; j >= 0; j--)
          L[i * cols + j] = A[i] === B[j] ? L[(i + 1) * cols + j + 1] + 1 : Math.max(L[(i + 1) * cols + j], L[i * cols + j + 1]);
      const ops = a.slice(0, pre).map((t) => ['=', t]);
      let i = 0, j = 0;
      while (i < A.length && j < B.length) {
        if (A[i] === B[j]) { ops.push(['=', A[i]]); i++; j++; }
        else if (L[(i + 1) * cols + j] >= L[i * cols + j + 1]) ops.push(['-', A[i++]]);
        else ops.push(['+', B[j++]]);
      }
      while (i < A.length) ops.push(['-', A[i++]]);
      while (j < B.length) ops.push(['+', B[j++]]);
      a.slice(n - suf).forEach((t) => ops.push(['=', t]));
      return ops;
    }
    function redline(oldText, newText) {
      const ops = diffTokens(tokenize(oldText), tokenize(newText));
      // merge runs, and let a lone space between two changes join them
      const runs = [];
      ops.forEach(([op, t]) => {
        const last = runs[runs.length - 1];
        if (last && last.op === op) last.t.push(t); else runs.push({ op, t: [t] });
      });
      for (let k = 1; k < runs.length - 1; k++) {
        const r = runs[k];
        if (r.op === '=' && r.t.length === 1 && r.t[0] === ' ' && runs[k - 1].op !== '=' && runs[k + 1].op !== '=') {
          r.op = 'both';
        }
      }
      const piece = (t, mark) => t.map((x) => x === '\n\n' ? (mark ? `<span class="pb-mark">&para;</span><span class="pb"></span>` : '<span class="pb"></span>') : esc(x)).join('');
      return runs.map((r) => {
        if (r.op === '=') return piece(r.t, false);
        if (r.op === 'both') return ' ';
        const tag = r.op === '+' ? 'ins' : 'del';
        return `<${tag}>${piece(r.t, true)}</${tag}>`;
      }).join('');
    }
    function titleRedline(oldT, newT) { return oldT === newT ? esc(newT) : redline(oldT, newT); }

    // ---------------- data ----------------
    let client;
    async function rpc(name, args) {
      client = client || await window.sfSupabaseReady;
      const { data, error } = await client.rpc(name, args || {});
      if (error) throw error;
      return data;
    }
    async function loadPublic() { S.pub = await rpc('sscc_bylaws_public'); }
    async function loadMember() {
      if (!S.token) { S.member = null; return; }
      try { S.member = await rpc('sscc_bylaws_member_state', { p_token: S.token }); }
      catch (e) {
        if (/not signed in/.test(e.message || '')) { signOut(true); return; }
        throw e;
      }
    }
    async function refresh() {
      await Promise.all([loadPublic(), loadMember()]);
      render();
    }

    const draft = () => S.pub ? S.pub.draft : [];
    const versions = () => S.pub ? S.pub.versions : [];
    const latest = () => versions()[versions().length - 1];
    const secByKey = (list, key) => list.find((s) => s.key === key);
    const isChair = () => !!(S.member && S.member.me.role === 'chair');
    const signedIn = () => !!S.member;
    const ref = (s) => s ? `${s.article_num}.${s.section_num}` : '';
    function refFor(key, fallbackArticle) {
      const s = secByKey(draft(), key);
      if (s) return { text: `Art. ${s.article_num} §${s.section_num}`, title: s.title, sec: s };
      for (const v of versions().slice().reverse()) {
        const o = secByKey(v.snapshot, key);
        if (o) return { text: `Art. ${o.article_num} §${o.section_num}`, title: o.title, sec: null, gone: true };
      }
      return { text: `Art. ${fallbackArticle}`, title: '', sec: null, gone: true };
    }
    function isStale(p) {
      if (!['amend', 'delete'].includes(p.kind) || !['open', 'deferred'].includes(p.status)) return false;
      const s = secByKey(draft(), p.section_key);
      return !s || s.body !== p.base_body || s.title !== p.base_title;
    }
    const openCount = (key) => S.member ? S.member.proposals.filter((p) => p.section_key === key && p.status === 'open').length : 0;
    function snapshotFor(which) {
      if (which === 'draft' || which === '') return which === 'draft' ? draft() : (versions()[0] || {}).snapshot || [];
      const v = versions().find((x) => String(x.num) === String(which));
      return v ? v.snapshot : [];
    }
    const labelFor = (which) => which === 'draft' ? 'Working draft' : ((versions().find((x) => String(x.num) === String(which)) || {}).label || '');

    // ---------------- auth ----------------
    async function handleSigninParam() {
      const url = new URL(location.href);
      const t = url.searchParams.get('signin');
      if (!t) return;
      url.searchParams.delete('signin');
      history.replaceState(null, '', url.pathname + url.search + url.hash);
      try {
        const rows = await rpc('sscc_bylaws_verify', { p_token: t });
        if (rows && rows[0]) {
          S.token = rows[0].session_token;
          try { localStorage.setItem(SESSION_KEY, S.token); } catch (e) {}
          toast(`Signed in as ${rows[0].display_name}.`);
        } else {
          toast('That sign-in link has expired or was already replaced. Request a new one.', true);
        }
      } catch (e) { toast(errMsg(e), true); }
    }
    function signOut(expired) {
      S.token = null; S.member = null;
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
      if (expired) toast('Your session has ended. Please sign in again.', true);
      render();
    }
    function openSignIn() {
      dlg.innerHTML = `<form class="dlg" method="dialog" id="signin-form">
        <div class="dlg-head"><h3>Sign in</h3></div>
        <div class="dlg-body">
          <p class="muted" style="margin:0;">Subcommittee members sign in with the email address the chair added. We'll email you a link; it works for 30 minutes, and this browser stays signed in after that.</p>
          <div class="field"><label for="si-email">Email</label><input type="email" id="si-email" required autocomplete="email" /></div>
          <p id="si-msg" class="muted" style="margin:0;" aria-live="polite"></p>
        </div>
        <div class="dlg-foot"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary" id="si-go">Email me a link</button></div>
      </form>`;
      bindClose();
      $('#signin-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = $('#si-email').value.trim();
        const msg = $('#si-msg'); const go = $('#si-go');
        go.disabled = true; msg.textContent = 'Sending…'; msg.style.color = '';
        try {
          const res = await fetch(FN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
          const body = await res.json().catch(() => ({}));
          if (res.ok) { msg.textContent = `Check ${email} for your sign-in link.`; go.textContent = 'Send again'; }
          else {
            msg.style.color = 'var(--del)';
            msg.textContent = ({
              not_a_member: "That email isn't on the subcommittee list. Ask the chair to add you.",
              too_many_requests: 'Too many links requested in the last hour. Use the most recent email, or try later.',
              invalid_email: 'Please enter a valid email address.',
            })[body.error] || 'Could not send the link. Please try again.';
          }
        } catch (err) { msg.style.color = 'var(--del)'; msg.textContent = 'Could not reach the server. Check your connection.'; }
        go.disabled = false;
      });
      dlg.showModal();
      $('#si-email').focus();
    }
    function bindClose() { $$('[data-close]', dlg).forEach((b) => b.addEventListener('click', () => dlg.close())); }

    // ---------------- chrome ----------------
    function renderChrome() {
      const v = latest();
      const pending = S.pub ? S.pub.pending_changes : 0;
      $('#status-line').innerHTML = v
        ? `Current version <b>${esc(v.label)}</b> &middot; ${fmtDate(v.created_at)}` +
          (pending ? ` &middot; <b>${pending}</b> accepted change${pending === 1 ? '' : 's'} in the draft, not yet in a version` : ' &middot; draft matches this version')
        : '';
      const who = $('#who');
      if (S.member) {
        who.innerHTML = `<span class="name">${esc(S.member.me.display_name)}</span>${S.member.me.role === 'chair' ? '<span class="role-chip">Chair</span>' : ''}<button class="btn small" id="signout">Sign out</button>`;
        $('#signout').onclick = () => signOut(false);
      } else {
        who.innerHTML = `<button class="btn" id="signin">Subcommittee sign in</button>`;
        $('#signin').onclick = openSignIn;
      }
      const oc = $('#count-open');
      const n = S.member ? S.member.proposals.filter((p) => p.status === 'open').length : 0;
      oc.hidden = !n; oc.textContent = n;
      $$('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.view === S.view)));
    }

    // ---------------- routing ----------------
    function go(view, focus) {
      S.view = view;
      const h = '#' + view + (focus ? '/' + focus : '');
      if (location.hash !== h) history.pushState(null, '', h);
      render(focus);
      window.scrollTo({ top: 0 });
    }
    function fromHash() {
      const [view, focus] = location.hash.replace(/^#/, '').split('/');
      const views = $$('.tab').map((t) => t.dataset.view);
      S.view = views.includes(view) ? view : 'draft';
      return focus;
    }
    $$('.tab').forEach((t) => t.addEventListener('click', () => go(t.dataset.view)));
    window.addEventListener('popstate', () => render(fromHash()));

    function render(focus) {
      renderChrome();
      if (!S.pub) return;
      ({ draft: viewDraft, proposals: viewProposals, versions: viewVersions, compare: viewCompare,
         packet: viewPacket, members: viewMembers, about: viewAbout })[S.view](focus);
      if (S.member && !/\s/.test(S.member.me.display_name.trim())) {
        const box = document.createElement('form');
        box.className = 'notice no-print'; box.id = 'name-prompt';
        box.innerHTML = `<b>Welcome! Please add your name</b> so the committee knows who wrote each proposal and comment.
          <div class="toolbar" style="margin:8px 0 0;"><input type="text" id="np-name" class="grow" placeholder="Your full name" required maxlength="80" aria-label="Your full name" /><button class="btn primary">Save my name</button></div>`;
        main.prepend(box);
        box.addEventListener('submit', (e) => { e.preventDefault(); saveMyName($('#np-name').value); });
      }
      if (focus) {
        const el = document.getElementById(focus);
        if (el) { el.scrollIntoView({ block: 'start' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1700); }
      }
    }

    // ---------------- view: draft ----------------
    function groupByArticle(list) {
      const arts = [];
      list.forEach((s) => {
        let a = arts[arts.length - 1];
        if (!a || a.num !== s.article_num) { a = { num: s.article_num, title: s.article_title, sections: [] }; arts.push(a); }
        a.sections.push(s);
      });
      return arts;
    }
    function viewDraft() {
      const list = draft();
      const arts = groupByArticle(list);
      const cmpNum = S.draftCompare;
      const base = cmpNum ? snapshotFor(cmpNum) : null;
      const vOpts = versions().map((v) => `<option value="${v.num}" ${String(v.num) === String(cmpNum) ? 'selected' : ''}>${esc(v.label)}</option>`).join('');
      let changed = 0;
      const sectionHtml = (s) => {
        let titleHtml = esc(s.title), bodyHtml = renderBody(s.body), note = '';
        if (base) {
          const o = secByKey(base, s.key);
          if (!o) { note = '<span class="badge b-accepted">New</span>'; bodyHtml = `<div class="whole-ins">${renderBody(s.body)}</div>`; changed++; }
          else if (o.body !== s.body || o.title !== s.title) {
            titleHtml = titleRedline(o.title, s.title); bodyHtml = `<div class="redline">${redline(o.body, s.body)}</div>`;
            note = '<span class="badge b-deferred">Changed</span>'; changed++;
          }
        }
        const n = openCount(s.key);
        const tools = signedIn()
          ? `<div class="sec-tools ${n ? 'has-open' : ''} no-print">
               ${n ? `<a class="btn small ghost" href="#proposals" data-sec-filter="${esc(s.key)}">${n} open</a>` : ''}
               <button class="btn small" data-propose="${esc(s.key)}">Propose change</button>
             </div>` : '';
        return `<section class="section" id="sec-${esc(s.key)}">
            <div class="sec-head"><div class="sec-title"><span class="num">Section ${s.section_num}.</span> ${titleHtml} ${note}</div>${tools}</div>
            <div class="body">${bodyHtml}</div>
          </section>`;
      };
      const removed = base ? base.filter((o) => !secByKey(list, o.key)) : [];
      main.innerHTML = `
        <div class="view-head">
          <div><h2>Working draft</h2>
          <p>The bylaws as they stand with every accepted change applied. ${signedIn() ? 'Hover over a section to propose a change to it.' : 'Subcommittee members can sign in to propose changes.'}</p></div>
          <div class="toolbar no-print" style="margin:0;">
            <label class="label" for="draft-cmp">Show changes since</label>
            <select id="draft-cmp" style="width:auto;"><option value="">(off)</option>${vOpts}</select>
            <button class="btn" id="draft-print">Print</button>
          </div>
        </div>
        ${base ? `<div class="notice">${changed + removed.length ? `<b>${changed + removed.length}</b> section${changed + removed.length === 1 ? '' : 's'} changed since ${esc(labelFor(cmpNum))}.` : `No changes since ${esc(labelFor(cmpNum))}.`}
          <span class="legend" style="display:inline-flex;margin-left:8px;"><ins>added</ins><del>removed</del></span></div>` : ''}
        ${removed.length ? `<div class="notice warn">Removed since ${esc(labelFor(cmpNum))}: ${removed.map((o) => `Art. ${esc(o.article_num)} §${o.section_num} ${esc(o.title)}`).join('; ')}</div>` : ''}
        <select class="toc-select no-print" id="toc-select" aria-label="Jump to section"><option value="">Jump to a section…</option>
          ${arts.map((a) => `<optgroup label="Article ${esc(a.num)}: ${esc(a.title)}">${a.sections.map((s) => `<option value="sec-${esc(s.key)}">${esc(a.num)}.${s.section_num} ${esc(s.title)}</option>`).join('')}</optgroup>`).join('')}
        </select>
        <div class="doc-layout">
          <nav class="toc no-print" aria-label="Table of contents">
            ${arts.map((a) => `<div class="art">Article ${esc(a.num)} &middot; ${esc(a.title)}</div>
              ${a.sections.map((s) => { const n = openCount(s.key); return `<a href="#draft/sec-${esc(s.key)}" data-jump="sec-${esc(s.key)}"><span><span class="n">${s.section_num}.</span>${esc(s.title)}</span>${n ? `<span class="dot" title="${n} open proposal${n === 1 ? '' : 's'}">${n}</span>` : ''}</a>`; }).join('')}`).join('')}
          </nav>
          <article class="paper">
            <div class="paper-title"><div class="t1">Bylaws of the</div><div class="t2">South Shore Cultural Center Advisory Council</div>
              <div class="t3">Working draft${latest() ? ` &middot; based on ${esc(latest().label)}` : ''}${S.pub.pending_changes ? ` plus ${S.pub.pending_changes} accepted change${S.pub.pending_changes === 1 ? '' : 's'}` : ''}</div></div>
            ${arts.map((a) => `<h3 class="article-h">Article ${esc(a.num)} &mdash; ${esc(a.title)}</h3>${a.sections.map(sectionHtml).join('')}`).join('')}
          </article>
        </div>`;
      $('#draft-cmp').onchange = (e) => { S.draftCompare = e.target.value; render(); };
      $('#draft-print').onclick = () => window.print();
      $('#toc-select').onchange = (e) => { const el = document.getElementById(e.target.value); if (el) el.scrollIntoView(); };
      $$('[data-jump]').forEach((a) => a.addEventListener('click', (e) => {
        e.preventDefault(); const el = document.getElementById(a.dataset.jump);
        if (el) { el.scrollIntoView({ behavior: 'smooth' }); history.replaceState(null, '', '#draft/' + a.dataset.jump); }
      }));
      $$('[data-propose]').forEach((b) => b.addEventListener('click', () => openProposalEditor({ sectionKey: b.dataset.propose })));
      $$('[data-sec-filter]').forEach((a) => a.addEventListener('click', (e) => {
        e.preventDefault(); S.filter = { status: 'open', article: '', q: '', section: a.dataset.secFilter }; go('proposals');
      }));
    }

    // ---------------- proposal editor ----------------
    function openProposalEditor({ sectionKey, proposal }) {
      const editing = !!proposal;
      const kind0 = editing ? proposal.kind : 'amend';
      const s = secByKey(draft(), editing ? proposal.section_key : sectionKey);
      if (!s && (!editing || proposal.kind !== 'add')) { toast('That section is no longer in the draft.', true); return; }
      const stale = editing && isStale(proposal);
      const baseTitle = () => (editing && !rebase.checked && proposal.base_title != null) ? proposal.base_title : s.title;
      const baseBody = () => (editing && !rebase.checked && proposal.base_body != null) ? proposal.base_body : s.body;
      dlg.innerHTML = `<form class="dlg" id="prop-form">
        <div class="dlg-head"><div class="ref">Article ${esc(s.article_num)} &middot; Section ${s.section_num}</div><h3>${editing ? `Edit proposal #${proposal.id}` : 'Propose a change'}: ${esc(s.title)}</h3></div>
        <div class="dlg-body">
          ${editing ? '' : `<div class="kind-pick" role="radiogroup" aria-label="Kind of change">
            <label><input type="radio" name="kind" value="amend" checked /><b>Amend wording</b><span>Change this section's title or text</span></label>
            <label><input type="radio" name="kind" value="add" /><b>Add a section</b><span>Insert a new section after this one</span></label>
            <label><input type="radio" name="kind" value="delete" /><b>Delete</b><span>Remove this section</span></label>
            <label><input type="radio" name="kind" value="issue" /><b>Flag an issue</b><span>Raise a question, no wording yet</span></label>
          </div>`}
          ${stale ? `<div class="notice warn" style="margin:0;">This section has changed since the proposal was written. <label><input type="checkbox" id="rebase" /> Update the proposal to the current text</label> (your edits below are kept; review the preview).</div>` : '<input type="checkbox" id="rebase" hidden />'}
          <div class="field" data-for="amend add"><label for="p-title">Section title</label><input type="text" id="p-title" /></div>
          <div class="field" data-for="amend add"><label for="p-body">Text</label>
            <textarea class="doc" id="p-body"></textarea>
            <span class="hint">Separate paragraphs with a blank line. A paragraph ending in a colon introduces the clauses under it.</span></div>
          <div class="field" data-for="amend add delete"><span class="label">Preview</span><div class="preview" id="p-preview"></div></div>
          <div class="field"><label for="p-summary">One-line summary <span class="muted">(shown in the change log)</span></label>
            <input type="text" id="p-summary" maxlength="160" placeholder="e.g. Define the notice period for bylaw amendments" required /></div>
          <div class="field"><label for="p-rationale">Why? <span class="muted">(what problem this solves, sources such as CPD guidelines)</span></label>
            <textarea id="p-rationale" rows="3"></textarea></div>
        </div>
        <div class="dlg-foot"><span class="err" id="p-err" aria-live="polite"></span><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary" id="p-save">${editing ? 'Save changes' : 'Submit proposal'}</button></div>
      </form>`;
      bindClose();
      const rebase = $('#rebase');
      const kind = () => editing ? kind0 : $('input[name="kind"]:checked').value;
      const tIn = $('#p-title'), bIn = $('#p-body');
      function fill() {
        const k = kind();
        if (editing) { tIn.value = proposal.proposed_title || ''; bIn.value = proposal.proposed_body || ''; }
        else if (k === 'amend') { tIn.value = s.title; bIn.value = s.body; }
        else if (k === 'add') { tIn.value = ''; bIn.value = ''; }
      }
      function update() {
        const k = kind();
        $$('[data-for]', dlg).forEach((f) => { f.hidden = !f.dataset.for.split(' ').includes(k); });
        const pv = $('#p-preview');
        if (k === 'amend') pv.innerHTML = `<div class="sec-title">${titleRedline(baseTitle(), tIn.value.trim())}</div><div class="redline">${redline(baseBody(), bIn.value.trim())}</div>`;
        else if (k === 'add') pv.innerHTML = `<div class="whole-ins"><div class="sec-title">New Section ${s.section_num + 1}. ${esc(tIn.value)}</div><div class="body">${renderBody(bIn.value)}</div></div>`;
        else if (k === 'delete') pv.innerHTML = `<div class="whole-del"><div class="sec-title">${esc(baseTitle())}</div><div class="body">${renderBody(baseBody())}</div></div>`;
      }
      fill(); update();
      if (editing) { $('#p-summary').value = proposal.summary || ''; $('#p-rationale').value = proposal.rationale || ''; }
      $$('input[name="kind"]', dlg).forEach((r) => r.addEventListener('change', () => { fill(); update(); }));
      [tIn, bIn].forEach((el) => el.addEventListener('input', update));
      rebase.addEventListener('change', update);
      $('#prop-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = $('#p-save'); btn.disabled = true; $('#p-err').textContent = '';
        try {
          if (editing) {
            await rpc('sscc_bylaws_edit_proposal', { p_token: S.token, p_id: proposal.id, p_proposed_title: tIn.value, p_proposed_body: bIn.value,
              p_summary: $('#p-summary').value, p_rationale: $('#p-rationale').value, p_rebase: !!rebase.checked });
            dlg.close(); toast('Proposal updated.'); await refresh(); go('proposals', 'p-' + proposal.id);
          } else {
            const id = await rpc('sscc_bylaws_propose', { p_token: S.token, p_kind: kind(), p_section_key: s.key,
              p_proposed_title: tIn.value, p_proposed_body: bIn.value, p_summary: $('#p-summary').value, p_rationale: $('#p-rationale').value });
            dlg.close(); toast(`Proposal #${id} submitted.`); S.filter = { status: 'open', article: '', q: '' };
            await refresh(); go('proposals', 'p-' + id);
          }
        } catch (err) { $('#p-err').textContent = errMsg(err); btn.disabled = false; }
      });
      dlg.showModal();
      (editing || kind() !== 'amend' ? $('#p-summary') : bIn).focus();
    }

    // ---------------- view: proposals ----------------
    function proposalChangeHtml(p) {
      const s = secByKey(draft(), p.section_key);
      if (p.kind === 'amend') return `<div><div class="sec-title">${titleRedline(p.base_title, p.proposed_title)}</div><div class="redline">${redline(p.base_body, p.proposed_body)}</div></div>`;
      if (p.kind === 'add') return `<div class="whole-ins"><div class="sec-title">${esc(p.proposed_title)}</div><div class="body">${renderBody(p.proposed_body)}</div></div>`;
      if (p.kind === 'delete') return `<div class="whole-del"><div class="sec-title">${esc(p.base_title)}</div><div class="body">${renderBody(p.base_body)}</div></div>`;
      return s ? `<details><summary class="muted" style="cursor:pointer;font-size:0.84rem;">Show the section's current text</summary><div class="body" style="margin-top:6px;">${renderBody(s.body)}</div></details>` : '';
    }
    function proposalCard(p) {
      const r = refFor(p.section_key, p.article_num);
      const stale = isStale(p);
      const where = p.kind === 'add' && p.status !== 'accepted' ? `after ${r.text}` : r.text;
      const chair = isChair();
      const canDecide = chair && !['withdrawn'].includes(p.status) && !(p.status === 'accepted' && p.kind !== 'issue');
      const actions = [];
      if (p.mine && ['open', 'deferred'].includes(p.status)) {
        actions.push(`<button class="btn small" data-edit="${p.id}">${stale ? 'Update to current text' : 'Edit'}</button>`);
        actions.push(`<button class="btn small ghost danger" data-withdraw="${p.id}">Withdraw</button>`);
      } else if (chair && ['open', 'deferred'].includes(p.status) && p.kind !== 'issue') {
        actions.push(`<button class="btn small ghost" data-edit="${p.id}">Edit as chair</button>`);
      }
      let decide = '';
      if (canDecide) {
        const opts = p.kind === 'issue'
          ? (p.status === 'resolved' ? [['open', 'Reopen']] : [['resolved', 'Mark resolved'], ['deferred', 'Defer']].filter(([v]) => v !== p.status).concat(p.status === 'deferred' ? [['open', 'Reopen']] : []))
          : (['rejected', 'deferred'].includes(p.status) ? [['open', 'Reopen']] : [['accepted', 'Accept into draft'], ['rejected', 'Reject'], ['deferred', 'Defer']]);
        decide = `<span class="spacer"></span><input type="text" class="note-in" data-note="${p.id}" placeholder="Decision note (optional)" style="width:min(260px,100%);" />
          ${opts.map(([v, l]) => `<button class="btn small ${v === 'accepted' || v === 'resolved' ? 'gold' : ''}" data-decide="${p.id}" data-val="${v}" ${v === 'accepted' && stale ? 'disabled title="The author needs to update this to the current text first"' : ''}>${l}</button>`).join('')}`;
      }
      const decided = p.decided_at && p.status !== 'open'
        ? `<div class="decision"><b>${esc(p.status[0].toUpperCase() + p.status.slice(1))}</b> by ${esc(p.decided_by || '')} on ${fmtDate(p.decided_at)}${p.in_version ? ` &middot; in ${esc((versions().find((v) => v.num === p.in_version) || {}).label || '')}` : (p.status === 'accepted' && p.kind !== 'issue' ? ' &middot; in the working draft, not yet in a version' : '')}${p.decision_note ? `<div>${esc(p.decision_note)}</div>` : ''}</div>` : '';
      return `<article class="card" id="p-${p.id}">
        <div class="card-head">
          <div class="card-top"><span class="pid">#${p.id}</span><span class="badge b-${p.status}">${p.status}</span><span class="badge b-kind">${KIND[p.kind]}</span>
            ${stale ? '<span class="badge b-stale" title="The section changed after this was proposed">Needs update</span>' : ''}
            <a class="ref" href="#draft/sec-${esc(r.sec ? r.sec.key : '')}" ${r.sec ? '' : 'aria-disabled="true"'}>${esc(where)} ${esc(r.title)}${r.gone ? ' (no longer in the draft)' : ''}</a></div>
          <div class="card-summary">${esc(p.summary)}</div>
          <div class="meta">${p.kind === 'issue' ? 'Raised' : 'Proposed'} by ${esc(p.author)} &middot; ${fmtDate(p.created_at)}${p.updated_at && p.updated_at !== p.created_at ? ` &middot; last activity ${fmtWhen(p.updated_at)}` : ''}</div>
        </div>
        <div class="card-body">
          ${proposalChangeHtml(p)}
          ${p.rationale ? `<div class="rationale"><span class="label">Why</span>${esc(p.rationale)}</div>` : ''}
          ${decided}
        </div>
        ${actions.length || decide ? `<div class="card-actions">${actions.join('')}${decide}</div>` : ''}
        <div class="thread">
          <details ${p.comments.length && p.comments.length <= 3 ? 'open' : ''}><summary>${p.comments.length ? `${p.comments.length} comment${p.comments.length === 1 ? '' : 's'}` : 'Discuss'}</summary>
            <div style="display:grid;gap:10px;margin-top:10px;">
              ${p.comments.map((c) => `<div class="comment"><span class="who2">${esc(c.author)}</span><span class="when">${fmtWhen(c.created_at)}</span><p>${esc(c.body)}</p></div>`).join('')}
              <form class="comment-form" data-comment="${p.id}"><textarea aria-label="Add a comment" placeholder="Add a comment…" required></textarea><button class="btn small">Post</button></form>
            </div>
          </details>
        </div>
      </article>`;
    }
    function viewProposals(focus) {
      if (!signedIn()) {
        main.innerHTML = `<div class="view-head"><div><h2>Proposals</h2><p>Proposed changes and the discussion around them are visible to subcommittee members.</p></div></div>
          <div class="empty">Sign in to see and discuss proposals.<br /><br /><button class="btn primary" id="p-signin">Subcommittee sign in</button></div>`;
        $('#p-signin').onclick = openSignIn; return;
      }
      const all = S.member.proposals;
      const f = S.filter;
      const counts = Object.fromEntries(STATUS.map((st) => [st, all.filter((p) => p.status === st).length]));
      const arts = groupByArticle(draft());
      const q = (f.q || '').toLowerCase();
      const list = all.filter((p) =>
        (f.status === 'all' || p.status === f.status || (f.status === 'stale' && isStale(p))) &&
        (!f.article || p.article_num === f.article) &&
        (!f.section || p.section_key === f.section) &&
        (!q || [p.summary, p.rationale, p.proposed_body, p.author, p.proposed_title].join(' ').toLowerCase().includes(q)));
      const staleN = all.filter(isStale).length;
      const secLabel = f.section ? refFor(f.section, '') : null;
      main.innerHTML = `
        <div class="view-head"><div><h2>Proposals</h2><p>Each proposal changes one section, adds one, removes one, or flags an issue for discussion. The chair accepts changes into the working draft; they become official in the next published version.</p></div>
          <button class="btn primary no-print" id="new-prop">New proposal</button></div>
        <div class="toolbar">
          <div class="chips" role="group" aria-label="Filter by status">
            ${STATUS.map((st) => `<button class="chip" aria-pressed="${f.status === st}" data-st="${st}">${st[0].toUpperCase() + st.slice(1)} ${counts[st]}</button>`).join('')}
            ${staleN ? `<button class="chip" aria-pressed="${f.status === 'stale'}" data-st="stale">Needs update ${staleN}</button>` : ''}
            <button class="chip" aria-pressed="${f.status === 'all'}" data-st="all">All ${all.length}</button>
          </div>
          <select id="f-art" style="width:auto;" aria-label="Filter by article"><option value="">All articles</option>${arts.map((a) => `<option value="${esc(a.num)}" ${f.article === a.num ? 'selected' : ''}>Article ${esc(a.num)}: ${esc(a.title)}</option>`).join('')}</select>
          <input type="text" class="grow" id="f-q" placeholder="Search proposals" value="${esc(f.q || '')}" aria-label="Search proposals" />
        </div>
        ${secLabel ? `<div class="notice">Showing proposals for ${esc(secLabel.text)} ${esc(secLabel.title)}. <a href="#" id="clear-sec">Show all sections</a></div>` : ''}
        <div class="cards">${list.length ? list.map(proposalCard).join('') : `<div class="empty">No proposals match.</div>`}</div>`;
      $('#new-prop').onclick = openPickSection;
      $$('[data-st]').forEach((c) => c.addEventListener('click', () => { S.filter.status = c.dataset.st; render(); }));
      $('#f-art').onchange = (e) => { S.filter.article = e.target.value; render(); };
      let qt; $('#f-q').addEventListener('input', (e) => { clearTimeout(qt); qt = setTimeout(() => { S.filter.q = e.target.value; render(); const el = $('#f-q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 250); });
      if ($('#clear-sec')) $('#clear-sec').onclick = (e) => { e.preventDefault(); S.filter.section = ''; render(); };
      $$('[data-edit]').forEach((b) => b.addEventListener('click', () => openProposalEditor({ proposal: all.find((p) => p.id === +b.dataset.edit) })));
      $$('[data-withdraw]').forEach((b) => b.addEventListener('click', async () => {
        if (!confirm('Withdraw this proposal? It stays in the record as withdrawn.')) return;
        try { await rpc('sscc_bylaws_withdraw', { p_token: S.token, p_id: +b.dataset.withdraw }); toast('Proposal withdrawn.'); await refresh(); } catch (e) { toast(errMsg(e), true); }
      }));
      $$('[data-decide]').forEach((b) => b.addEventListener('click', async () => {
        const id = +b.dataset.decide, val = b.dataset.val;
        const note = ($(`[data-note="${id}"]`) || {}).value || '';
        if (val === 'accepted' && !confirm('Accept this change into the working draft? The section text changes now; it becomes official in the next published version.')) return;
        b.disabled = true;
        try { await rpc('sscc_bylaws_decide', { p_token: S.token, p_id: id, p_decision: val, p_note: note }); toast(`Proposal #${id}: ${val === 'open' ? 'reopened' : val}.`); await refresh(); render('p-' + id); }
        catch (e) { toast(errMsg(e), true); b.disabled = false; }
      }));
      $$('[data-comment]').forEach((form) => form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const ta = $('textarea', form); const id = +form.dataset.comment;
        const btn = $('button', form); btn.disabled = true;
        try { await rpc('sscc_bylaws_comment', { p_token: S.token, p_id: id, p_body: ta.value }); await refresh(); render('p-' + id); }
        catch (err) { toast(errMsg(err), true); btn.disabled = false; }
      }));
    }
    function openPickSection() {
      const arts = groupByArticle(draft());
      dlg.innerHTML = `<form class="dlg" id="pick-form"><div class="dlg-head"><h3>Which section?</h3></div>
        <div class="dlg-body"><div class="field"><label for="pick">Section to change (or to add a new section after, or to flag)</label>
          <select id="pick" required><option value="">Choose…</option>${arts.map((a) => `<optgroup label="Article ${esc(a.num)}: ${esc(a.title)}">${a.sections.map((s) => `<option value="${esc(s.key)}">${esc(a.num)}.${s.section_num} ${esc(s.title)}</option>`).join('')}</optgroup>`).join('')}</select></div></div>
        <div class="dlg-foot"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary">Continue</button></div></form>`;
      bindClose();
      $('#pick-form').addEventListener('submit', (e) => { e.preventDefault(); const k = $('#pick').value; dlg.close(); openProposalEditor({ sectionKey: k }); });
      dlg.showModal(); $('#pick').focus();
    }

    // ---------------- view: versions ----------------
    function nextLabel() {
      const l = latest(); const m = l && /^v(\d+)\.(\d+)$/.exec(l.label);
      return m ? `v${m[1]}.${+m[2] + 1}` : `v${versions().length + 1}.0`;
    }
    function changeItem(c) {
      const r = refFor(c.section_key, c.article_num);
      let detail = '';
      if (c.kind === 'amend') detail = `<div class="sec-title">${titleRedline(c.base_title, c.proposed_title)}</div><div class="redline">${redline(c.base_body, c.proposed_body)}</div>`;
      else if (c.kind === 'add') detail = `<div class="whole-ins"><div class="sec-title">${esc(c.proposed_title)}</div><div class="body">${renderBody(c.proposed_body)}</div></div>`;
      else if (c.kind === 'delete') detail = `<div class="whole-del"><div class="sec-title">${esc(c.base_title)}</div><div class="body">${renderBody(c.base_body)}</div></div>`;
      return `<li><details><summary><span class="badge b-kind">${KIND[c.kind]}</span> <b>${esc(c.summary)}</b> <span class="muted">&middot; ${esc(r.text)} ${esc(r.title)} &middot; proposed by ${esc(c.author)} &middot; #${c.id}</span></summary>
        <div class="redline-wrap" style="margin-top:8px;">${detail}${c.rationale ? `<div class="rationale" style="margin-top:8px;"><span class="label">Why</span>${esc(c.rationale)}</div>` : ''}</div></details></li>`;
    }
    function viewVersions() {
      const vs = versions().slice().reverse();
      const pending = S.pub.pending_changes;
      const pendingList = S.member ? S.member.proposals.filter((p) => p.status === 'accepted' && p.kind !== 'issue' && !p.in_version) : [];
      main.innerHTML = `
        <div class="view-head"><div><h2>Versions</h2><p>Each version is a frozen copy of the whole text, with a change log of the accepted proposals it added: what changed, who proposed it, and why.</p></div></div>
        ${pending ? `<div class="pending-box">
          <div><b>${pending} accepted change${pending === 1 ? '' : 's'}</b> in the working draft since ${esc(latest().label)}, not yet in a version.
            <a href="#compare" id="see-pending">See the differences</a></div>
          ${pendingList.length ? `<ul class="change-list">${pendingList.map((p) => changeItem({ ...p, section_key: p.applied_section_key || p.section_key })).join('')}</ul>` : ''}
          ${isChair() ? `<form class="row" id="cut-form">
              <div class="field"><label for="cut-label">Version</label><input type="text" id="cut-label" value="${esc(nextLabel())}" required /></div>
              <div class="field"><label for="cut-summary">What this version does</label><input type="text" id="cut-summary" placeholder="e.g. Adds amendment notice period; fixes Article VII titles" required /></div>
              <button class="btn primary">Publish version</button></form>` : '<div class="muted" style="font-size:0.86rem;">The chair publishes the next version.</div>'}
        </div>` : ''}
        <div class="timeline">${vs.map((v, i) => `
          <article class="ver" id="v-${v.num}">
