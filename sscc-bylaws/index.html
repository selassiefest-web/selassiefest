              <span class="muted" style="font-size:0.85rem;">${fmtDate(v.created_at)} &middot; published by ${esc(v.created_by)} &middot; ${v.snapshot.length} sections</span></div>
            <p class="ver-summary">${esc(v.summary)}</p>
            ${v.changes.length ? `<ul class="change-list">${v.changes.map(changeItem).join('')}</ul>` : '<p class="muted" style="margin:0;font-size:0.88rem;">Baseline: the text the subcommittee started from.</p>'}
            <div class="toolbar no-print" style="margin:12px 0 0;">
              ${v.num > 1 ? `<button class="btn small" data-cmp="${v.num}">Compare with ${esc(versions().find((x) => x.num === v.num - 1).label)}</button>` : ''}
              <button class="btn small" data-read="${v.num}">Read this version</button>
            </div>
          </article>`).join('')}</div>`;
      if ($('#see-pending')) $('#see-pending').onclick = (e) => { e.preventDefault(); S.compare = { from: String(latest().num), to: 'draft' }; go('compare'); };
      if ($('#cut-form')) $('#cut-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const label = $('#cut-label').value.trim();
        if (!confirm(`Publish ${label}? This freezes the current working draft as ${label}.`)) return;
        try { await rpc('sscc_bylaws_cut_version', { p_token: S.token, p_label: label, p_summary: $('#cut-summary').value }); toast(`${label} published.`); await refresh(); }
        catch (err) { toast(errMsg(err), true); }
      });
      $$('[data-cmp]').forEach((b) => b.addEventListener('click', () => { S.compare = { from: String(+b.dataset.cmp - 1), to: b.dataset.cmp }; go('compare'); }));
      $$('[data-read]').forEach((b) => b.addEventListener('click', () => { S.compare = { from: b.dataset.read, to: b.dataset.read }; go('compare'); }));
    }

    // ---------------- compare ----------------
    function diffSnapshots(from, to) {
      const out = [];
      to.forEach((s) => {
        const o = secByKey(from, s.key);
        if (!o) out.push({ type: 'added', s });
        else if (o.body !== s.body || o.title !== s.title) out.push({ type: 'changed', s, o });
        else if (o.section_num !== s.section_num || o.article_num !== s.article_num) out.push({ type: 'renumbered', s, o });
      });
      from.forEach((o) => { if (!secByKey(to, o.key)) out.push({ type: 'removed', o }); });
      return out;
    }
    function versionOptions(sel, withDraft) {
      return versions().map((v) => `<option value="${v.num}" ${String(sel) === String(v.num) ? 'selected' : ''}>${esc(v.label)}</option>`).join('') +
        (withDraft ? `<option value="draft" ${sel === 'draft' ? 'selected' : ''}>Working draft</option>` : '');
    }
    function diffHtml(d) {
      if (d.type === 'added') return `<div class="diff-sec"><div class="ref">Art. ${esc(d.s.article_num)} &middot; new Section ${d.s.section_num}</div><div class="whole-ins" style="margin-top:6px;"><div class="sec-title">${esc(d.s.title)}</div><div class="body">${renderBody(d.s.body)}</div></div></div>`;
      if (d.type === 'removed') return `<div class="diff-sec"><div class="ref">Art. ${esc(d.o.article_num)} &middot; Section ${d.o.section_num} removed</div><div class="whole-del" style="margin-top:6px;"><div class="sec-title">${esc(d.o.title)}</div><div class="body">${renderBody(d.o.body)}</div></div></div>`;
      if (d.type === 'renumbered') return `<div class="diff-sec"><div class="ref">Art. ${esc(d.s.article_num)} &middot; Section ${d.o.section_num} &rarr; Section ${d.s.section_num}</div><div class="muted" style="font-size:0.88rem;">${esc(d.s.title)}: renumbered only, text unchanged.</div></div>`;
      return `<div class="diff-sec"><div class="ref">Art. ${esc(d.s.article_num)} &middot; Section ${d.s.section_num}${d.o.section_num !== d.s.section_num ? ` (was ${d.o.section_num})` : ''}</div><div class="sec-title" style="margin-top:4px;">${titleRedline(d.o.title, d.s.title)}</div><div class="redline">${redline(d.o.body, d.s.body)}</div></div>`;
    }
    function viewCompare() {
      const c = S.compare;
      if (!c.from) c.from = String((versions()[0] || {}).num || '');
      const reading = c.from === c.to && c.to !== 'draft';
      const from = snapshotFor(c.from), to = snapshotFor(c.to);
      const diffs = reading ? [] : diffSnapshots(from, to);
      const real = diffs.filter((d) => d.type !== 'renumbered');
      main.innerHTML = `
        <div class="view-head"><div><h2>${reading ? `Read ${esc(labelFor(c.to))}` : 'Compare'}</h2><p>${reading ? 'The full text exactly as it stood in this version.' : 'Every section that differs between two versions, shown as a redline. Only changed sections are listed.'}</p></div></div>
        <div class="compare-row no-print">
          <div class="field"><label for="c-from">${reading ? 'Version' : 'From'}</label><select id="c-from">${versionOptions(c.from, false)}</select></div>
          <div class="field" ${reading ? 'hidden' : ''}><label for="c-to">To</label><select id="c-to">${versionOptions(c.to, true)}</select></div>
          <div class="toolbar" style="margin:0;">${reading ? '<button class="btn" id="c-mode">Compare instead</button>' : ''}<button class="btn" id="c-print">Print</button></div>
        </div>
        ${reading ? `<article class="paper"><div class="paper-title"><div class="t1">Bylaws of the</div><div class="t2">South Shore Cultural Center Advisory Council</div><div class="t3">${esc(labelFor(c.to))}</div></div>
            ${groupByArticle(to).map((a) => `<h3 class="article-h">Article ${esc(a.num)} &mdash; ${esc(a.title)}</h3>${a.sections.map((s) => `<section class="section"><div class="sec-title"><span class="num">Section ${s.section_num}.</span> ${esc(s.title)}</div><div class="body">${renderBody(s.body)}</div></section>`).join('')}`).join('')}</article>`
          : `<div class="notice">${real.length ? `<b>${real.length}</b> section${real.length === 1 ? '' : 's'} differ between ${esc(labelFor(c.from))} and ${esc(labelFor(c.to))}.` : `No text differences between ${esc(labelFor(c.from))} and ${esc(labelFor(c.to))}.`}
              <span class="legend" style="display:inline-flex;margin-left:8px;"><ins>added</ins><del>removed</del></span></div>
            ${diffs.length ? `<div class="paper">${diffs.map(diffHtml).join('')}</div>` : ''}`}`;
      $('#c-from').onchange = (e) => { c.from = e.target.value; if (reading) c.to = c.from; render(); };
      if ($('#c-to')) $('#c-to').onchange = (e) => { c.to = e.target.value; render(); };
      if ($('#c-mode')) $('#c-mode').onclick = () => { c.to = 'draft'; render(); };
      $('#c-print').onclick = () => window.print();
    }

    // ---------------- adoption packet ----------------
    function viewPacket() {
      const pk = S.packet;
      if (!pk.from) pk.from = String((versions()[0] || {}).num || '');
      const from = snapshotFor(pk.from), to = snapshotFor(pk.to);
      const diffs = diffSnapshots(from, to).filter((d) => d.type !== 'renumbered');
      // attach the proposals behind each change (from the change logs, plus accepted-but-unversioned)
      const fromNum = +pk.from, toNum = pk.to === 'draft' ? Infinity : +pk.to;
      const changes = versions().filter((v) => v.num > fromNum && v.num <= toNum).flatMap((v) => v.changes.map((ch) => ({ ...ch, label: v.label })));
      if (pk.to === 'draft' && S.member) S.member.proposals.filter((p) => p.status === 'accepted' && p.kind !== 'issue' && !p.in_version)
        .forEach((p) => changes.push({ ...p, section_key: p.applied_section_key || p.section_key, label: 'working draft' }));
      const why = (key) => changes.filter((ch) => ch.section_key === key);
      const toLabel = labelFor(pk.to);
      main.innerHTML = `
        <div class="view-head no-print"><div><h2>Adoption packet</h2><p>A printable statement of every amendment, for the notice to members that Article X requires: each change identifies the Article and Section affected, shows the old and new text, and gives the reason. Print it or save it as a PDF.</p></div></div>
        <div class="compare-row no-print">
          <div class="field"><label for="k-from">Changes since</label><select id="k-from">${versionOptions(pk.from, false)}</select></div>
          <div class="field"><label for="k-to">Through</label><select id="k-to">${versionOptions(pk.to, true)}</select></div>
          <div class="toolbar" style="margin:0;"><label style="font-size:0.86rem;"><input type="checkbox" id="k-clean" ${pk.clean ? 'checked' : ''} /> Include the full clean text</label><button class="btn primary" id="k-print">Print / save PDF</button></div>
        </div>
        ${pk.to === 'draft' && S.pub.pending_changes ? '<div class="notice warn no-print">This packet includes changes not yet in a published version. For the official notice, publish a version first and choose it under "Through."</div>' : ''}
        <article class="paper packet">
          <div class="paper-title"><div class="t1">South Shore Cultural Center Advisory Council</div><div class="t2">Proposed Amendments to the Bylaws</div>
            <div class="t3">${esc(toLabel)} compared with ${esc(labelFor(pk.from))} &middot; prepared ${fmtDate(Date.now())}</div></div>
          <p class="prose" style="font-family:var(--serif);">The following amendments are proposed under Article X of the bylaws. Adoption requires a two-thirds vote of the votes cast, with a quorum present, at a meeting for which these amendments were included in the notice. Added text is <ins>underlined</ins>; removed text is <del>struck through</del>.</p>
          ${diffs.length ? diffs.map((d, i) => {
            const s = d.s || d.o; const reasons = why(s.key);
            const kindWord = d.type === 'added' ? 'New section' : d.type === 'removed' ? 'Section deleted' : 'Amended';
            return `<div class="amend"><h4>Amendment ${i + 1}. Article ${esc(s.article_num)}, Section ${s.section_num}: ${esc(s.title)} <span class="muted" style="font-family:var(--sans);font-size:0.8rem;font-weight:500;">(${kindWord})</span></h4>
              ${diffHtml(d).replace('class="diff-sec"', 'class=""')}
              ${reasons.length ? reasons.map((r) => `<div class="rationale" style="margin-top:8px;"><span class="label">Purpose (${esc(r.label)}, #${r.id})</span>${esc(r.summary)}${r.rationale ? ` ${esc(r.rationale)}` : ''}</div>`).join('') : ''}</div>`;
          }).join('') : '<div class="empty">No amendments in this range.</div>'}
          ${pk.clean ? `<h3 class="article-h" style="border-top:2px solid var(--ink);">Full text as amended (${esc(toLabel)})</h3>
            ${groupByArticle(to).map((a) => `<h3 class="article-h">Article ${esc(a.num)} &mdash; ${esc(a.title)}</h3>${a.sections.map((s) => `<section class="section"><div class="sec-title"><span class="num">Section ${s.section_num}.</span> ${esc(s.title)}</div><div class="body">${renderBody(s.body)}</div></section>`).join('')}`).join('')}` : ''}
          <h3 class="article-h" style="border-top:2px solid var(--ink);">Bylaws Amendment History</h3>
          <div class="sig-block">
            <div>Date Adopted:</div><div>Effective Date:</div><div>Amendment / Revision Description: ${esc(toLabel)}: ${esc((versions().find((v) => String(v.num) === String(pk.to)) || {}).summary || '')}</div>
            <div>Secretary:</div><div>President:</div>
          </div>
          <h4 style="margin:26px 0 6px;font-family:var(--serif);">Revision record</h4>
          <ul class="change-list">${versions().filter((v) => v.num <= toNum).map((v) => `<li><b>${esc(v.label)}</b> &middot; ${fmtDate(v.created_at)} &middot; ${esc(v.summary)}${v.changes.length ? ` (${v.changes.length} change${v.changes.length === 1 ? '' : 's'})` : ''}</li>`).join('')}</ul>
        </article>`;
      $('#k-from').onchange = (e) => { pk.from = e.target.value; render(); };
      $('#k-to').onchange = (e) => { pk.to = e.target.value; render(); };
      $('#k-clean').onchange = (e) => { pk.clean = e.target.checked; render(); };
      $('#k-print').onclick = () => window.print();
    }

    async function saveMyName(name) {
      try { await rpc('sscc_bylaws_set_my_name', { p_token: S.token, p_name: name }); toast('Name saved.'); await refresh(); }
      catch (err) { toast(errMsg(err), true); }
    }

    // ---------------- members ----------------
    function viewMembers() {
      if (!signedIn()) {
        main.innerHTML = `<div class="view-head"><div><h2>Subcommittee</h2><p>The member list is visible to subcommittee members.</p></div></div>
          <div class="empty">Sign in to see the subcommittee.<br /><br /><button class="btn primary" id="m-signin">Subcommittee sign in</button></div>`;
        $('#m-signin').onclick = openSignIn; return;
      }
      const ms = S.member.members;
      const tally = (name) => S.member.proposals.filter((p) => p.author === name).length;
      main.innerHTML = `
        <div class="view-head"><div><h2>Subcommittee</h2><p>${ms.length} member${ms.length === 1 ? '' : 's'}. ${isChair() ? 'As chair you can add members; they sign in with the email you enter.' : 'Ask the chair to add or remove members.'}</p></div></div>
        <div class="grid-2">
          <ul class="member-list">${ms.map((m) => `<li><div class="grow"><div><b>${esc(m.display_name)}</b> ${m.role === 'chair' ? '<span class="badge b-accepted">Chair</span>' : ''}</div>${m.email ? `<div class="email">${esc(m.email)}</div>` : ''}</div>
            <span class="muted" style="font-size:0.8rem;">${tally(m.display_name)} proposal${tally(m.display_name) === 1 ? '' : 's'}</span>
            ${isChair() && m.email && m.email !== S.member.me.email ? `<button class="btn small ghost danger" data-remove="${esc(m.email)}" aria-label="Remove ${esc(m.display_name)}">Remove</button>` : ''}</li>`).join('')}</ul>
          <div style="display:grid;gap:16px;">
          <form class="panel" id="my-name"><h3 style="font-family:var(--serif);font-size:1.05rem;">Your name</h3>
            <div class="field"><label for="mn-name">Shown on your proposals and comments</label><input type="text" id="mn-name" value="${esc(S.member.me.display_name)}" required maxlength="80" /></div>
            <button class="btn">Save</button></form>
          ${isChair() ? `<form class="panel" id="add-member"><h3 style="font-family:var(--serif);font-size:1.05rem;">Add a member</h3>
            <div class="field"><label for="am-name">Name</label><input type="text" id="am-name" required /></div>
            <div class="field"><label for="am-email">Email</label><input type="email" id="am-email" required /></div>
            <div class="field"><label for="am-role">Role</label><select id="am-role"><option value="member">Member: proposes and comments</option><option value="chair">Chair: also decides and publishes versions</option></select></div>
            <button class="btn primary">Add member</button>
            <p class="muted" style="margin:0;font-size:0.8rem;">Then send them the link to this page: selassiefest.com/sscc-bylaws/</p></form>` : ''}
          </div>
        </div>`;
      $('#my-name').addEventListener('submit', (e) => { e.preventDefault(); saveMyName($('#mn-name').value); });
      if ($('#add-member')) $('#add-member').addEventListener('submit', async (e) => {
        e.preventDefault();
        try { await rpc('sscc_bylaws_set_member', { p_token: S.token, p_email: $('#am-email').value, p_name: $('#am-name').value, p_role: $('#am-role').value, p_remove: false }); toast('Member added.'); await refresh(); }
        catch (err) { toast(errMsg(err), true); }
      });
      $$('[data-remove]').forEach((b) => b.addEventListener('click', async () => {
        if (!confirm(`Remove ${b.dataset.remove} from the subcommittee? Their proposals and comments stay in the record.`)) return;
        try { await rpc('sscc_bylaws_set_member', { p_token: S.token, p_email: b.dataset.remove, p_name: '', p_role: 'member', p_remove: true }); toast('Member removed.'); await refresh(); }
        catch (err) { toast(errMsg(err), true); }
      }));
    }

    // ---------------- about ----------------
    function viewAbout() {
      main.innerHTML = `
        <div class="view-head"><div><h2>How this works</h2><p>One working draft, changed only through proposals the subcommittee has discussed, with a numbered version history so nothing is lost and every change can be traced.</p></div></div>
        <div class="grid-2"><div class="prose">
          <ol class="steps">
            <li><b>Propose.</b> Open the working draft, pick a section, and choose <i>Amend wording</i>, <i>Add a section</i>, <i>Delete</i>, or <i>Flag an issue</i>. Every proposal needs a one-line summary and should say why. You see a redline of your change before you submit.</li>
            <li><b>Discuss.</b> Each proposal has its own comment thread. Authors can edit their proposal while it is open.</li>
            <li><b>Decide.</b> The chair accepts, rejects, or defers each proposal, after the subcommittee has discussed it. An accepted change goes straight into the working draft. If a section changes while another proposal on it is still open, that proposal is marked <i>Needs update</i> and can't be accepted until its author updates it to the current text, so no one's change silently overwrites another's.</li>
            <li><b>Publish a version.</b> When a batch of changes is settled, the chair publishes the next version (v1.1, v1.2, …). Each version freezes the full text and carries a change log: what changed, who proposed it, and why.</li>
            <li><b>Adopt.</b> The adoption packet prints every amendment since the baseline, identifying the Article and Section affected with old and new text, as Article X requires for the notice to members. Adoption still requires a two-thirds vote of the votes cast, with a quorum present.</li>
          </ol></div>
          <div class="panel"><h3 style="font-family:var(--serif);font-size:1.05rem;">Who can see what</h3>
            <p style="margin:0;font-size:0.9rem;">Anyone with the link can read the working draft, the versions, and the adoption packet. Proposals, discussion, and the member list are visible only to signed-in subcommittee members. Email addresses are never shown publicly.</p>
            <h3 style="font-family:var(--serif);font-size:1.05rem;">Starter review notes</h3>
            <p style="margin:0;font-size:0.9rem;">v1.0 came with a set of <i>issues</i> flagged by an initial read-through (duplicate sections, undefined terms, a typo). They are questions for the subcommittee, not decisions, and each can be resolved or turned into a proposal.</p></div>
        </div>`;
    }

    // ---------------- boot ----------------
    (async function boot() {
      try { S.token = localStorage.getItem(SESSION_KEY); } catch (e) {}
      const focus = fromHash();
      await handleSigninParam();
      try { await refresh(); render(focus); }
      catch (e) { main.innerHTML = `<div class="empty">Could not load the bylaws. ${esc(errMsg(e))}<br /><br /><button class="btn" onclick="location.reload()">Try again</button></div>`; }
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && dlg.open) dlg.close(); });
    })();
  })();
  </script>
</body>
</html>
