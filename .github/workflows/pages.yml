# Deploys the static site to GitHub Pages.
# Replaces the legacy "Deploy from a branch" pipeline (the one that kept failing).
# Requires: Settings -> Pages -> Source = "GitHub Actions"
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Keep BBPAC private (do not publish its records)
        # The BBPAC records are sensitive and the repo is public. Serve only the members-area
        # gate page at /bbpac/ and nothing else from these folders. See Claude outputs/bbpac-private-backup-2026-11-02.
        run: |
          rm -rf bbpac bbpac-strategy m4.json
          mkdir -p bbpac
          cp bbpac-gate/index.html bbpac/index.html
          cp bbpac-gate/index.html bbpac/beach-map.html
          rm -rf bbpac-gate
      - name: Leave videos out of the deployed site (keeps the artifact small enough to deploy)
        # The deploy step was timing out on a ~460 MB artifact (Nov 2026). Videos stay in the repo
        # but are not published. Remove this step once the videos are compressed or hosted elsewhere.
        run: find . -type f -name '*.mp4' -not -path './.git/*' -print -delete
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
