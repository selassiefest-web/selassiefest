<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Thank You | SelassieFest</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg-black: #0D0D0D;
      --text-white: #F5F5F5;
      --roots-green: #0E5E36;
      --gold-accent: #E5A93C;
      --card-bg: rgba(255,255,255,0.04);
      --border-dim: rgba(255,255,255,0.08);
    }
    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: 'Jost', sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    a { text-decoration: none; transition: all .2s ease; }
    .brand-link { display: inline-block; margin-bottom: 2.5rem; }
    .site-title { font-weight: 200; font-size: 1.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-white); }
    .success-card {
      background: var(--card-bg);
      border: 1px solid var(--border-dim);
      border-radius: 32px;
      padding: 3rem 2.5rem;
      max-width: 480px;
    }
    .success-icon { font-size: 3rem; color: var(--gold-accent); margin-bottom: 1.2rem; }
    h1 { font-weight: 400; font-size: 1.7rem; margin-bottom: 1rem; }
    p { color: #ccc; font-weight: 300; margin-bottom: .6rem; }
    .back-link {
      display: inline-block;
      margin-top: 1.8rem;
      color: var(--gold-accent);
      font-weight: 500;
      border: 1px solid var(--gold-accent);
      padding: .7rem 1.8rem;
      border-radius: 40px;
    }
    .back-link:hover { background: var(--gold-accent); color: #0a0a0a; }
</style>
</head>
<body>
<a href="/" class="brand-link"><div class="site-title">SELASSIEFEST</div></a>
<div class="success-card">
  <i class="fas fa-heart success-icon"></i>
  <h1>One Love — Thank You!</h1>
  <p>Your donation went through and directly supports SelassieFest and Ras Tafari Inc's year-round programming.</p>
  <p>Stripe will email you a receipt. Ras Tafari Inc is a 501(c)(3) nonprofit, so your gift is tax-deductible.</p>
  <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to SelassieFest</a>
</div>
</body>
</html>
