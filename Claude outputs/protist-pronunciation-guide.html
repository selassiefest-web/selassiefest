<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronounce-a-Protist</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg: #f4efe0;
    --surface: #ffffff;
    --surface-2: #ece3cd;
    --ink: #1c2a20;
    --muted: #5f6d61;
    --accent: #2f7d5c;
    --accent-ink: #ffffff;
    --accent-dim: #d9ead9;
    --stress: #b5502e;
    --line: #ddd2b7;
    --shadow: rgba(28,42,32,0.10);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #0e1512;
      --surface: #161f1a;
      --surface-2: #1c2620;
      --ink: #eae6d6;
      --muted: #9caa9d;
      --accent: #5bc999;
      --accent-ink: #0b1310;
      --accent-dim: #203a2d;
      --stress: #e2895a;
      --line: #2b3730;
      --shadow: rgba(0,0,0,0.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg: #0e1512;
    --surface: #161f1a;
    --surface-2: #1c2620;
    --ink: #eae6d6;
    --muted: #9caa9d;
    --accent: #5bc999;
    --accent-ink: #0b1310;
    --accent-dim: #203a2d;
    --stress: #e2895a;
    --line: #2b3730;
    --shadow: rgba(0,0,0,0.4);
    color-scheme: dark;
  }

  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", system-ui, sans-serif;
    padding-inline: 16px;
  }
  .wrap{ max-width: 980px; margin: 0 auto; padding-bottom: 64px; }

  header.top{
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding-block: 20px 14px;
    border-bottom: 1px solid var(--line);
  }
  h1{
    font-family: "Fraunces", serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(1.7rem, 4vw, 2.5rem);
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .kicker{
    color: var(--muted);
    font-size: 0.92rem;
    margin: 0 0 16px;
  }
  .controls{
    display:flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    align-items:center;
  }
  .search{
    flex: 1 1 240px;
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 16px;
  }
  .search svg{ flex:none; opacity:0.6; }
  .search input{
    border:none;
    outline:none;
    background:transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.95rem;
    width:100%;
  }
  .search input::placeholder{ color: var(--muted); }

  .speed-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.88rem;
    color: var(--muted);
    user-select:none;
    cursor:pointer;
    white-space:nowrap;
  }
  .switch{
    position:relative;
    width:38px; height:22px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius:999px;
    flex:none;
    transition: background 0.15s ease;
  }
  .switch::after{
    content:"";
    position:absolute;
    top:2px; left:2px;
    width:16px; height:16px;
    border-radius:50%;
    background: var(--muted);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .speed-toggle input{ position:absolute; opacity:0; width:0; height:0; }
  .speed-toggle input:checked + .switch{ background: var(--accent-dim); border-color: var(--accent); }
  .speed-toggle input:checked + .switch::after{ transform: translateX(16px); background: var(--accent); }
  .speed-toggle input:focus-visible + .switch{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .voice-note{
    font-size: 0.78rem;
    color: var(--muted);
    margin: 10px 0 0;
  }

  section.category{ margin-top: 34px; }
  .cat-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom: 14px;
  }
  .cat-dot{
    width:10px; height:10px;
    border-radius:50%;
    background: var(--dot, var(--accent));
    flex:none;
  }
  .cat-head h2{
    font-family:"Fraunces", serif;
    font-weight:600;
    font-size: 1.25rem;
    margin:0;
  }
  .cat-count{
    color: var(--muted);
    font-size:0.82rem;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 16px 14px;
    box-shadow: 0 1px 2px var(--shadow);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .term{
    font-weight:600;
    font-size: 1.05rem;
    line-height:1.25;
  }
  .term em{
    font-style: italic;
    font-weight:500;
    color: var(--muted);
    display:block;
    font-size:0.78rem;
    margin-top:2px;
  }
  .phonetic{
    font-family:"IBM Plex Mono", monospace;
    font-size: 0.86rem;
    color: var(--muted);
    letter-spacing:0.01em;
    line-height:1.5;
  }
  .phonetic b{
    color: var(--stress);
    font-weight:600;
  }

  .hear-btn{
    margin-top:auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border: 1px solid var(--accent);
    background: var(--accent-dim);
    color: var(--accent);
    font-family: inherit;
    font-weight:600;
    font-size: 0.88rem;
    padding: 8px 14px;
    border-radius: 999px;
    cursor:pointer;
    transition: background 0.12s ease, transform 0.08s ease;
  }
  .hear-btn:hover{ background: var(--accent); color: var(--accent-ink); }
  .hear-btn:active{ transform: scale(0.97); }
  .hear-btn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .hear-btn.speaking{ background: var(--accent); color: var(--accent-ink); }
  .hear-btn svg{ flex:none; }
  .hear-btn .bars{ display:flex; align-items:flex-end; gap:2px; height:12px; }
  .hear-btn .bars i{
    display:block; width:2.5px; background: currentColor; border-radius:1px;
    height:4px;
  }
  .hear-btn.speaking .bars i{ animation: bounce 0.9s ease-in-out infinite; }
  .hear-btn.speaking .bars i:nth-child(2){ animation-delay: 0.15s; }
  .hear-btn.speaking .bars i:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{
    0%, 100% { height:4px; }
    50% { height:12px; }
  }
  @media (prefers-reduced-motion: reduce){
    .hear-btn.speaking .bars i{ animation: none; height: 8px; }
  }

  .hidden{ display:none !important; }
  .empty-msg{
    color: var(--muted);
    font-size:0.95rem;
    padding: 40px 0;
    text-align:center;
  }
  .tts-warning{
    margin-top:14px;
    padding:12px 14px;
    border-radius:10px;
    background: var(--surface-2);
    border:1px solid var(--line);
    font-size:0.85rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Pronounce-a-Protist</h1>
    <p class="kicker">BIOS 102 &middot; Exercise 2 (The Protists) &amp; Exercise 3 (Fungi) &mdash; every term below is pulled straight from the lab manual. Tap a word to hear it spoken aloud.</p>
    <div class="controls">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="Search a term or organism&hellip;" autocomplete="off">
      </label>
      <label class="speed-toggle">
        <input type="checkbox" id="slowToggle">
        <span class="switch" aria-hidden="true"></span>
        Speak slowly
      </label>
    </div>
    <p class="voice-note" id="voiceNote"></p>
  </header>

  <main id="sections"></main>
  <p class="empty-msg hidden" id="emptyMsg">No terms match your search.</p>
</div>

<script>
(function(){
  const DATA = [
    { cat: "Core Vocabulary (Exercise 2 terms)", dot: "#2f7d5c", terms: [
      ["Protista", "pro-TIS-tuh", "the kingdom name used in the manual"],
      ["Eukaryotic", "yoo-kair-ee-OT-ik"],
      ["Autotroph / Heterotroph", "AW-toh-trohf / HET-er-oh-trohf"],
      ["Plankton / Phytoplankton", "PLANK-tun / fy-toh-PLANK-tun"],
      ["Protozoans", "proh-toh-ZOH-unz"],
      ["Endosymbiosis", "en-doh-sim-by-OH-sis", "review question topic"],
      ["Syngamy", "SIN-guh-mee", "review question topic"],
      ["Pyrenoid", "PY-ruh-noyd", "starch-storage body in Spirogyra"],
      ["Macronucleus / Micronucleus", "mak-roh-NOO-klee-us / my-kroh-NOO-klee-us", "the two Paramecium nuclei"],
      ["Schizogony", "skih-ZOG-uh-nee", "asexual splitting stage of Plasmodium"],
      ["Sporozoites / Merozoites / Trophozoites", "SPOR-oh-zoh-eyts / MER-oh-zoh-eyts / TROH-foh-zoh-eyts", "Plasmodium life-cycle stages"],
    ]},
    { cat: "Classification (\"Supergroups\")", dot: "#7a6a2f", terms: [
      ["Archaeplastida", "ar-kee-PLAS-tih-duh", "supergroup that includes the Chlorophytes"],
      ["Chlorophytes", "KLOR-oh-fytes", "the green algae"],
      ["Excavata", "eks-kuh-VAH-tuh", "supergroup that includes Trypanosoma"],
      ["Euglenozoans", "yoo-glee-noh-ZOH-unz"],
      ["\"SAR\" clade / Alveolata", "\"S-A-R\" / al-vee-oh-LAH-tuh", "supergroup that includes Plasmodium and Paramecium"],
      ["Unikonta", "yoo-nih-KON-tuh", "includes Fungi and Animalia kingdoms"],
    ]},
    { cat: "The Chlorophytes (green algae)", dot: "#3f8f4f", terms: [
      ["Chlamydomonas", "kluh-mid-oh-MOH-nus", "unicellular"],
      ["Scenedesmus", "see-nuh-DEZ-mus", "small non-motile colony"],
      ["Eudorina", "yoo-DOR-ih-nuh", "spherical colony, 4-64 cells"],
      ["Volvox", "VOL-voks", "large hollow colony sphere"],
      ["Spirogyra", "spy-roh-JY-ruh", "unbranched filament"],
    ]},
    { cat: "The Heterotrophs", dot: "#2f6a7d", terms: [
      ["Trypanosoma", "trih-pan-oh-SOH-muh", "causes African sleeping sickness"],
      ["Plasmodium", "plaz-MOH-dee-um", "causes malaria"],
      ["Paramecium", "pair-uh-MEE-see-um", "free-living ciliate"],
    ]},
    { cat: "Mentioned in the review questions", dot: "#b5502e", terms: [
      ["Euglena", "yoo-GLEE-nuh", "not a specimen you observe in this exercise, but asked about in the review questions"],
    ]},
    { cat: "Fungi Vocabulary (Exercise 3)", dot: "#8a6d3b", terms: [
      ["Fungi", "FUN-jy", "the kingdom name itself — not \"FUN-guy\""],
      ["Mycelium", "my-SEE-lee-um", "the mass of hyphae making up a fungus body"],
      ["Hypha / Hyphae", "HY-fuh / HY-fee", "singular / plural"],
      ["Chitin", "KY-tin", "the cell wall material, same as insect exoskeletons"],
      ["Ascocarp", "AS-koh-karp", "the “cup” fruiting body of Peziza"],
      ["Ascus / Asci", "AS-kus / AS-eye", "the spore sac(s) inside the ascocarp"],
      ["Basidiospores", "buh-SID-ee-oh-spores", "spores produced on the gills of Agaricus"],
      ["Sporangium / Sporangiophore", "spor-AN-jee-um / spor-an-JEE-oh-for", "Pilobolus's spore capsule and its stalk"],
      ["Coprophilous", "kop-ROF-ih-lus", "“dung-loving” — Pilobolus grows on herbivore dung"],
      ["Phototropic", "foh-toh-TROH-pik", "Pilobolus grows toward light before firing its spores"],
      ["Lichen", "LY-ken", "not “LITCH-en” — fungus/algae symbiosis"],
      ["Mycorrhiza", "my-koh-RY-zuh", "review question topic"],
      ["Saprobe", "SAP-rohb", "an organism that feeds on dead/decaying matter"],
    ]},
    { cat: "Fungal Phyla (Exercise 3)", dot: "#6b4a2f", terms: [
      ["Ascomycota", "as-koh-my-KOH-tuh", "sac fungi — Peziza"],
      ["Basidiomycota", "buh-sid-ee-oh-my-KOH-tuh", "club fungi — Agaricus"],
      ["Zygomycota", "zy-goh-my-KOH-tuh", "zygote/shotgun fungi — Pilobolus"],
    ]},
    { cat: "The Fungi (specimens studied)", dot: "#4a7d3f", terms: [
      ["Peziza", "puh-ZY-zuh", "cup fungus"],
      ["Agaricus", "uh-GAR-ih-kus", "common edible mushroom"],
      ["Pilobolus", "py-LOB-oh-lus", "shotgun fungus — independent investigation"],
      ["Pilobolus crystallinus", "py-LOB-oh-lus kris-tuh-LY-nus", "full species name used in the independent investigation"],
    ]},
  ];

  // Browser text-to-speech regularly mangles unfamiliar scientific names
  // (e.g. "Scenedesmus"), so speak the phonetic respelling shown on the
  // card instead of the literal word -- it reads far more reliably.
  function buildSpeakText(phonetic){
    return phonetic
      .split("/")
      .map(part => part.trim().replace(/["“”]/g, "").replace(/-/g, " "))
      .filter(Boolean)
      .join(", ");
  }

  function formatPhonetic(p){
    return p.split(/(\s+|\/)/).map(chunk => {
      if (chunk === " " || chunk === "/" ) return chunk;
      return chunk.split("-").map(syl =>
        /^[A-Z]/.test(syl) ? "<b>" + syl.toLowerCase() + "</b>" : syl
      ).join("-");
    }).join("");
  }

  const speakerIcon = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4,9 9,9 13,5 13,19 9,15 4,15" fill="currentColor" stroke="none"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  const barsIcon = '<span class="bars"><i></i><i></i><i></i></span>';

  const sectionsEl = document.getElementById("sections");
  const cards = [];

  DATA.forEach(group => {
    const section = document.createElement("section");
    section.className = "category";
    section.dataset.cat = group.cat;

    const head = document.createElement("div");
    head.className = "cat-head";
    head.innerHTML =
      '<span class="cat-dot" style="--dot:' + group.dot + '"></span>' +
      '<h2>' + group.cat + '</h2>' +
      '<span class="cat-count">' + group.terms.length + ' terms</span>';
    section.appendChild(head);

    const grid = document.createElement("div");
    grid.className = "grid";

    group.terms.forEach(([term, phonetic, note]) => {
      const card = document.createElement("div");
      card.className = "card";
      const searchText = (term + " " + phonetic).toLowerCase();
      card.dataset.search = searchText;

      card.innerHTML =
        '<div class="term">' + term + (note ? '<em>' + note + '</em>' : '') + '</div>' +
        '<div class="phonetic">' + formatPhonetic(phonetic) + '</div>' +
        '<button class="hear-btn" type="button">' +
          speakerIcon + '<span class="label">Hear it</span>' + barsIcon +
        '</button>';

      const hearBtn = card.querySelector(".hear-btn");
      hearBtn._speakText = buildSpeakText(phonetic);
      hearBtn._label = term;

      grid.appendChild(card);
      cards.push(card);
    });

    section.appendChild(grid);
    sectionsEl.appendChild(section);
  });

  // --- Speech ---
  const synth = window.speechSynthesis;
  const voiceNote = document.getElementById("voiceNote");
  let chosenVoice = null;
  let activeBtn = null;

  function pickVoice(){
    if (!synth) return;
    const voices = synth.getVoices();
    chosenVoice =
      voices.find(v => /en-US/i.test(v.lang) && /Google/i.test(v.name)) ||
      voices.find(v => /en-US/i.test(v.lang)) ||
      voices.find(v => /^en/i.test(v.lang)) ||
      voices[0] || null;
  }

  if (!synth){
    voiceNote.textContent = "Your browser doesn't support spoken pronunciation — try Chrome, Edge, or Safari.";
  } else {
    pickVoice();
    synth.addEventListener("voiceschanged", pickVoice);
  }

  function setSpeaking(btn, on){
    btn.classList.toggle("speaking", on);
    btn.querySelector(".label").textContent = on ? "Speaking…" : "Hear it";
  }

  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".hear-btn");
    if (!btn || !synth) return;

    const wasActive = activeBtn === btn;
    synth.cancel();
    if (activeBtn) setSpeaking(activeBtn, false);
    activeBtn = null;
    if (wasActive) return;

    const utter = new SpeechSynthesisUtterance(btn._speakText || btn._label);
    if (chosenVoice) utter.voice = chosenVoice;
    utter.rate = document.getElementById("slowToggle").checked ? 0.62 : 0.88;
    utter.pitch = 1;
    utter.onstart = () => { activeBtn = btn; setSpeaking(btn, true); };
    utter.onend = () => { if (activeBtn === btn) activeBtn = null; setSpeaking(btn, false); };
    utter.onerror = () => { if (activeBtn === btn) activeBtn = null; setSpeaking(btn, false); };
    synth.speak(utter);
  });

  // --- Search filter ---
  const searchInput = document.getElementById("search");
  const emptyMsg = document.getElementById("emptyMsg");

  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim().toLowerCase();
    let anyVisible = false;

    document.querySelectorAll("section.category").forEach(section => {
      let sectionHasMatch = false;
      section.querySelectorAll(".card").forEach(card => {
        const match = !q || card.dataset.search.includes(q);
        card.classList.toggle("hidden", !match);
        if (match) sectionHasMatch = true;
      });
      section.classList.toggle("hidden", !sectionHasMatch);
      if (sectionHasMatch) anyVisible = true;
    });

    emptyMsg.classList.toggle("hidden", anyVisible);
  });
})();
</script>
</body>
</html>
