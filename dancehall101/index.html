<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Dancehall 101 — Wednesday nights at Uptown Lounge, Chicago. College students 21+ get 100% free entry with a verified .edu email." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Dancehall 101" />
  <meta property="og:title" content="Dancehall 101 — Free Student Entry" />
  <meta property="og:description" content="Wednesday nights at Uptown Lounge, Chicago. 21+ college students get 100% free entry with a verified .edu email." />
  <title>Dancehall 101 — Free Student Entry | Uptown Lounge, Chicago</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dancehall101/assets/dancehall101.css" />
</head>
<body>

  <header class="dh-topbar">
    <div class="dh-wordmark">DANCEHALL<span>101</span></div>
    <div class="dh-tagline">Lessons in Dancehall Culture</div>
  </header>

  <main id="dh-main">
    <div class="dh-hero" id="dh-hero">
      <h1>Loading&hellip;</h1>
    </div>
  </main>

  <footer class="dh-footer">Dancehall 101 &mdash; presented by TRC Events, a Ras Tafari Inc production. Uptown Lounge, Chicago.</footer>

  <script src="/assets/js/supabase-client.js"></script>
  <script src="/dancehall101/assets/dancehall101-client.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('school');
      const ref = params.get('ref');
      const main = document.getElementById('dh-main');

      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function renderPicker(schools) {
        main.innerHTML =
          '<div class="dh-hero">' +
            '<h1>Free Entry for <span class="accent">College Students</span></h1>' +
            '<p class="dh-sub">Every Wednesday night at Uptown Lounge, Chicago. 21+ students get 100% free entry &mdash; verify your .edu email and get your ticket in seconds.</p>' +
            '<span class="dh-badge">21+ Event &middot; Wednesday Nights</span>' +
          '</div>' +
          '<div class="dh-picker">' +
            '<input type="search" id="dh-search" placeholder="Find your school&hellip;" autocomplete="off" />' +
            '<div class="dh-school-grid" id="dh-school-grid"></div>' +
            '<p class="dh-empty" id="dh-empty" style="display:none;">No schools match your search.</p>' +
          '</div>';

        const grid = document.getElementById('dh-school-grid');
        const search = document.getElementById('dh-search');
        const empty = document.getElementById('dh-empty');

        function draw(list) {
          grid.innerHTML = list.map(function (s) {
            // Each card scopes --school-primary/--school-secondary to
            // itself via inline custom properties -- the page-wide
            // applyBranding() only applies to a single selected school, but
            // here every card needs its OWN school's colors simultaneously.
            var style = '--school-primary:' + (s.color_primary || '#C8102E') + ';--school-secondary:' + (s.color_secondary || '#F2B705') + ';';
            return '<a class="dh-school-card" style="' + style + '" href="/dancehall101/?school=' + encodeURIComponent(s.slug) + '">' +
              window.DH101.wordmarkHtml(s, 'dh-wm-sm') +
              '<div class="name">' + escapeHtml(s.name) + '</div>' +
              (s.mascot ? '<div class="mascot">' + escapeHtml(s.mascot) + '</div>' : '') +
              '</a>';
          }).join('');
          empty.style.display = list.length ? 'none' : 'block';
        }

        draw(schools);
        search.addEventListener('input', function () {
          const q = search.value.trim().toLowerCase();
          draw(schools.filter(function (s) { return s.name.toLowerCase().indexOf(q) !== -1; }));
        });
      }

      function renderSchoolLanding(school) {
        window.DH101.applyBranding(school);
        document.title = (school.mascot ? school.mascot : school.name) + ' Take Wednesdays — Dancehall 101';

        // Mascot-led headline when we have one confirmed ("BLUE DEMONS Take
        // Wednesdays", school name as a smaller line underneath) reads far
        // more like "this is built for my school" than a generic reskin;
        // falls back to the plain school name when no mascot is known.
        var headline = school.mascot
          ? '<h1><span class="accent">' + escapeHtml(school.mascot) + '</span><br>Take Wednesdays</h1><div class="dh-mascot-tag">' + escapeHtml(school.name) + '</div>'
          : '<h1>' + escapeHtml(school.name) + '<br><span class="accent">Takes Wednesdays</span></h1>';

        main.innerHTML =
          '<div class="dh-hero">' +
            window.DH101.wordmarkHtml(school, 'dh-wm-lg') +
            headline +
            '<p class="dh-sub">Dancehall 101 &mdash; Wednesdays at Uptown Lounge. Free for ' + escapeHtml(school.name) + ' students, 21+.</p>' +
            '<span class="dh-badge">Chicago&rsquo;s #1 Dancehall Experience</span>' +
          '</div>' +
          '<div class="dh-form-wrap">' +
            '<form class="dh-form" id="dh-signup-form">' +
              '<h2>Claim Your Free Ticket</h2>' +
              '<label for="dh-name">Full Name</label>' +
              '<input type="text" id="dh-name" required />' +
              '<label for="dh-email">' + escapeHtml(school.name) + ' Email (.edu)</label>' +
              '<input type="email" id="dh-email" required />' +
              '<label for="dh-dob">Date of Birth</label>' +
              '<input type="date" id="dh-dob" required />' +
              '<label for="dh-segment">I Am A&hellip;</label>' +
              '<select id="dh-segment">' +
                '<option value="UNDERGRAD">Undergraduate Student</option>' +
                '<option value="GRAD">Graduate Student</option>' +
                '<option value="ALUMNI">Alumni</option>' +
              '</select>' +
              '<input type="text" class="dh-hp" id="dh-hp" tabindex="-1" autocomplete="off" />' +
              '<button type="submit" id="dh-submit-btn">Get My Free Ticket</button>' +
              '<div class="dh-form-msg" id="dh-form-msg"></div>' +
            '</form>' +
          '</div>';

        const form = document.getElementById('dh-signup-form');
        const msg = document.getElementById('dh-form-msg');
        const submitBtn = document.getElementById('dh-submit-btn');

        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          msg.textContent = '';
          msg.className = 'dh-form-msg';

          const email = document.getElementById('dh-email').value.trim();
          const dob = document.getElementById('dh-dob').value;

          if (!/@[^@]+\.edu$/i.test(email)) {
            msg.textContent = 'Please use your school .edu email address.';
            msg.className = 'dh-form-msg is-error';
            return;
          }
          const age = (function () {
            const d = new Date(dob + 'T00:00:00');
            const now = new Date();
            let a = now.getFullYear() - d.getFullYear();
            const m = now.getMonth() - d.getMonth();
            if (m < 0 || (m === 0 && now.getDate() < d.getDate())) a--;
            return a;
          })();
          if (age < 21) {
            msg.textContent = "Dancehall 101 is a 21+ event. You're not eligible for free entry.";
            msg.className = 'dh-form-msg is-error';
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = 'Sending&hellip;';

          try {
            const result = await window.DH101.submitSignup({
              school: school,
              fullName: document.getElementById('dh-name').value.trim(),
              eduEmail: email,
              dob: dob,
              studentSegment: document.getElementById('dh-segment').value,
              referralCode: ref,
              honeypot: document.getElementById('dh-hp').value,
            });
            if (result.skipped) {
              // Bot trap tripped -- show the same success message, do nothing else.
              msg.textContent = 'Check your email to verify and view your ticket!';
              msg.className = 'dh-form-msg is-success';
              form.reset();
              return;
            }
            msg.textContent = 'Check your email to verify and view your ticket!';
            msg.className = 'dh-form-msg is-success';
            form.reset();
          } catch (err) {
            console.error('Dancehall 101 signup failed:', err);
            const already = err && err.message && /duplicate key|unique/i.test(err.message);
            msg.textContent = already
              ? "You've already signed up with this email — check your inbox for your ticket link."
              : 'Something went wrong. Please try again.';
            msg.className = 'dh-form-msg is-error';
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Get My Free Ticket';
          }
        });
      }

      (async function init() {
        try {
          if (slug) {
            const school = await window.DH101.fetchSchoolBySlug(slug);
            if (!school) {
              main.innerHTML = '<div class="dh-hero"><h1>School Not Found</h1><p class="dh-sub">We couldn&rsquo;t find that school. <a href="/dancehall101/">Browse all participating schools &rarr;</a></p></div>';
              return;
            }
            renderSchoolLanding(school);
          } else {
            const schools = await window.DH101.fetchActiveSchools();
            renderPicker(schools);
          }
        } catch (err) {
          console.error('Dancehall 101 load failed:', err);
          main.innerHTML = '<div class="dh-hero"><h1>Something Went Wrong</h1><p class="dh-sub">Please refresh and try again.</p></div>';
        }
      })();
    })();
  </script>
</body>
</html>
