<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dancehall 101 — Door Check-In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dancehall101/assets/dancehall101.css" />

  <style>
    #dh-gate {
      max-width: 380px;
      margin: 60px auto;
      padding: 32px;
      background: var(--dh-card);
      border: 1px solid var(--dh-border);
      border-radius: 16px;
    }
    #dh-gate h2 { font-size: 1.1rem; margin-bottom: 18px; text-align: center; }
    #dh-gate input {
      width: 100%;
      font-family: inherit;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--dh-border);
      border-radius: 8px;
      padding: 11px 13px;
      color: var(--dh-text);
      font-size: 0.95rem;
      margin-bottom: 12px;
    }
    #dh-gate button, .dh-checkin-panel button {
      background: var(--school-primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
    #dh-gate-msg { margin-top: 10px; font-size: 0.85rem; color: #e08585; text-align: center; min-height: 1.2em; }

    #dh-checkin { display: none; max-width: 640px; margin: 0 auto; padding: 28px 20px 60px; }
    .dh-count-banner {
      text-align: center;
      background: var(--dh-card);
      border: 1px solid var(--dh-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 22px;
    }
    .dh-count-banner .n { font-size: 2rem; color: var(--school-secondary); font-weight: 700; }
    .dh-scan-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .dh-scan-row input {
      flex: 1;
      font-family: inherit;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--dh-border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--dh-text);
      font-size: 1rem;
    }
    .dh-scan-row button { width: auto; padding: 0 20px; }
    .dh-result-card {
      background: var(--dh-card);
      border: 1px solid var(--dh-border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-top: 14px;
    }
    .dh-result-card .status-line { font-weight: 700; margin-bottom: 6px; }
    .status-checked_in { color: #6dbe8f; }
    .status-already_checked_in { color: var(--school-secondary); }
    .status-not_verified { color: #e0a85c; }
    .status-not_found { color: #e08585; }

    .dh-search-results { margin-top: 20px; }
    .dh-search-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--dh-border);
    }
    .dh-search-row .info { font-size: 0.88rem; }
    .dh-search-row .info .sub { color: var(--dh-text-dim); font-size: 0.78rem; }
    .dh-search-row button {
      width: auto;
      padding: 8px 14px;
      font-size: 0.82rem;
    }
    .dh-search-row button:disabled { opacity: 0.5; cursor: not-allowed; }
    .dh-logout-row { text-align: right; margin-bottom: 16px; }
    .dh-logout-row button {
      width: auto;
      background: none;
      border: 1px solid var(--dh-border);
      color: #ccc;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header class="dh-topbar">
    <div class="dh-wordmark">DANCEHALL<span>101</span></div>
    <div class="dh-tagline">Door Check-In</div>
  </header>

  <div id="dh-gate">
    <h2>Staff Login</h2>
    <form id="dh-gate-form">
      <input type="email" id="dh-gate-email" placeholder="Email" autocomplete="username" required />
      <input type="password" id="dh-gate-password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Log In</button>
      <div id="dh-gate-msg"></div>
    </form>
  </div>

  <main id="dh-checkin">
    <div class="dh-logout-row"><button id="dh-logout-btn">Log out</button></div>
    <div class="dh-count-banner"><div class="n" id="dh-count">0</div><div>Checked In Tonight</div></div>

    <div class="dh-scan-row">
      <input type="text" id="dh-code-input" placeholder="Scan or type ticket ID / redemption code" autofocus />
      <button id="dh-code-btn" type="button">Check In</button>
    </div>
    <div id="dh-code-result"></div>

    <div class="dh-scan-row" style="margin-top:24px;">
      <input type="text" id="dh-name-input" placeholder="Or search by name&hellip;" />
    </div>
    <div class="dh-search-results" id="dh-name-results"></div>
  </main>

  <script src="/assets/js/supabase-client.js"></script>
  <script>
    (function () {
      const gate = document.getElementById('dh-gate');
      const checkinEl = document.getElementById('dh-checkin');
      const gateForm = document.getElementById('dh-gate-form');
      const gateMsg = document.getElementById('dh-gate-msg');

      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      async function refreshCount() {
        const client = await window.sfSupabaseReady;
        const { count, error } = await client
          .from('dh101_door_checkin')
          .select('id', { count: 'exact', head: true })
          .eq('checked_in', true);
        if (!error) document.getElementById('dh-count').textContent = count || 0;
      }

      function statusLabel(status) {
        return {
          checked_in: 'Checked In ✓',
          already_checked_in: 'Already Checked In',
          not_verified: 'Not Yet Verified — Deny Entry',
          not_found: 'Code Not Found',
        }[status] || status;
      }

      async function doCheckIn(code, resultEl) {
        const client = await window.sfSupabaseReady;
        const { data, error } = await client.rpc('dh101_check_in_ticket', { p_code: code });
        const r = (data && data[0]) || null;
        if (error || !r) {
          resultEl.innerHTML = '<div class="dh-result-card"><div class="status-line status-not_found">Error checking in</div></div>';
          return;
        }
        resultEl.innerHTML =
          '<div class="dh-result-card">' +
            '<div class="status-line status-' + r.status + '">' + statusLabel(r.status) + '</div>' +
            (r.full_name ? '<div>' + escapeHtml(r.full_name) + (r.school_name ? ' — ' + escapeHtml(r.school_name) : '') + '</div>' : '') +
            (r.ticket_id ? '<div style="color:var(--dh-text-dim);font-size:0.82rem;">' + escapeHtml(r.ticket_id) + '</div>' : '') +
          '</div>';
        if (r.status === 'checked_in') refreshCount();
      }

      function wireCheckinUI() {
        const codeInput = document.getElementById('dh-code-input');
        const codeBtn = document.getElementById('dh-code-btn');
        const codeResult = document.getElementById('dh-code-result');
        const nameInput = document.getElementById('dh-name-input');
        const nameResults = document.getElementById('dh-name-results');

        async function submitCode() {
          const code = codeInput.value.trim();
          if (!code) return;
          await doCheckIn(code, codeResult);
          codeInput.value = '';
          codeInput.focus();
        }
        codeBtn.addEventListener('click', submitCode);
        codeInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') submitCode();
        });

        let searchTimer = null;
        nameInput.addEventListener('input', function () {
          clearTimeout(searchTimer);
          const q = nameInput.value.trim();
          if (q.length < 2) { nameResults.innerHTML = ''; return; }
          searchTimer = setTimeout(async function () {
            const client = await window.sfSupabaseReady;
            const { data, error } = await client
              .from('dh101_door_checkin')
              .select('ticket_id, full_name, school_name, is_verified, checked_in')
              .ilike('full_name', '%' + q + '%')
              .limit(10);
            if (error) return;
            nameResults.innerHTML = (data || []).map(function (row) {
              return '<div class="dh-search-row">' +
                '<div class="info">' + escapeHtml(row.full_name) + '<div class="sub">' + escapeHtml(row.school_name) + (row.is_verified ? '' : ' — not verified') + '</div></div>' +
                '<button data-ticket="' + escapeHtml(row.ticket_id || '') + '" ' + (row.checked_in ? 'disabled' : '') + '>' + (row.checked_in ? 'Checked In' : 'Check In') + '</button>' +
                '</div>';
            }).join('') || '<p style="color:var(--dh-text-dim);">No matches.</p>';
          }, 250);
        });

        nameResults.addEventListener('click', async function (e) {
          if (e.target.tagName !== 'BUTTON' || !e.target.dataset.ticket) return;
          const btn = e.target;
          btn.disabled = true;
          await doCheckIn(btn.dataset.ticket, codeResult);
          btn.textContent = 'Checked In';
        });
      }

      function showCheckin() {
        gate.style.display = 'none';
        checkinEl.style.display = 'block';
        refreshCount();
      }

      gateForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        gateMsg.textContent = '';
        const email = document.getElementById('dh-gate-email').value.trim();
        const password = document.getElementById('dh-gate-password').value;
        const client = await window.sfSupabaseReady;
        const { error } = await client.auth.signInWithPassword({ email: email, password: password });
        if (error) {
          gateMsg.textContent = 'Incorrect email or password.';
          return;
        }
        showCheckin();
      });

      document.getElementById('dh-logout-btn').addEventListener('click', async function () {
        const client = await window.sfSupabaseReady;
        await client.auth.signOut();
        checkinEl.style.display = 'none';
        gate.style.display = 'block';
      });

      wireCheckinUI();

      (async function init() {
        const client = await window.sfSupabaseReady;
        const { data } = await client.auth.getSession();
        if (data && data.session) showCheckin();
      })();
    })();
  </script>
</body>
</html>
