<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Seven real steps in the Bongo Beach formation system — from the first link a new volunteer opens, to a saved, versioned contribution. Click through each real screen.">
<title>How It Works | Formation | 63rd Street Bongo Beach Park Advisory Council</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --ink:#0B1F2E;
    --ink-soft:#16324A;
    --shore:#EDE3CE;
    --shore-dim:#D9CCA9;
    --tide:#3A8FA3;
    --tide-soft:#7fb9c8;
    --ember:#C1502E;
    --moss:#4F7A52;
    --text-on-ink:#F4EFE1;
    --text-on-shore:#1B2A2F;
    --text-dim-on-ink:#9FB4C2;
    --rail-bg:var(--ink);
    --stage-bg:var(--shore);
    --card-bg:#FFFFFF;
    --caption-text:#4A5A54;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --stage-bg:#12211F;
      --card-bg:#1B2C2A;
      --caption-text:#B9C6BE;
      --text-on-shore:#EDE7D8;
    }
  }
  :root[data-theme="dark"]{
    --stage-bg:#12211F;
    --card-bg:#1B2C2A;
    --caption-text:#B9C6BE;
    --text-on-shore:#EDE7D8;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--stage-bg);
    color:var(--text-on-shore);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:inherit;}

  .display{font-family:Arial,"Helvetica Neue",sans-serif; font-weight:900; text-transform:uppercase; letter-spacing:0.04em;}
  .mono{font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; font-variant-numeric:tabular-nums;}

  #waveTop{display:block; width:100%; height:46px; background:var(--ink);}

  .back-link{display:block; max-width:1180px; margin:0 auto; padding:10px 20px 0; font-size:0.76rem; font-weight:700; color:var(--tide-soft);}
  .back-link a{color:inherit;}
  .back-link a:hover{color:var(--text-on-shore);}

  .app{max-width:1180px; margin:0 auto; padding:0 20px 60px;}

  .masthead{padding:22px 4px 26px; text-align:center;}
  .masthead .eyebrow{font-size:0.66rem; letter-spacing:0.22em; color:var(--tide); font-weight:800; margin-bottom:8px;}
  .masthead h1{margin:0 0 8px; font-size:clamp(1.5rem,3.4vw,2.1rem); color:var(--text-on-shore); text-wrap:balance;}
  .masthead p{margin:0 auto; max-width:56ch; font-size:0.94rem; color:var(--caption-text);}

  .layout{display:grid; grid-template-columns:250px 1fr; gap:26px; align-items:start;}
  @media (max-width:820px){ .layout{grid-template-columns:1fr;} }

  .rail{background:var(--rail-bg); border-radius:18px; padding:20px 16px 22px; position:sticky; top:20px;}
  .rail-head{display:flex; align-items:baseline; justify-content:space-between; padding:0 4px 14px; border-bottom:1px solid rgba(244,239,225,0.14); margin-bottom:14px;}
  .rail-head span:first-child{font-size:0.66rem; letter-spacing:0.14em; color:var(--text-dim-on-ink); text-transform:uppercase; font-weight:700;}
  .rail-head span.mono{font-size:0.72rem; color:var(--text-on-ink);}

  .tide-track{position:relative; padding-left:22px;}
  .tide-line{position:absolute; left:8px; top:6px; bottom:6px; width:2px; background:rgba(244,239,225,0.16); border-radius:2px;}
  .tide-fill{position:absolute; left:8px; top:6px; width:2px; background:linear-gradient(180deg,var(--tide),var(--ember)); border-radius:2px; transition:height 0.4s ease;}

  .step-btn{display:block; width:100%; text-align:left; background:none; border:none; color:var(--text-dim-on-ink); padding:9px 8px 9px 4px; margin-bottom:2px; border-radius:10px; cursor:pointer; position:relative;}
  .step-btn:hover{background:rgba(244,239,225,0.06); color:var(--text-on-ink);}
  .step-btn .dot{position:absolute; left:-19px; top:14px; width:9px; height:9px; border-radius:50%; background:var(--ink-soft); border:2px solid rgba(244,239,225,0.3);}
  .step-btn.seen .dot{background:var(--tide); border-color:var(--tide);}
  .step-btn.active{background:rgba(58,143,163,0.16); color:var(--text-on-ink);}
  .step-btn.active .dot{background:var(--ember); border-color:var(--ember); box-shadow:0 0 0 3px rgba(193,80,46,0.25);}
  .step-btn .num{font-size:0.64rem; font-weight:800; color:var(--tide-soft); letter-spacing:0.06em; display:block; margin-bottom:2px;}
  .step-btn.active .num{color:var(--ember);}
  .step-btn .label{font-size:0.82rem; font-weight:600; display:block;}
  .step-btn:focus-visible{outline:2px solid var(--tide); outline-offset:2px;}

  .stage{min-width:0;}
  .browser{background:var(--card-bg); border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(11,31,46,0.16); border:1px solid rgba(11,31,46,0.08);}
  .browser-bar{background:#00243F; padding:10px 14px; display:flex; align-items:center; gap:10px;}
  .browser-dots{display:flex; gap:6px; flex-shrink:0;}
  .browser-dots span{width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.25);}
  .browser-url{background:rgba(255,255,255,0.08); color:#cfe0ea; font-size:0.72rem; padding:6px 12px; border-radius:8px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .browser-url .lock{margin-right:6px; opacity:0.7;}

  .mock{padding:0;}
  .mock-inner{padding:26px 28px; font-size:0.92rem;}
  .step-tag{display:inline-block; font-size:0.62rem; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; padding:4px 10px; border-radius:10px; margin-bottom:12px;}

  .caption{margin-top:16px; padding:16px 18px; border-radius:12px; background:rgba(58,143,163,0.08); border-left:3px solid var(--tide); font-size:0.86rem; color:var(--caption-text);}
  .caption strong{color:var(--text-on-shore);}

  .stage-nav{display:flex; align-items:center; justify-content:space-between; margin-top:18px; gap:12px;}
  .nav-btn{background:var(--card-bg); border:1.5px solid rgba(11,31,46,0.14); color:var(--text-on-shore); font-weight:700; font-size:0.78rem; padding:10px 18px; border-radius:20px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;}
  .nav-btn:hover{border-color:var(--tide); color:var(--tide);}
  .nav-btn:disabled{opacity:0.35; cursor:default;}
  .nav-btn.primary{background:var(--ember); border-color:var(--ember); color:#fff;}
  .nav-btn.primary:hover{background:#a5432a; color:#fff;}
  .step-counter{font-size:0.72rem; color:var(--caption-text); font-weight:700;}

  /* ---- faithful recreations of the real bbpac UI, using the site's own tokens ---- */
  .bb{ --navy:#002649; --cream:#FAF6EE; --culture:#A6331A; --community:#476D3E; --lakefront:#2F81B4; --legacy:#DC8311; --sand:#D4A96E; --line:rgba(0,38,73,0.14); --ink-dim:#5b6b7a; background:var(--cream); color:var(--navy); }
  .bb-hero{background:linear-gradient(135deg,var(--navy),#013a6b); color:#fff; padding:22px 26px; text-align:center;}
  .bb-hero .eb{font-size:0.62rem; letter-spacing:0.26em; text-transform:uppercase; color:#f0c98a; margin-bottom:8px;}
  .bb-hero h2{font-family:Arial,sans-serif; font-weight:900; font-size:1.15rem; margin:0 0 6px;}
  .bb-hero p{margin:0 auto; max-width:440px; font-size:0.8rem; color:#dbe6f0;}

  .bb-body{padding:20px 26px 26px;}

  .bb-counter-row{display:flex; justify-content:space-between; align-items:center; font-size:0.66rem; color:var(--ink-dim); margin-bottom:8px;}
  .bb-dots{display:flex; gap:5px; justify-content:center; margin-bottom:14px;}
  .bb-dots span{width:6px; height:6px; border-radius:50%; background:var(--line);}
  .bb-dots span.on{background:var(--culture); width:16px; border-radius:4px;}

  .bb-frame{background:#fff; border:1.5px solid var(--line); border-radius:16px; padding:22px 22px;}
  .bb-batch{display:inline-block; font-size:0.6rem; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; color:var(--community); background:rgba(71,109,62,0.1); padding:3px 10px; border-radius:10px; margin-bottom:10px;}
  .bb-headline{font-family:Arial,sans-serif; font-weight:900; font-size:1.05rem; margin:0 0 8px; color:var(--navy);}
  .bb-more{display:inline-flex; gap:5px; border:1.5px solid var(--line); color:var(--navy); font-size:0.7rem; font-weight:700; padding:5px 12px; border-radius:14px; margin-top:6px;}

  .bb-nav-row{display:flex; justify-content:space-between; align-items:center; margin-top:16px;}
  .bb-circle{width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line); display:inline-flex; align-items:center; justify-content:center; font-size:0.7rem; margin-right:6px;}

  .bb-strip{border:1px dashed var(--line); border-radius:10px; padding:10px 14px; font-size:0.74rem; color:var(--ink-dim); margin-bottom:14px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .bb-strip a{color:var(--lakefront); font-weight:700;}

  .bb-controls-row{display:flex; justify-content:space-between; align-items:center; margin:12px 0; flex-wrap:wrap; gap:10px;}
  .bb-toggle{font-size:0.76rem; display:flex; align-items:center; gap:6px; color:#374a5c;}
  .bb-quickbtn{font-size:0.68rem; font-weight:700; color:var(--lakefront); border:1.5px solid var(--lakefront); border-radius:16px; padding:6px 12px;}

  .bb-row{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:9px; padding:9px 12px; margin-bottom:6px; font-size:0.78rem;}
  .bb-row .t{font-weight:700; flex:1;}
  .bb-row .m{font-size:0.68rem; color:var(--ink-dim); display:block;}
  .bb-badge{font-size:0.6rem; font-weight:800; padding:2px 8px; border-radius:8px; text-transform:uppercase; white-space:nowrap;}
  .bb-badge.open{background:rgba(71,109,62,0.14); color:var(--community);}
  .bb-badge.claimed{background:rgba(220,131,17,0.14); color:#8a5a0d;}

  .bb-form-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-top:12px;}
  .bb-form-card label{display:block; font-size:0.62rem; font-weight:800; text-transform:uppercase; color:var(--ink-dim); margin:8px 0 3px;}
  .bb-input{border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; font-size:0.8rem; width:100%; color:#8a97a3; background:#fbfbfa;}
  .bb-btn{display:inline-block; font-size:0.66rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; padding:9px 16px; border-radius:18px; margin-top:10px;}
  .bb-btn.primary{background:var(--culture); color:#fff;}
  .bb-btn.secondary{background:transparent; border:1.5px solid var(--navy); color:var(--navy);}

  .bb-email{border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff;}
  .bb-email-head{background:#f1ede3; padding:10px 16px; font-size:0.72rem; color:#6b7688;}
  .bb-email-head b{color:var(--navy);}
  .bb-email-body{padding:16px 18px; font-size:0.82rem; color:#33404c;}

  .bb-login-box{background:#fff; border:1px solid var(--line); border-radius:16px; padding:26px; max-width:340px; margin:0 auto; text-align:center;}

  .bb-who{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin-bottom:12px;}
  .bb-who h3{margin:0 0 3px; font-size:0.9rem;}
  .bb-who .role{font-size:0.72rem; color:var(--ink-dim);}
  .bb-team{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin-bottom:12px;}
  .bb-role-badge{font-size:0.58rem; font-weight:800; text-transform:uppercase; padding:2px 8px; border-radius:8px; background:rgba(220,131,17,0.14); color:#8a5a0d;}

  .bb-item{background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px;}
  .bb-oid{font-size:0.62rem; color:var(--ink-dim); font-weight:700;}
  .bb-otitle{font-weight:700; font-size:0.9rem; margin:2px 0 8px;}
  .bb-obody{color:#33404c; font-size:0.78rem; margin:0 0 10px;}
  .bb-answer-block{border:1.5px solid rgba(31,58,77,0.16); border-radius:10px; overflow:hidden;}
  .bb-guidance{padding:11px 13px; font-size:0.76rem; line-height:1.5; background:rgba(220,131,17,0.1); color:#4a3a1e; border-bottom:1.5px dashed rgba(31,58,77,0.18);}
  .bb-guidance.done{background:rgba(71,109,62,0.08); color:#2f4a2a;}
  .bb-pointer{text-align:center; font-weight:800; font-size:0.6rem; letter-spacing:0.04em; text-transform:uppercase; color:var(--navy); background:#f4f7f9; padding:5px 0; border-bottom:1.5px dashed rgba(31,58,77,0.18);}
  .bb-field{padding:9px 13px 0;}
  .bb-field label{font-size:0.6rem; font-weight:800; text-transform:uppercase; color:var(--ink-dim); display:block; margin-bottom:3px;}
  .bb-ta{position:relative;}
  .bb-ta textarea{width:100%; min-height:40px; border:1px solid var(--line); border-radius:7px; padding:7px 30px 7px 9px; font-size:0.76rem; font-family:inherit; resize:none; background:#fff; color:#33404c;}
  .bb-mic{position:absolute; right:5px; top:5px; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line); background:#fff; font-size:0.6rem; display:flex; align-items:center; justify-content:center; color:var(--ink-dim);}
  .bb-grammar{font-size:0.64rem; color:var(--lakefront); font-weight:700; margin:4px 0 0; display:block;}
  .bb-save-row{padding:10px 13px 13px; display:flex; align-items:center; gap:10px;}
  .bb-saved-msg{font-size:0.68rem; font-weight:700; color:var(--community); background:rgba(71,109,62,0.1); padding:4px 10px; border-radius:10px;}
  .bb-version{margin-top:12px; font-size:0.68rem; color:var(--ink-dim); border-top:1px dashed var(--line); padding-top:10px;}
  .bb-version .who{color:var(--navy); font-weight:700;}
  .bb-record-label{font-size:0.6rem; font-weight:800; text-transform:uppercase; letter-spacing:0.04em; color:var(--community); background:rgba(71,109,62,0.08); padding:4px 13px; border-bottom:1.5px dashed rgba(31,58,77,0.18);}
  .bb-record-val{font-size:0.76rem; color:#33404c; padding:9px 13px 0;}
  .bb-checklist{padding:9px 13px 12px;}
  .bb-check-head{display:flex; justify-content:space-between; font-size:0.62rem; font-weight:800; text-transform:uppercase; color:var(--ink-dim); margin-bottom:6px;}
  .bb-check-row{display:flex; gap:8px; align-items:flex-start; font-size:0.76rem; color:#33404c; padding:4px 0;}
  .bb-check-row input{margin-top:2px;}
  .bb-check-row.checked span{color:var(--ink-dim); text-decoration:line-through;}

  @media (prefers-reduced-motion: reduce){
    *{scroll-behavior:auto !important;}
    .mock{transition:none !important;}
  }
</style>
</head>
<body>

<canvas id="waveTop"></canvas>

<div class="back-link"><a href="/bbpac/organization/onboarding/orientation.html">&larr; Back to Get Oriented</a></div>

<div class="app">
  <div class="masthead">
    <div class="eyebrow">New Team Member Walkthrough</div>
    <h1 class="display" style="font-size:clamp(1.5rem,3.4vw,2.1rem); letter-spacing:0.01em;">Landing Page to Complete</h1>
    <p>Seven real steps in the Bongo Beach formation system — from the first link a new volunteer opens, to a saved, versioned contribution. Click through the tide line on the left, or use the arrows below.</p>
  </div>

  <div class="layout">
    <aside class="rail" aria-label="Steps">
      <div class="rail-head"><span>Process</span><span class="mono" id="railCount">1 / 7</span></div>
      <div class="tide-track">
        <div class="tide-line"></div>
        <div class="tide-fill" id="tideFill" style="height:0%;"></div>
        <div id="stepList"></div>
      </div>
    </aside>

    <div class="stage">
      <div class="browser">
        <div class="browser-bar">
          <div class="browser-dots"><span></span><span></span><span></span></div>
          <div class="browser-url mono"><span class="lock">&#128274;</span><span id="urlText"></span></div>
        </div>
        <div class="mock" id="mockHost"></div>
      </div>
      <div class="caption" id="captionHost"></div>
      <div class="stage-nav">
        <button type="button" class="nav-btn" id="prevBtn">&larr; Back</button>
        <span class="step-counter mono" id="stepCounterText"></span>
        <button type="button" class="nav-btn primary" id="nextBtn">Next &rarr;</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var STEPS = [
    {
      title: 'Land on Get Oriented',
      url: 'selassiefest.com/bbpac/organization/onboarding/orientation.html',
      tag: { text: 'STEP 1 · LANDING PAGE', bg: 'rgba(58,143,163,0.14)', color: '#1d5a68' },
      caption: 'This is the actual first link a team leader now sends — not the sign-up form. Six narrated frames, one idea each. Autoplay never advances past the final frame; it waits for a real choice.',
      render: function(el){
        el.innerHTML =
          '<div class="bb">' +
            '<div class="bb-hero"><div class="eb">New Here? Start Here</div><h2>Get Oriented in 6 Short Steps</h2><p>Listen, read, or both — tap through at your own pace.</p></div>' +
            '<div class="bb-body">' +
              '<div class="bb-counter-row"><span>01 / 06</span><span>Skip to the end &rarr;</span></div>' +
              '<div class="bb-dots"><span class="on"></span><span></span><span></span><span></span><span></span><span></span></div>' +
              '<div class="bb-frame">' +
                '<span class="bb-batch">Welcome</span>' +
                '<h3 class="bb-headline">Two formations are happening at once, on one beach.</h3>' +
                '<button class="bb-more">Tell me more &#9662;</button>' +
              '</div>' +
              '<div class="bb-nav-row"><span><span class="bb-circle">&#8249;</span><span class="bb-circle">&#8250;</span></span><span><span class="bb-circle">&#128264;</span><span class="bb-circle">&#9654;</span></span></div>' +
            '</div>' +
          '</div>';
      },
    },
    {
      title: 'Choose a Section',
      url: 'selassiefest.com/bbpac/organization/join-a-section.html',
      tag: { text: 'STEP 2 · REQUEST ACCESS', bg: 'rgba(220,131,17,0.16)', color: '#8a5a0d' },
      caption: 'Real open/claimed status for all 27 sections, a "show open only" filter, and a "pick one for me" button for anyone stalled by too much choice. Submitting inserts one row — staff gets notified automatically.',
      render: function(el){
        el.innerHTML =
          '<div class="bb">' +
            '<div class="bb-hero" style="padding:18px 26px;"><div class="eb">Volunteer With The Matrix</div><h2>Join a Section</h2></div>' +
            '<div class="bb-body">' +
              '<div class="bb-strip"><span>New here? Watch the 2-minute overview first.</span><a>Watch &rarr;</a></div>' +
              '<div class="bb-controls-row"><label class="bb-toggle"><input type="checkbox" checked disabled> Show open sections only</label><span class="bb-quickbtn">&#10024; No idea? Pick one for me</span></div>' +
              '<div class="bb-row"><input type="checkbox" checked disabled><div class="info"><span class="t">12. Maintenance &amp; Operations</span><span class="m">26 items &middot; What is this section? &rarr;</span></div><span class="bb-badge open">Open</span></div>' +
              '<div class="bb-row" style="opacity:0.6;"><input type="checkbox" disabled><div class="info"><span class="t">9. Communications</span><span class="m">30 items &middot; What is this section? &rarr;</span></div><span class="bb-badge claimed">Owned by A. Rivera</span></div>' +
              '<div class="bb-form-card">' +
                '<label>Your name</label><div class="bb-input">Jamaican Stevie</div>' +
                '<label>Email</label><div class="bb-input">jamaicanstevie87@gmail.com</div>' +
                '<span class="bb-btn primary">Request Section Access</span>' +
              '</div>' +
            '</div>' +
          '</div>';
      },
    },
    {
      title: 'Staff Approves It',
      url: 'Automatic email — no page to visit',
      tag: { text: 'STEP 3 · APPROVAL', bg: 'rgba(79,122,82,0.16)', color: '#33502f' },
      caption: 'A staff member flips one status field from pending to approved. That single change fires a database trigger which sends this email — nobody has to remember to tell the volunteer by hand.',
      render: function(el){
        el.innerHTML =
          '<div class="bb"><div class="bb-body" style="padding-top:26px;">' +
            '<div class="bb-email">' +
              '<div class="bb-email-head"><b>From:</b> SelassieFest &lt;hello@selassiefest.com&gt;<br><b>Subject:</b> You&#39;re approved &mdash; Section 12, Bongo Beach Formation</div>' +
              '<div class="bb-email-body">Hi Jamaican Stevie,<br><br>Your request to work on Section 12 of the Bongo Beach Master Due-Diligence Matrix has been <b>approved</b>.<br><br>Log in with this email address at My Section &mdash; you&#39;ll get a one-time login link, no password needed.</div>' +
            '</div>' +
          '</div></div>';
      },
    },
    {
      title: 'Log In',
      url: 'selassiefest.com/bbpac/organization/my-section.html',
      tag: { text: 'STEP 4 · AUTHENTICATION', bg: 'rgba(58,143,163,0.14)', color: '#1d5a68' },
      caption: 'No password to create or forget. The email has to match the one that was just approved, or the magic link goes nowhere.',
      render: function(el){
        el.innerHTML =
          '<div class="bb"><div class="bb-body" style="padding-top:34px; padding-bottom:34px;">' +
            '<div class="bb-login-box">' +
              '<h3 style="margin:0 0 10px;">My Section</h3>' +
              '<label style="display:block; font-size:0.62rem; font-weight:800; text-transform:uppercase; color:var(--ink-dim); margin-bottom:5px;">Email</label>' +
              '<div class="bb-input" style="margin-bottom:10px;">jamaicanstevie87@gmail.com</div>' +

      },
    },
    {
      title: 'Land in My Section',
      url: 'selassiefest.com/bbpac/organization/my-section.html',
      tag: { text: 'STEP 5 · YOUR WORKSPACE', bg: 'rgba(220,131,17,0.16)', color: '#8a5a0d' },
      caption: 'Section, role, and team all in one place. A head can add or remove workers here directly — no staff round-trip through the Table Editor for every addition.',
      render: function(el){
        el.innerHTML =
          '<div class="bb"><div class="bb-body">' +
            '<div class="bb-who"><h3>Jamaican Stevie</h3><span class="role">Owns section(s): 12 (head)</span></div>' +
            '<div class="bb-team"><b style="font-size:0.82rem;">Section 12 Team</b> <span class="bb-role-badge">HEAD</span>' +
              '<div style="margin-top:10px; font-size:0.78rem;">Jamaican Stevie <span class="bb-role-badge">HEAD</span></div>' +
              '<div style="margin-top:8px; display:flex; gap:8px;"><span class="bb-input" style="flex:1;">Worker name</span><span class="bb-input" style="flex:1;">Worker email</span><span class="bb-btn primary" style="margin:0;">Add</span></div>' +
            '</div>' +
          '</div></div>';

    },
    {
      title: 'Open a Real Item',
      url: 'selassiefest.com/bbpac/organization/my-section.html#owned-item-342',
      tag: { text: 'STEP 6 · DO THE WORK', bg: 'rgba(220,131,17,0.16)', color: '#8a5a0d' },
      caption: 'Current state and Proposed state are the known record — never a blank box to guess into. The real work is the action checklist: concrete, checkable steps that close the gap between them.',
      render: function(el){
        el.innerHTML =
          '<div class="bb"><div class="bb-body">' +
            '<div class="bb-item">' +
              '<div class="bb-oid">#342 &middot; Section 12: Maintenance &amp; Operations</div>' +

              '<div class="bb-answer-block">' +
                '<div class="bb-guidance"><b>There is no separate document for this.</b> Work through the action items below to find out from <b>Office of Emergency Management and Communications (OEMC)</b> how this works today, updating the record as you learn more.</div>' +
                '<div class="bb-record-label">Known record</div>' +

    {
      title: 'Save → Complete',
      url: 'selassiefest.com/bbpac/organization/my-section.html#owned-item-342',
      tag: { text: 'STEP 7 · DONE, FOR REAL', bg: 'rgba(79,122,82,0.18)', color: '#2f4a2a' },
      caption: 'Not a checkbox that quietly disappears — a permanent, versioned record submitted for review, then approved by a team leader. This is the auditable trail: who changed what, and when.',
      render: function(el){
        el.innerHTML =
          '<div class="bb"><div class="bb-body">' +
            '<div class="bb-item">' +
              '<div class="bb-oid">#342 &middot; Section 12: Maintenance &amp; Operations</div>' +
              '<div class="bb-otitle">311 complaints</div>' +
              '<div class="bb-answer-block">' +

  ];

  var idx = 0;
  var seen = {};
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var railList = document.getElementById('stepList');
  var mockHost = document.getElementById('mockHost');
  var captionHost = document.getElementById('captionHost');
  var urlText = document.getElementById('urlText');
  var tideFill = document.getElementById('tideFill');
  var railCount = document.getElementById('railCount');
  var stepCounterText = document.getElementById('stepCounterText');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');

  function buildRail(){
    railList.innerHTML = STEPS.map(function(s, i){
      return '<button type="button" class="step-btn" data-i="' + i + '"><span class="dot"></span><span class="num mono">STEP ' + (i+1) + '</span><span class="label">' + s.title + '</span></button>';
    }).join('');
    railList.querySelectorAll('.step-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ goTo(Number(btn.getAttribute('data-i'))); });
    });
  }

  function render(){
    var step = STEPS[idx];
    urlText.textContent = step.url;
    var tagHtml = '<span class="step-tag" style="background:' + step.tag.bg + '; color:' + step.tag.color + ';">' + step.tag.text + '</span>';
    mockHost.innerHTML = '';
    var tagRow = document.createElement('div');
    tagRow.style.padding = '18px 22px 0';
    tagRow.innerHTML = tagHtml;
    mockHost.appendChild(tagRow);
    var body = document.createElement('div');
    step.render(body);
    mockHost.appendChild(body);

    captionHost.innerHTML = '<strong>What’s real here:</strong> ' + step.caption;

    railList.querySelectorAll('.step-btn').forEach(function(btn, i){
      btn.classList.toggle('active', i === idx);
      btn.classList.toggle('seen', !!seen[i] && i !== idx);
    });
    railCount.textContent = (idx+1) + ' / ' + STEPS.length;
    stepCounterText.textContent = 'Step ' + (idx+1) + ' of ' + STEPS.length;
    tideFill.style.height = (idx / (STEPS.length - 1) * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === STEPS.length - 1;
    nextBtn.textContent = idx === STEPS.length - 1 ? 'Complete ✓' : 'Next →';
  }

  function goTo(i){
    if (i < 0 || i >= STEPS.length) return;
    idx = i;
    seen[i] = true;
    render();
  }

  prevBtn.addEventListener('click', function(){ goTo(idx - 1); });
  nextBtn.addEventListener('click', function(){ goTo(idx + 1); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') goTo(idx + 1);
    if (e.key === 'ArrowLeft') goTo(idx - 1);
  });

  buildRail();
  seen[0] = true;
  render();

  // ambient tide-line canvas across the top of the page
  var canvas = document.getElementById('waveTop');
  var ctx = canvas.getContext('2d');
  var t = 0;
  function size(){
    canvas.width = canvas.clientWidth * devicePixelRatio;
    canvas.height = canvas.clientHeight * devicePixelRatio;
  }
  function draw(){
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle = 'rgba(122,183,197,0.55)';
    ctx.lineWidth = 2 * devicePixelRatio;
    drawWave(0, 0.9);
    ctx.strokeStyle = 'rgba(193,80,46,0.4)';
    drawWave(40 * devicePixelRatio, 0.6);
  }
  function drawWave(phase, amp){
    var w = canvas.width, h = canvas.height, mid = h * 0.6;
    ctx.beginPath();
    for (var x = 0; x <= w; x += 6){
      var y = mid + Math.sin((x * 0.012) + phase + t) * (h * 0.22 * amp);
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  function loop(){
    t += reduceMotion ? 0 : 0.012;
    draw();
    if (!reduceMotion) requestAnimationFrame(loop);
  }
  size();
  window.addEventListener('resize', function(){ size(); draw(); });
  loop();
})();
</script>
