<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Our Answers | Full Spectrum</title>
<meta name="description" content="Ras Tafari Inc.'s written answers to a partner's questions about Full Spectrum at Rainbow Beach.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg:#FAF8F4; --surface:#FFFFFF; --ink:#16182B; --ink-soft:#474B63; --ink-faint:#7B7F93; --line:#E5E0D6; --line-strong:#D2CBBD;
    --accent:#2F3DB5; --sun:#B87503; --sun-soft:#FCEFD2; --green:#1F7A3E; --green-soft:#E1F1E6; --red:#C0392B; --blue-soft:#E7EAFB;
    --r1:#E0453A; --r2:#F08A24; --r3:#F2C230; --r4:#2E9E58; --r5:#1E8FBF; --r6:#3F48B8; --r7:#8E44AD;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0D0F1C; --surface:#151829; --ink:#EEF0F8; --ink-soft:#B4B8CC; --ink-faint:#878CA3; --line:#272B44; --line-strong:#353A58;
    --accent:#9AA6FF; --sun:#F5B53A; --sun-soft:rgba(245,181,58,0.13); --green:#5BD08A; --green-soft:rgba(91,208,138,0.12); --red:#FF7A70; --blue-soft:rgba(154,166,255,0.12); } }
  :root[data-theme="dark"]{
    --bg:#0D0F1C; --surface:#151829; --ink:#EEF0F8; --ink-soft:#B4B8CC; --ink-faint:#878CA3; --line:#272B44; --line-strong:#353A58;
    --accent:#9AA6FF; --sun:#F5B53A; --sun-soft:rgba(245,181,58,0.13); --green:#5BD08A; --green-soft:rgba(91,208,138,0.12); --red:#FF7A70; --blue-soft:rgba(154,166,255,0.12); }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif; font-size:16.5px; line-height:1.6;}
  a{color:var(--accent);}
  h1,h2,h3,h4{font-family:"Montserrat","Inter",sans-serif; font-weight:800; margin:0; letter-spacing:-0.01em; line-height:1.25;}
  .stripe{height:8px; background:linear-gradient(90deg,var(--r1) 0 14.28%,var(--r2) 14.28% 28.57%,var(--r3) 28.57% 42.85%,var(--r4) 42.85% 57.14%,var(--r5) 57.14% 71.42%,var(--r6) 71.42% 85.71%,var(--r7) 85.71%);}
  .wrap{max-width:760px; margin:0 auto; padding:0 16px;}
  header{padding:30px 0 6px;}
  .eyebrow{font-size:0.74rem; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--sun);}
  h1{font-size:clamp(1.5rem,5.5vw,2.1rem); margin:8px 0 6px;}
  .meta{font-size:0.88rem; color:var(--ink-faint);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px; margin:16px 0;}
  .intro p{margin:0 0 10px;} .intro p:last-child{margin:0;}
  .tally{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .chip{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:0.76rem; font-weight:700; white-space:nowrap;}
  .chip.answered{background:var(--green-soft); color:var(--green);}
  .chip.partial{background:var(--sun-soft); color:var(--sun);}
  .chip.pending{background:var(--blue-soft); color:var(--accent);}
  .chip.new{background:var(--accent); color:var(--surface);}
  h2.sec{font-size:1.2rem; margin:26px 0 4px;}
  .glance{list-style:none; padding:0; margin:0; display:grid; gap:12px;}
  .glance > li{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px;}
  .ghead{display:flex; gap:10px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap;}
  .ghead h3{font-size:1.02rem; display:flex; gap:10px; align-items:baseline;}
  .num{display:inline-grid; place-items:center; width:26px; height:26px; flex:none; border-radius:8px; color:#fff; font-size:0.85rem;}
  .glance ul{margin:10px 0 0; padding-left:20px;} .glance ul li{margin:3px 0;}
  .waiting{margin-top:8px; font-size:0.88rem; color:var(--sun);}
  .more{display:inline-flex; align-items:center; gap:6px; margin-top:10px; font-weight:700; font-size:0.92rem; text-decoration:none;}
  .answer{scroll-margin-top:16px;}
  .answer .q{margin:12px 0 0; padding:10px 14px; border-left:4px solid var(--line-strong); color:var(--ink-soft); font-style:italic; background:var(--bg); border-radius:0 10px 10px 0;}
  .answer .q b{font-style:normal; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; display:block; color:var(--ink-faint);}
  .body{margin-top:14px;} .body p{margin:0 0 12px;} .body ul{margin:0 0 12px; padding-left:22px;} .body li{margin:4px 0;}
  .body h4{font-size:0.98rem; margin:18px 0 6px;}
  .evidence{margin-top:14px; padding-top:12px; border-top:1px dashed var(--line-strong);}
  .evidence h4{font-size:0.82rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;}
  .evidence ul{list-style:none; padding:0; margin:0; display:grid; gap:6px;}
  .evidence li{font-size:0.92rem;} .evidence li i{width:18px; color:var(--ink-faint);}
  .evidence .n{color:var(--ink-faint); font-size:0.84rem;}
  .foot{display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-top:14px; font-size:0.82rem; color:var(--ink-faint);}
  .foot a{text-decoration:none; font-weight:600;}
  .foot .nav{display:flex; flex-wrap:wrap; gap:6px 16px;}
  .glance > li{scroll-margin-top:16px;}
  .log{list-style:none; padding:0; margin:0;} .log li{padding:9px 0; border-bottom:1px solid var(--line); font-size:0.92rem;} .log li:last-child{border:0;}
  .log time{display:inline-block; min-width:108px; color:var(--ink-faint); font-size:0.84rem;}
  .small{font-size:0.85rem; color:var(--ink-faint);}
  .btn{display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:999px; border:1.5px solid var(--line-strong); font-weight:600; font-size:0.9rem; text-decoration:none; color:var(--ink); background:var(--surface); cursor:pointer;}
  .links{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  footer{padding:20px 0 40px; text-align:center; font-size:0.8rem; color:var(--ink-faint);}
  @media print{
    body{background:#fff; color:#000; font-size:11pt;} .stripe,.links,.noprint,.more{display:none !important;}
    .card,.glance > li{border:1px solid #ccc; break-inside:avoid;} .answer{break-inside:auto;} a{color:#000;}
    .body a[href^="http"]::after{content:" (" attr(href) ")"; font-size:9pt; color:#555;}
  }
</style>
</head>
<body>
<div class="stripe"></div>
<div class="wrap">
  <header>
    <div class="eyebrow">Full Spectrum at Rainbow Beach &middot; Ras Tafari Inc.</div>
    <h1 id="title">Our answers</h1>
    <div class="meta" id="meta"></div>
  </header>

  <div id="main"><div class="card"><p class="small">Loading&hellip;</p></div></div>

  <div class="card sig">
    <div><b>Stephen Henry</b><br><span class="small">President, Ras Tafari Inc.</span><br>
      <a href="tel:8722559333">(872) 255-9333</a> &middot; <a href="mailto:stephen@selassiefest.com" id="mail">stephen@selassiefest.com</a></div>
    <div class="links noprint">
      <a class="btn" href="#" onclick="window.print(); return false;"><i class="fa-solid fa-print"></i> Print or save as PDF</a>
      <a class="btn" href="/full-spectrum/"><i class="fa-solid fa-file-lines"></i> The Full Spectrum proposal</a>
    </div>
  </div>
  <footer>Ras Tafari Inc., a 501(c)(3) nonprofit &middot; 1401 E. 71st St., Chicago, IL 60619</footer>
</div>

<script src="/assets/js/supabase-client.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function safeHref(h){ h = String(h || '').trim(); return /^(\/(?!\/)|https:\/\/|mailto:|tel:)/.test(h) ? h : ''; }
  function fmtDay(ts){ return new Date(ts).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}); }
  var key = (new URLSearchParams(location.search).get('k') || '').trim().toLowerCase();
  var COLORS = ['var(--r1)','var(--r2)','var(--r4)','var(--r5)','var(--r6)','var(--r7)','var(--r3)'];
  var STATUS = { answered:['Answered','fa-circle-check'], partial:['Partly answered','fa-circle-half-stroke'], pending:['Being prepared','fa-hourglass-half'] };

  // Inline formatting after escaping: **bold** and [label](url) with safe urls only.
  function inline(s){
    return esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m, label, href){
        var h = safeHref(href.replace(/&amp;/g,'&')); if (!h) return label;
        return '<a href="' + esc(h) + '"' + (/^https:/.test(h) ? ' target="_blank" rel="noopener"' : '') + '>' + label + '</a>';
      });
  }
  // Paragraphs split by blank lines; "- " lines become bullets; "### " lines become subheads.
  function blocks(text){
    var out = '', list = null, para = [];
    function flushP(){ if (para.length){ out += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } }
    function flushL(){ if (list){ out += '<ul>' + list.map(function(x){ return '<li>' + inline(x) + '</li>'; }).join('') + '</ul>'; list = null; } }
    String(text || '').split(/\r?\n/).forEach(function(line){
      var t = line.trim();
      if (!t){ flushP(); flushL(); return; }
      if (/^- /.test(t)){ flushP(); (list = list || []).push(t.slice(2)); return; }
      if (/^### /.test(t)){ flushP(); flushL(); out += '<h4>' + inline(t.slice(4)) + '</h4>'; return; }
      flushL(); para.push(t);
    });
    flushP(); flushL();
    return out;
  }
  function chip(st){ var s = STATUS[st] || STATUS.pending; return '<span class="chip ' + esc(st) + '"><i class="fa-solid ' + s[1] + '"></i> ' + s[0] + '</span>'; }
  function isNew(a){ return a.version > 1 && (Date.now() - new Date(a.updated_at)) < 14 * 86400000; }

  function notFound(){
    $('main').innerHTML = '<div class="card"><p>We couldn’t find this page. Please call Stephen Henry at <a href="tel:8722559333">(872) 255-9333</a> or email <a href="mailto:stephen@selassiefest.com">stephen@selassiefest.com</a>.</p></div>';
  }

  async function boot(){
    if (!/^[a-z0-9]{6,12}$/.test(key)) return notFound();
    try {
      var c = await window.sfSupabaseReady;
      // Staff preview: signed in to the tracker and ?preview=1 shows hidden answers and doesn't count a view.
      var pv = null;
      if (new URLSearchParams(location.search).get('preview') === '1'){ try { pv = (JSON.parse(localStorage.getItem('fsPartnerSession') || 'null') || {}).sessionToken || null; } catch(e){} }
      var r = await c.rpc('fs_partner_qa_view', { p_key: key, p_preview: pv });
      if (r.error || !r.data) return notFound();
      render(r.data);
    } catch(e){ notFound(); }
  }

  function render(d){
    var A = d.answers || [];
    var title = d.title || ('Our answers to ' + d.name + '’s questions');
    document.title = title + ' | Full Spectrum';
    $('title').textContent = title;
    var last = A.reduce(function(m, a){ return a.updated_at > m ? a.updated_at : m; }, '');
    $('meta').textContent = 'Prepared for ' + d.name + (last ? ' · Last updated ' + fmtDay(last) : '') + ' · This page is updated as answers come in.';
    $('mail').href = 'mailto:stephen@selassiefest.com?subject=' + encodeURIComponent('Re: ' + title);

    var counts = { answered:0, partial:0, pending:0 }; A.forEach(function(a){ counts[a.status] = (counts[a.status] || 0) + 1; });
    var html = d.preview ? '<div class="card noprint" style="border:2px dashed var(--sun)"><b>Staff preview.</b> Answers marked “hidden” are not visible to ' + esc(d.name) + ' yet, and this visit is not counted.</div>' : '';
    if (d.intro) html += '<div class="card intro">' + blocks(d.intro) +
      '<div class="tally">' + ['answered','partial','pending'].filter(function(s){ return counts[s]; }).map(function(s){ return chip(s).replace('</span>', ': ' + counts[s] + '</span>'); }).join('') + '</div></div>';

    html += '<h2 class="sec" id="glance">At a glance</h2><p class="small" style="margin:0 0 10px">The short answer to each question. Tap “Read the full answer” for the detail and the documents behind it.</p>';
    html += '<ol class="glance">' + A.map(function(a, i){
      return '<li id="g' + (i + 1) + '"><div class="ghead"><h3><span class="num" style="background:' + COLORS[i % COLORS.length] + '">' + (i + 1) + '</span>' + esc(a.topic) + '</h3>' +
        '<span>' + (d.preview && !a.published ? '<span class="chip pending">hidden</span> ' : '') + (isNew(a) ? '<span class="chip new">Updated ' + esc(fmtDay(a.updated_at)) + '</span> ' : '') + chip(a.status) + '</span></div>' +
        ((a.summary || []).length ? '<ul>' + a.summary.map(function(s){ return '<li>' + inline(s) + '</li>'; }).join('') + '</ul>' : '') +
        (a.waiting_on && a.status !== 'answered' ? '<div class="waiting"><i class="fa-solid fa-hourglass-half"></i> Still open: ' + inline(a.waiting_on) + '</div>' : '') +
        '<a class="more" href="#q' + (i + 1) + '">Read the full answer <i class="fa-solid fa-arrow-down"></i></a></li>';
    }).join('') + '</ol>';

    html += '<h2 class="sec">Full answers</h2>';
    html += A.map(function(a, i){
      var ev = (a.evidence || []).filter(function(e){ return e && e.label; });
      return '<section class="card answer" id="q' + (i + 1) + '">' +
        '<div class="ghead"><h3><span class="num" style="background:' + COLORS[i % COLORS.length] + '">' + (i + 1) + '</span>' + esc(a.topic) + '</h3>' + chip(a.status) + '</div>' +
        '<div class="q"><b>Your question</b>' + esc(a.question) + '</div>' +
        '<div class="body">' + (a.detail ? blocks(a.detail) : '<p class="small">The full answer is being prepared.</p>') + '</div>' +
        (a.waiting_on && a.status !== 'answered' ? '<div class="waiting"><i class="fa-solid fa-hourglass-half"></i> Still open: ' + inline(a.waiting_on) + '</div>' : '') +
        (ev.length ? '<div class="evidence"><h4>Documents and evidence</h4><ul>' + ev.map(function(e){
          var h = safeHref(e.href);
          return '<li><i class="fa-solid ' + (h ? 'fa-link' : 'fa-file-lines') + '"></i> ' + (h ? '<a href="' + esc(h) + '"' + (/^https:/.test(h) ? ' target="_blank" rel="noopener"' : '') + '>' + esc(e.label) + '</a>' : esc(e.label)) +
            (e.note ? ' <span class="n">· ' + esc(e.note) + '</span>' : '') + '</li>';
        }).join('') + '</ul></div>' : '') +
        '<div class="foot"><span>Version ' + a.version + ' · updated ' + esc(fmtDay(a.updated_at)) + '</span><span class="noprint nav">' +
          (i + 1 < A.length ? '<a href="#q' + (i + 2) + '">Next: ' + esc(A[i + 1].topic) + ' <i class="fa-solid fa-arrow-down"></i></a>' : '') +
          '<a href="#g' + (i + 1) + '">Back to this summary <i class="fa-solid fa-arrow-up"></i></a></span></div>' +
      '</section>';
    }).join('');

    var ch = d.changes || [];
    if (ch.length) html += '<div class="card"><h2 style="font-size:1.1rem; margin-bottom:8px">What has changed</h2><ul class="log">' + ch.map(function(c){
      var i = A.findIndex(function(a){ return a.sort === c.sort && a.topic === c.topic; });
      return '<li><time>' + esc(fmtDay(c.changed_at)) + '</time> ' + (i >= 0 ? '<a href="#q' + (i + 1) + '">' + esc(c.topic) + '</a>' : esc(c.topic)) + ' (v' + c.version + '): ' + esc(c.note) + '</li>';
    }).join('') + '</ul></div>';

    $('main').innerHTML = html;
    if (location.hash){ var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  }

  boot();
})();
</script>
</body>
</html>
