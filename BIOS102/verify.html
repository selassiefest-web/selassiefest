<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>BIOS102 Lab Companion | Signing In</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/BIOS102/css/style.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <h1>BIOS102</h1>
      <p class="lede" id="status-msg">Signing you in&hellip;</p>
      <a class="btn" id="retry-link" href="/BIOS102/index.html" style="display:none;text-align:center;">Request a new link</a>
    </div>
  </div>

  <script src="/assets/js/supabase-client.js"></script>
  <script src="/BIOS102/js/app.js"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const statusMsg = document.getElementById('status-msg');
      const retryLink = document.getElementById('retry-link');

      if (!token) {
        statusMsg.textContent = "This sign-in link is missing its token.";
        retryLink.style.display = 'block';
        return;
      }

      try {
        const result = await window.sfSupabase.bios102VerifyLoginLink(token);
        if (!result) {
          statusMsg.textContent = 'This link is invalid or has expired.';
          retryLink.style.display = 'block';
          return;
        }
        BIOS.setSession({
          sessionToken: result.session_token,
          email: result.email,
          displayName: result.display_name,
        });
        statusMsg.textContent = `Welcome, ${result.display_name}! Taking you to your chapters...`;
        window.location.href = '/BIOS102/dashboard.html';
      } catch (err) {
        console.error(err);
        statusMsg.textContent = 'Something went wrong signing you in. Please try again.';
        retryLink.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
