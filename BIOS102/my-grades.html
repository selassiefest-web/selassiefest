<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>BIOS102 Lab Companion | My grades</title>
  <link rel="stylesheet" href="/BIOS102/css/research.css" />
  <link rel="stylesheet" href="/BIOS102/css/docket.css" />
  <link rel="stylesheet" href="/BIOS102/css/style.css" />
  <style>
    .wrap.mid { max-width: 920px; }
    .card2 { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-panel); padding: 16px 18px; margin-bottom: 18px; }
    .card2 h2 { font-size: 1.15rem; margin-bottom: 6px; }
    .help { font-size: .84rem; color: var(--text-dim); line-height: 1.55; margin-top: 6px; }
    .lead { font-size: .92rem; color: var(--text-dim); line-height: 1.6; margin-bottom: 12px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 8px 0 12px; }
    .tiles div { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: rgba(23,36,31,.04); }
    .tiles small { display: block; color: var(--text-dim); font-size: .78rem; line-height: 1.4; }
    .tiles b { display: block; font-size: 1.7rem; font-weight: 500; margin: 2px 0; }
    table.t { border-collapse: collapse; width: 100%; font-size: .9rem; }
    table.t th, table.t td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; }
    table.t th:first-child, table.t td:first-child { text-align: left; }
    table.t thead th { color: var(--accent); font-weight: 500; }
    .scroll { overflow-x: auto; }
    .bar { height: 7px; border-radius: 4px; background: rgba(23,36,31,.1); overflow: hidden; min-width: 90px; }
    .bar i { display: block; height: 100%; background: var(--accent); }
    .ctl { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; margin: 10px 0; font-size: .88rem; color: var(--text-dim); }
    select, input[type=number] { font-family: inherit; font-size: .9rem; padding: 6px 9px; border-radius: 6px; border: 1px solid var(--border); background: #fffcf6; color: var(--text); }
    .b { font-family: inherit; font-size: .86rem; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border); background: rgba(23,36,31,.04); color: var(--text); cursor: pointer; }
    .b:hover { border-color: var(--accent); }
    .b.pri { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .chip { font-size: .8rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-panel); }
    .chip button { background: none; border: 0; color: var(--text-dim); cursor: pointer; margin-left: 4px; }
    .note { margin: 10px 0; padding: 10px 14px; border-radius: 8px; font-size: .9rem; line-height: 1.55; background: var(--accent-soft); }
    .note.amber { background: var(--amber-soft); }
    .row { display: grid; grid-template-columns: minmax(140px, 210px) minmax(110px, 1fr) 86px 96px; gap: 10px; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--border); }
    .row.ex { opacity: .5; }
    .row small { display: block; color: var(--text-dim); font-size: .76rem; }
    .row input[type=range] { width: 100%; accent-color: var(--accent); }
    .row.mk { grid-template-columns: minmax(150px, 220px) 1fr 1fr; }
    .mk .cell { font-size: .82rem; color: var(--text-dim); }
    .mk .cell input[type=range] { width: 100%; accent-color: var(--accent); }
    @media (max-width: 640px) { .row, .row.mk { grid-template-columns: 1fr; } }
    .x { font-size: .84rem; color: var(--text-dim); display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  </style>
</head>
<body>
  <div id="topbar" class="topbar"></div>
  <div class="sd-wrap" style="max-width:1100px;margin:0 auto;padding:18px 20px 0"><header class="sd-head"><div class="sd-bannerbg" style="background-image:url(/BIOS102/img/headers/grades-student.webp)"></div><p class="sd-kicker">Your grades</p><h1 class="rm-h1">My grades</h1><p class="rm-lede">Only you and your instructors can see this page.</p></header></div>
  <div class="wrap mid" id="app"><p class="lead" id="loading">Loading your grades&hellip;</p></div>
  <footer class="site-foot">BIOS102 Lab Companion &middot; your grades are private to you and your instructors</footer>

<script src="/assets/js/supabase-client.js"></script>
<script src="/BIOS102/js/app.js"></script>
<script>
(function () {
  'use strict';
  var session = BIOS.requireSession();
  if (!session) return;
  BIOS.mountTopbar(session);

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var isNum = function (v) { return typeof v === 'number' && isFinite(v); };
  var num = function (n) { return String(Math.round(n * 100) / 100); };
  var f = function (v, d) { return isNum(v) ? v.toFixed(d == null ? 1 : d) : '-'; };
  var pc = function (v) { return v == null ? '-' : f(v, 2) + '%'; };

  /* ---- how this course is graded (published assignments in the Canvas course) ---- */
  // Total points, no category weights: grade = points earned / points in the whole course.
  // An excused assignment leaves the course entirely (it is not a zero and not a score).
  var LATE = 0;           // was 10 while Quiz 7 was missing from the export; the Nov 24 export includes it
  var BASE = 440;         // 15 assignments + 30 participation + 35 lab write-ups + 70 quizzes + 290 exams
  var ITEMS = [
    ['Assignments', 'Lab 1a: Scientific Method', 1.75], ['Assignments', 'Lab 1a: Phylogeny Reading', 2.5], ['Assignments', 'Lab 1a: Evolution Videos', 2],
    ['Assignments', 'Lab 1a: Strange Fish (Part I)', 2], ['Assignments', 'Lab 1a: Strange Fish (Part II)', 5], ['Assignments', 'Lab 1a: Strange Fish (Part III)', 1.75],
    ['Participation', 'Lab 1', 3], ['Participation', 'Labs 2/3', 3], ['Participation', 'Lab 4', 3], ['Participation', 'Lab 5', 3], ['Participation', 'Lab 6', 3],
    ['Participation', 'Lab 7', 3], ['Participation', 'Lab 8', 3], ['Participation', 'Lab 9', 3], ['Participation', 'Lab 10', 3], ['Participation', 'Lab 11', 3],
    ['Lab write-ups', 'Pilobolus Lab Write-Up', 15], ['Lab write-ups', 'Animal Behavior Lab Write-Up', 20],
    ['Quizzes', 'Quiz 1', 10], ['Quizzes', 'Quiz 2', 10], ['Quizzes', 'Quiz 3', 10], ['Quizzes', 'Quiz 4', 10], ['Quizzes', 'Quiz 5', 10], ['Quizzes', 'Quiz 6', 10], ['Quizzes', 'Quiz 7', 10],
    ['Exams', 'Exam 1', 120, 'exam1'], ['Exams', 'Exam 2', 50, 'exam2'], ['Exams', 'Exam 3', 120, 'exam3']
  ].map(function (a) { return { g: a[0], n: a[1], p: a[2], key: a[3] || null }; });
  var STD = { assignments: 15, participation: 30, labs: 35, quizzes: 60 };
  var GROUP_LABEL = { assignments: 'Lab 1a assignments', participation: 'Lab participation', labs: 'Lab write-ups', quizzes: 'Quizzes' };

  var D = null, data = null, cv = null, S = { exc: [], pick: { item: 0, status: 'posted', score: null }, mk: {}, mkOn: {}, mkCredit: 80, pj: null, init: false };

  function cvOf() { return { cp: cv.cp, cd: cv.cd, fp: cv.fp, fd: cv.fd + LATE, g: cv.g }; }
  function autoExcused() { return (data.excused || []).filter(function (k) { return !isNum(data[k]); }); }
  function exPoints(keys) { return keys.reduce(function (s, k) { var it = ITEMS.filter(function (x) { return x.key === k; })[0]; return s + (it ? it.p : 0); }, 0); }
  // Letter grades come from the database scale via the shared BIOS helpers (BIOS102/js/app.js).
  var bandOf = BIOS.bandOf, fg = BIOS.fmtGrade, clampNum = BIOS.clampNum;

  /* ---- where my points came from, item by item (data.items is saved with each student's row) ---- */
  function itemsOf() { return Array.isArray(data.items) ? data.items : []; }
  function notTurnedIn() { return itemsOf().map(function (x, i) { return { i: i, x: x }; }).filter(function (o) { return !o.x.x && !isNum(o.x.s); }); }
  function partialItems() { return itemsOf().filter(function (x) { return !x.x && isNum(x.s) && x.s < x.p - 1e-9; }).sort(function (a, b) { return (b.p - b.s) - (a.p - a.s); }); }
  function lateOpen() { var t = D && D.late_until ? Date.parse(D.late_until) : NaN; return isFinite(t) ? Date.now() <= t : false; }
  function lateText() {
    var t = D && D.late_until ? new Date(D.late_until) : null; if (!t || isNaN(t)) return '';
    return t.toLocaleString('en-US', { timeZone: 'America/Chicago', weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' (Chicago time)';
  }
  // points from not-turned-in items the student ticks, at the credit they choose; only while the late-work window is open
  function mkRecovered() { if (!lateOpen()) return 0; var cr = S.mkCredit / 100; return notTurnedIn().reduce(function (s, o) { return s + (S.mkOn[o.i] ? o.x.p * cr : 0); }, 0); }
  function mkPtsIn(g) { if (!lateOpen()) return 0; return notTurnedIn().reduce(function (s, o) { return s + (S.mkOn[o.i] && o.x.g === g ? o.x.p : 0); }, 0); }

  /* ---- excuse machine ---- */
  function excuseCalc(list) {
    var c = cvOf(), cur = { n: c.cp, d: c.cd }, fin = { n: c.fp, d: c.fd }, p = 0;
    list.forEach(function (e) {
      var it = ITEMS[e.item], s = e.status === 'missing' ? 0 : e.score; p += it.p;
      if (e.status === 'posted') { cur.n -= s; cur.d -= it.p; }
      fin.n -= s; fin.d -= it.p;
    });
    return { cur: cur, fin: fin, removed: p, base: c.fd, c: c };
  }
  function defaults(i) {
    var it = ITEMS[i], v = it.key ? data[it.key] : null;
    return it.key ? (isNum(v) ? { status: 'posted', score: v } : { status: 'missing', score: 0 }) : { status: 'posted', score: null };
  }
  var STATES = { posted: 'Graded and posted', unposted: 'Graded, not posted yet', missing: 'No score (not taken or not graded)' };

  function excuseHTML() {
    var c = cvOf(), h = '<div class="card2" id="sec-excuse"><h2>If I were excused from an assignment</h2>' +
      '<p class="lead">A grade is <b>points earned ÷ points in the whole course</b> (' + BASE + ' points). When an assignment is <b>excused</b>, it is taken out of the course completely: it is not counted as a zero and it is not counted as a score. The course gets smaller and your grade is worked out on what is left.</p>';
    var pre = BASE - c.fd; if (pre > 0.01) h += '<div class="note">You are already excused from <b>' + num(pre) + ' points</b> of work, so the whole course is <b>' + num(c.fd) + ' points</b> for you. That is already counted in every number here.</div>';
    var ae = autoExcused(); if (ae.length) h += '<div class="note amber">You are excused from <b>' + ae.map(function (k) { return ITEMS.filter(function (x) { return x.key === k; })[0].n; }).join(' and ') + '</b>, so the course is <b>' + num(c.fd - exPoints(ae)) + ' points</b> for you. Use the box below to see what that excuse does, compared with not being excused.</div>';
    var groups = {}; ITEMS.forEach(function (it, i) { (groups[it.g] = groups[it.g] || []).push('<option value="' + i + '"' + (i === S.pick.item ? ' selected' : '') + '>' + esc(it.n) + ' (' + it.p + ' pts)</option>'); });
    h += '<div class="ctl"><label>Excuse <select id="ex-item">' + Object.keys(groups).map(function (g) { return '<optgroup label="' + g + '">' + groups[g].join('') + '</optgroup>'; }).join('') + '</select></label>' +
      '<label>Status of that work <select id="ex-status">' + Object.keys(STATES).map(function (k) { return '<option value="' + k + '"' + (S.pick.status === k ? ' selected' : '') + '>' + STATES[k] + '</option>'; }).join('') + '</select></label>' +
      (S.pick.status === 'missing' ? '' : '<label>Score you earned <input type="number" id="ex-score" step="any" min="0" max="' + ITEMS[S.pick.item].p + '" style="width:84px" value="' + (isNum(S.pick.score) ? S.pick.score : '') + '"> of ' + ITEMS[S.pick.item].p + '</label>') +
      '<button class="b pri" type="button" id="ex-add">Add to the comparison</button></div>';
    if (!S.exc.length) return h + '<div class="help">Add an assignment to compare <b>not excused</b> with <b>excused</b>.</div></div>';
    var m = excuseCalc(S.exc), D0 = c.fd, D1 = m.fin.d;
    // "not excused" = the course with every point still in it (c.fd still counts any exam the export marks excused; the pages subtract those separately)
    var tg0 = c.fp / D0 * 100, tg1 = D1 > 0 ? m.fin.n / D1 * 100 : null, w0 = 100 / D0, w1 = D1 > 0 ? 100 / D1 : null;
    var names = S.exc.map(function (e) { return esc(ITEMS[e.item].n); }).join(' and ');
    h += '<div class="chips">' + S.exc.map(function (e, i) { return '<span class="chip">' + esc(ITEMS[e.item].n) + ' · ' + (e.status === 'missing' ? 'no score' : num(e.score) + '/' + ITEMS[e.item].p) + '<button type="button" data-exrm="' + i + '" aria-label="Remove">&times;</button></span>'; }).join('') + '<button class="b" type="button" id="ex-clear">Clear</button></div>';
    var up = function (T) { return 10 / T * 100; };
    h += '<div class="scroll"><table class="t"><thead><tr><th></th><th>Not excused</th><th>Excused from ' + names + '</th></tr></thead><tbody>' +
      '<tr><td>Points in the whole course</td><td>' + num(D0) + '</td><td>' + num(D1) + '</td></tr>' +
      '<tr><td>Points you have earned</td><td>' + num(c.fp) + '</td><td>' + num(m.fin.n) + '</td></tr>' +
      '<tr><td><b>Your total grade so far</b> <span class="help">(points earned \u00F7 points in the course)</span></td><td><b>' + pc(tg0) + '</b></td><td><b>' + pc(tg1) + '</b></td></tr>' +
      '<tr><td>Earning 10 more points adds this much to your grade percentage</td><td>+' + f(up(D0), 1) + '</td><td>' + (D1 > 0 ? '+' + f(up(D1), 1) : '-') + '</td></tr></tbody></table></div>';
    h += '<p class="lead" style="margin-top:12px"><b>In plain words.</b> Your grade is a fraction: the points you have earned on top, the points in the whole course on the bottom. Excusing an assignment takes it off the bottom (and off the top too, if you had a score on it). When the bottom number gets smaller, the same points are a bigger share of it.</p>' +
      '<p class="lead"><b>With your numbers.</b> You have earned ' + num(c.fp) + ' points. Out of ' + num(D0) + ' points that is ' + pc(tg0) + '. With ' + names + ' excused the course is ' + num(D1) + ' points, and the same ' + num(m.fin.n) + ' points is ' + pc(tg1) + '.</p>' +
      '<p class="lead"><b>Your workload does not change.</b> You still do all the same remaining work. What changes is that each point now moves your grade more: earning 10 more points adds ' + f(up(D0), 1) + ' to your percentage when the course is ' + num(D0) + ' points, and ' + (D1 > 0 ? f(up(D1), 1) : '-') + ' when it is ' + num(D1) + '.</p>' +
      '<p class="lead"><b>Excused or not?</b> Being excused is like scoring exactly your usual percentage on that assignment. If you would have scored higher than your usual, the excuse costs you a little; if lower, it helps. Not turning something in (a zero) is the worst outcome, which is why a blank and an excuse are so different.</p>';
    return h + '</div>';
  }

  /* ---- a closer look at my points (calm wording on purpose: no "missed", "lost" or "zero") ---- */
  function makeupHTML() {
    if (!itemsOf().length) return '';
    var nt = notTurnedIn(), pi = partialItems(), open = lateOpen();
    var h = '<div class="card2" id="sec-makeup"><h2>A closer look at my points</h2>';
    if (!nt.length) h += '<div class="note"><b>Everything is accounted for.</b> Every assignment, quiz, lab and lab write-up has a score. Nothing is missing.</div>';
    else {
      h += '<h3 style="margin:14px 0 4px;font-size:1rem">Not turned in yet</h3>' +
        '<p class="lead">' + (open ? 'Your instructor will accept late work until <b>' + lateText() + '</b>. Whether late work earns full or partial credit is your instructor’s decision, so the credit below is only a guess to help you plan.'
          : 'The late-work window closed on ' + lateText() + ', so these scores stay as they are.') + '</p>' +
        nt.map(function (o) {
          return open ? '<label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" data-mki="' + o.i + '"' + (S.mkOn[o.i] ? ' checked' : '') + '> ' + esc(o.x.l) + ' <span class="help" style="margin:0">(' + num(o.x.p) + ' points)</span></label>'
            : '<div style="margin:4px 0">' + esc(o.x.l) + ' <span class="help" style="margin:0">(' + num(o.x.p) + ' points)</span></div>';
        }).join('');
      if (open) h += '<div class="cell" style="margin-top:8px">Credit I might earn on late work: <b id="mkc">' + S.mkCredit + '%</b><input type="range" id="mk-credit" min="0" max="100" step="5" value="' + S.mkCredit + '" aria-label="Credit I might earn on late work"></div><div id="mk-out">' + makeupOut() + '</div>';
    }
    if (pi.length) {
      var tot = pi.reduce(function (s, x) { return s + (x.p - x.s); }, 0);
      h += '<h3 style="margin:16px 0 4px;font-size:1rem">Points on work I already turned in</h3>' +
        '<p class="lead">These pieces are finished and graded. Being a few points short on a piece is normal, and one small difference does not decide your grade. In all, it is <b>' + num(tot) + ' points</b> across <b>' + pi.length + '</b> ' + (pi.length === 1 ? 'piece' : 'pieces') + ' of work.</p>' +
        '<details><summary style="cursor:pointer;color:var(--accent)">See which ones</summary><div class="scroll"><table class="t"><thead><tr><th>Piece of work</th><th>My score</th><th>Out of</th></tr></thead><tbody>' +
        pi.map(function (x) { return '<tr><td>' + esc(x.l) + '</td><td>' + num(x.s) + '</td><td>' + num(x.p) + '</td></tr>'; }).join('') + '</tbody></table></div><div class="help">If a score here looks wrong to you, tell your instructor.</div></details>';
    }
    return h + '</div>';
  }
  function makeupOut() {
    var c = cvOf(), rec = mkRecovered(), D0 = c.fd - exPoints(autoExcused());
    if (rec <= 0) return '<div class="help">Tick an item to see what turning it in could add.</div>';
    return '<div class="note">Turning in the items you ticked, at ' + S.mkCredit + '% credit, would add <b>' + num(rec) + ' points</b>. Your lab grade would go from <b>' + f(c.fp / D0 * 100, 1) + '%</b> to <b>' + f((c.fp + rec) / D0 * 100, 1) + '%</b> (' + f(rec / D0 * 100, 1) + ' percentage points). This is also counted in the planner below.</div>';
  }

  /* ---- projection ---- */
  function remItems() {
    var c = cvOf(), g = c.g || {}, items = [];
    [['exam1', 'Exam 1'], ['exam2', 'Exam 2'], ['exam3', 'Exam 3']].forEach(function (a) {
      if (isNum(data[a[0]]) || (data.excused || []).indexOf(a[0]) >= 0) return;
      items.push({ key: a[0], label: a[1], R: ITEMS.filter(function (x) { return x.key === a[0]; })[0].p });
    });
    [['quizzes', 'Remaining quizzes'], ['participation', 'Remaining lab participation'], ['labs', 'Remaining lab write-ups'], ['assignments', 'Remaining assignments']].forEach(function (a) {
      var x = g[a[0]] || {}, fd = isNum(x.fd) ? x.fd : STD[a[0]], cd = isNum(x.cd) ? x.cd : 0;
      if (a[0] === 'quizzes') fd += LATE;
      var unp = Math.max(0, (x.fp || 0) - (x.cp || 0)), unpPoss = a[0] === 'quizzes' ? Math.ceil(unp / 10 - 1e-9) * 10 : unp;
      var R = Math.max(0, fd - cd - unpPoss - mkPtsIn(a[0])); if (R > 0.01) items.push({ key: a[0], label: a[1], R: R });
    });
    return items;
  }
  function pjState() {
    if (!S.pj) {
      var usual = cv.cd > 0 ? Math.max(0, Math.min(100, Math.round(cv.cp / cv.cd * 100))) : 85, pct = {};
      remItems().forEach(function (it) { pct[it.key] = usual; });
      S.pj = { pct: pct, ex: {}, target: 90, usual: usual };
    }
    return S.pj;
  }
  function pjCalc() {
    var items = remItems(), P = pjState(), c = cvOf(), base = c.fd - exPoints(autoExcused()), rec = mkRecovered(), earned = 0, rem = 0, exp = 0, all = 0;
    items.forEach(function (it) {
      var v = it.R * (isNum(P.pct[it.key]) ? P.pct[it.key] : 0) / 100; all += v;
      if (P.ex[it.key]) { exp += it.R; return; } rem += it.R; earned += v;
    });
    var Dn = base - exp, N = c.fp + rec + earned;
    return { items: items, P: P, D: Dn, N: N, pct: Dn > 0 ? N / Dn * 100 : null, rem: rem, exp: exp, base: base, rec: rec,
      pct0: base > 0 ? (c.fp + rec + all) / base * 100 : null, need: rem > 0 ? ((P.target / 100) * Dn - c.fp - rec) / rem * 100 : null, c: c };
  }
  function pjOutHTML() {
    var k = pjCalc(); if (k.pct == null) return '<div class="help">Nothing left to project.</div>';
    var h = '<div class="tiles"><div><small>Your projected final grade</small><b>' + fg(k.pct, 1) + '%</b><small>' + (LEC == null ? 'your lab grade' : 'overall ' + fg(overall(k.pct), 1) + '% = ' + bandOf(overall(k.pct))) + '</small></div>' +
      '<div><small>Points you would have at the end</small><b>' + num(k.N) + '</b><small>out of ' + num(k.D) + '</small></div>' +
      '<div><small>Points of work left to earn</small><b>' + num(k.rem) + '</b><small>still ahead of you</small></div></div>';
    h += '<p class="lead">If you score ' + k.items.filter(function (it) { return !k.P.ex[it.key]; }).map(function (it) { return f(k.P.pct[it.key], 0) + '% on ' + esc(it.label.toLowerCase()); }).join(', ') + ', your course ends at <b>' + fg(k.pct, 1) + '%</b> (' + num(k.N) + ' of ' + num(k.D) + ' points).' + (k.rec > 0 ? ' That includes <b>' + num(k.rec) + ' points</b> of make-up work from the box above.' : '') + '</p>';
    if (k.exp > 0 && k.pct0 != null) h += '<p class="lead">With the same scores and <b>nothing</b> excused you would finish at <b>' + f(k.pct0, 1) + '%</b> (out of ' + num(k.base) + ' points). The ' + num(k.exp) + ' excused points change your result by <b>' + (k.pct - k.pct0 >= 0 ? '+' : '') + f(k.pct - k.pct0, 1) + ' percentage points</b>.</p>';
    var T = k.P.target, t;
    if (k.need == null) t = 'There is no remaining work to earn.';
    else if (k.need <= 0) t = 'A final grade of ' + T + '% is already secured, whatever the rest turns out to be.';
    else if (k.need > 100.0001) { var best = (k.c.fp + k.rec + k.rem) / k.D * 100; t = T + '% is out of reach from here (it would take more than 100% on everything left). The most you can finish with is <b>' + fg(best, 1) + '%</b>, so try a target you can reach, or see what an excuse or make-up work would change.'; }
    else t = 'To finish with <b>at least ' + T + '%</b>, you need an average of <b>' + f(k.need, 1) + '%</b> on the ' + num(k.rem) + ' points still to earn (' + num((T / 100) * k.D - k.c.fp - k.rec) + ' more points).';
    return h + '<div class="note">' + t + '</div>';
  }
  function projectionHTML() {
    var P = pjState(), items = remItems(), h = '<div class="card2" id="sec-proj"><h2>What if I score this on the rest of the course?</h2>' +
      '<p class="lead">Everything you have already earned stays as it is. Move each slider to the score you expect on the work still to come, and your final grade updates. Tick <b>Excused</b> on any piece to take it out of the course.</p>';
    if (!items.length) return h + '<div class="note">There is no work left to earn.</div></div>';
    h += '<div class="ctl"><b style="color:var(--text)">Set all to</b><button class="b" type="button" data-set="usual">My usual rate (' + P.usual + '%)</button>' +
      [100, 90, 80, 70].map(function (v) { return '<button class="b" type="button" data-set="' + v + '">' + v + '%</button>'; }).join('') +
      '<label style="margin-left:auto">Target final grade <input type="number" id="pj-target" min="0" max="100" value="' + P.target + '" style="width:64px">%</label></div>';
    h += items.map(function (it) {
      var ex = !!P.ex[it.key], v = isNum(P.pct[it.key]) ? P.pct[it.key] : 0;
      return '<div class="row' + (ex ? ' ex' : '') + '"><div><b>' + esc(it.label) + '</b><small>' + num(it.R) + ' points</small></div>' +
        '<input type="range" min="0" max="100" step="1" value="' + v + '" data-pj="' + it.key + '"' + (ex ? ' disabled' : '') + ' aria-label="Score you expect on ' + esc(it.label) + '">' +
        '<span><input type="number" min="0" max="100" step="1" value="' + v + '" data-pj="' + it.key + '"' + (ex ? ' disabled' : '') + ' style="width:62px"> %</span>' +
        '<label class="x"><input type="checkbox" data-pjx="' + it.key + '"' + (ex ? ' checked' : '') + '> Excused</label></div>';
    }).join('');
    return h + '<div id="pj-out" style="margin-top:14px">' + pjOutHTML() + '</div><div class="help">This is your lab grade. Your letter grade is for lab and lecture together (see the box at the top). This is a what-if: it changes nothing in your actual grades.</div></div>';
  }

  /* ---- my scores ---- */
  function scoresHTML() {
    var c = cvOf(), base = c.fd - exPoints(autoExcused()), tg = c.fp / base * 100, avg = c.cd > 0 ? c.cp / c.cd * 100 : null;
    var h = '<div class="card2"><h2>Where I stand</h2><div class="tiles">' +
      '<div><small>Average on the work graded so far</small><b>' + pc(avg) + '</b><small>' + num(c.cp) + ' of ' + num(c.cd) + ' points</small></div>' +
      '<div><small>Total grade so far (earned ÷ whole course)</small><b>' + pc(tg) + '</b><small>' + num(c.fp) + ' of ' + num(base) + ' points</small></div></div>' +
      '<p class="lead">These two numbers answer different questions. The first is <b>how well you are doing on what has been graded</b>. The second is <b>how much of the whole course you have already earned</b>, so it is low for everyone until the rest of the course is done.</p>';
    var cols = (D.columns || []).filter(function (x) { return x.max && !x.formula; });
    h += '<div class="scroll"><table class="t"><thead><tr><th>Item</th><th>Score</th><th>Out of</th><th>Percent</th><th></th></tr></thead><tbody>' + cols.map(function (x) {
      var v = data[x.key], gk = cv.g && cv.g[x.key];
      // a category with nothing graded yet is "not graded yet", not a score of zero
      if (gk && x.key !== 'exams' && !(isNum(gk.cd) && gk.cd > 0) && !(gk.cp > 0)) return '<tr><td>' + esc(x.label) + '</td><td colspan="4" style="text-align:left;color:var(--text-dim)">Not graded yet</td></tr>';
      if (!isNum(v)) return '<tr><td>' + esc(x.label) + '</td><td colspan="4" style="text-align:left;color:var(--text-dim)">' + ((data.excused || []).indexOf(x.key) >= 0 ? 'Excused' : 'No score yet') + '</td></tr>';
      var mx = x.max;
      // a category shows points earned out of the points graded for this student (an excused quiz is not in it)
      if (gk && x.key !== 'exams' && isNum(gk.cd) && gk.cd > 0 && isNum(gk.cp)) { v = gk.cp; mx = gk.cd; }
      var p = v / mx * 100;
      return '<tr><td>' + esc(x.label) + '</td><td>' + num(v) + '</td><td>' + num(mx) + '</td><td>' + f(p, 1) + '%</td><td><div class="bar"><i style="width:' + Math.min(100, p) + '%"></i></div></td></tr>';
    }).join('') + '</tbody></table></div><div class="help">Category rows (assignments, participation, lab write-ups, quizzes) show points earned out of the points graded so far in that category.</div></div>';
    return h;
  }

  /* ---- the final exam (Exam 3): what score gives which letter ---- */
  function finalPlan() {
    var c = cvOf(), base = c.fd - exPoints(autoExcused()), M = ITEMS.filter(function (x) { return x.key === 'exam3'; })[0].p;
    var other = remItems().filter(function (it) { return it.key !== 'exam3'; }).reduce(function (s, it) { return s + it.R; }, 0);
    return { c: c, base: base, M: M, fp: c.fp, other: other, done: isNum(data.exam3), excused: (data.excused || []).indexOf('exam3') >= 0 };
  }
  // Lab is 50% of the overall course grade; lecture is the other 50% and is scored by the lecture instructors.
  // Students type their lecture percent, so a letter is only ever shown for the OVERALL grade, never for the lab alone.
  var LAB_W = 0.5;
  // The numbers a student types are saved to their ACCOUNT (Supabase), so they follow the student to any device.
  var saveT = null;
  function saveState() {
    if (PREVIEW) return;   // an instructor viewing as a student never writes anything
    clearTimeout(saveT);
    saveT = setTimeout(function () { window.sfSupabase.bios102GradesStateSet(session.sessionToken, { lec: LEC, exam3: FIN.score, want: FIN.want }).catch(function () { /* keep working; it saves on the next change */ }); }, 600);
  }
  function lecSet() { saveState(); }
  var LEC = null, PREVIEW = false, FIN = { score: null, want: null };   // PREVIEW: an instructor viewing as a student never reads or writes the instructor's own saved lecture percent
  function overall(labPct) { return LAB_W * labPct + (1 - LAB_W) * LEC; }
  function overallTxt(labPct) { var o = overall(labPct); return '<b>' + fg(o, 1) + '%</b>, which is a <b>' + bandOf(o) + '</b>'; }
  function neededPts(P, T) {   // Exam 3 points that bring the OVERALL grade to T, given the lecture percent
    var labNeed = (T - (1 - LAB_W) * LEC) / LAB_W;
    return Math.ceil(((labNeed / 100 * P.base - P.fp) * 2) - 1e-9) / 2;
  }
  function finalOut(P, sc) {
    if (sc == null) return '<div class="help">Type a score to see the grade it would give.</div>';
    var lab = (P.fp + sc) / P.base * 100;
    return '<div class="note"><b>' + num(sc) + ' of ' + P.M + '</b> on Exam 3 (' + f(sc / P.M * 100, 1) + '%) makes your lab grade <b>' + f(lab, 1) + '%</b>' +
      (LEC == null ? '. Type your lecture percent above to see your overall grade.' : ' and your overall grade ' + overallTxt(lab) + '.') + '</div>';
  }
  function wantOut(P, T) {   // T = wanted overall percent
    if (T == null) return '<div class="help">Pick a letter, or type the overall percent you want.</div>';
    if (LEC == null) return '<div class="note amber">Type your lecture percent at the top first. The score you need depends on it.</div>';
    var n = neededPts(P, T);
    if (n <= 0) return '<div class="note">An overall <b>' + f(T, 1) + '%</b> (' + bandOf(T) + ') is already secured. Any score on Exam 3 keeps it.</div>';
    if (n > P.M + 1e-9) return '<div class="note">An overall <b>' + f(T, 1) + '%</b> (' + bandOf(T) + ') is not possible from here, even with a perfect Exam 3. The most you can reach is <b>' + fg(overall((P.fp + P.M) / P.base * 100), 1) + '%</b> (' + bandOf(overall((P.fp + P.M) / P.base * 100)) + ').</div>';
    return '<div class="note">For an overall <b>' + f(T, 1) + '%</b> (' + bandOf(T) + ') you need <b>' + num(n) + ' of ' + P.M + '</b> on Exam 3, which is <b>' + f(Math.ceil(n / P.M * 1000 - 1e-9) / 10, 1) + '%</b>.</div>';
  }
  function finalDyn(P) {
    var lo = P.fp / P.base * 100, hi = (P.fp + P.M) / P.base * 100, h;
    if (LEC == null) {
      return '<div class="note amber">Type your lecture percent above. Your overall letter grade needs both halves of the course, so none is shown until you do.</div>' +
        '<div class="tiles"><div><small>Your lab grade now (Exam 3 not counted)</small><b>' + f(lo, 1) + '%</b></div><div><small>Your lab grade with a perfect Exam 3</small><b>' + f(hi, 1) + '%</b></div></div>';
    }
    h = '<div class="tiles"><div><small>Overall if you score 0 on Exam 3</small><b>' + fg(overall(lo), 1) + '%</b><small>' + bandOf(overall(lo)) + '</small></div>' +
      '<div><small>Overall if you score ' + P.M + ' (perfect)</small><b>' + fg(overall(hi), 1) + '%</b><small>' + bandOf(overall(hi)) + '</small></div></div>';
    var sc = BIOS.getGradeScale().filter(function (s) { return s.min > 0; });
    h += '<div class="scroll"><table class="t"><thead><tr><th>Overall letter grade</th><th>Overall % needed</th><th>Score needed on Exam 3</th><th>Percent on Exam 3</th></tr></thead><tbody>' + sc.map(function (s) {
      var n = neededPts(P, s.min), cell;
      if (n <= 0) cell = '<td colspan="2" style="text-align:left;color:var(--text-dim)">Already secured. Any score keeps it.</td>';
      else if (n > P.M + 1e-9) cell = '<td colspan="2" style="text-align:left;color:var(--text-dim)">Not possible, even with a perfect score.</td>';
      else cell = '<td><b>' + num(n) + '</b> of ' + P.M + '</td><td>' + f(Math.ceil(n / P.M * 1000 - 1e-9) / 10, 1) + '%</td>';
      return '<tr><td><b>' + esc(s.letter) + '</b></td><td>' + s.min + '%</td>' + cell + '</tr>';
    }).join('') + '</tbody></table></div>';
    return h;
  }
  function finalHTML() {
    var P = finalPlan(), h = '<div class="card2" id="sec-final"><h2>My overall grade and the final exam</h2>' +
      '<p class="lead">The lab is <b>50%</b> of your overall grade and lecture is the other <b>50%</b>. A letter grade only means something for the two together, so this page shows letters for your <b>overall</b> grade, not for the lab alone. Your lecture grade comes from your lecture instructors, so type it in as a percent.</p>' +
      '<div class="ctl"><label>My lecture grade <input type="number" id="lec-pct" min="0" max="100" step="0.1" style="width:84px" value="' + (LEC == null ? '' : LEC) + '"> %</label><span class="help" style="margin:0">Saved to your account.</span></div>';
    if (P.excused) return h + '<div class="note">You are excused from Exam 3, so it is not part of your lab. Your lab grade is <b>' + f(P.fp / P.base * 100, 1) + '%</b>.</div><div id="fin-dyn"></div></div>';
    if (P.done) return h + '<div class="note">Your Exam 3 score is in. Your lab grade is <b>' + f(P.fp / P.base * 100, 1) + '%</b>.</div><div id="fin-dyn"></div></div>';
    h += '<p class="lead" style="margin-top:12px">Exam 3 is worth <b>' + P.M + ' of the ' + num(P.base) + ' points</b> in your lab. You have earned <b>' + num(P.fp) + '</b> points so far.</p><div id="fin-dyn">' + finalDyn(P) + '</div>';
    if (P.other > 0.01) h += '<div class="note amber">This assumes the other ' + num(P.other) + ' points of lab work still open earn nothing. The planner at the bottom of this page handles that work too.</div>';
    h += '<h3 style="margin:16px 0 4px;font-size:1rem">What if I score this on Exam 3?</h3>' +
      '<div class="ctl"><label>I score <input type="number" id="fin-score" min="0" max="' + P.M + '" step="0.5" style="width:84px" value="' + (FIN.score == null ? '' : FIN.score) + '"> of ' + P.M + '</label><label>or <input type="number" id="fin-pct" min="0" max="100" step="0.1" style="width:76px" value="' + (FIN.score == null ? '' : Math.round(FIN.score / P.M * 1000) / 10) + '"> % on Exam 3</label></div><div id="fin-out">' + finalOut(P, FIN.score) + '</div>' +
      '<h3 style="margin:16px 0 4px;font-size:1rem">What do I need on Exam 3 for the grade I want?</h3>' +
      '<div class="ctl"><label>I want an overall grade of <select id="want-letter"><option value="">choose a letter</option>' + BIOS.getGradeScale().filter(function (s) { return s.min > 0; }).map(function (s) { return '<option value="' + s.min + '">' + esc(s.letter) + ' (' + s.min + '%+)</option>'; }).join('') + '</select></label><label>or <input type="number" id="want-pct" min="0" max="100" step="0.1" style="width:76px" value="' + (FIN.want == null ? '' : FIN.want) + '"> % overall</label></div><div id="want-out">' + wantOut(P, FIN.want) + '</div>' +
      '<div class="help">Letter cutoffs use the BIOS102 scale (' + BIOS.scaleText() + '), applied to the overall grade. It assumes lab and lecture count the same way toward the final. Points are rounded up to the next half point, so the score shown always reaches the letter. This is a what-if; it changes nothing in your actual grades.</div></div>';
    return h;
  }

  function render() {
    $('app').innerHTML = '<h1>My grades, ' + esc(D.first) + '</h1><p class="lede">Use it to understand your grade and to try out “what if” questions. Nothing you do here changes your actual grade.</p>' +
      finalHTML() + scoresHTML() + excuseHTML() + makeupHTML() + projectionHTML();
  }

  /* ---- events ---- */
  document.addEventListener('change', function (e) {
    var t = e.target; if (!D) return;
    if (t.id === 'ex-item') { var d0 = defaults(+t.value); S.pick = { item: +t.value, status: d0.status, score: d0.score }; $('sec-excuse').outerHTML = excuseHTML(); }
    else if (t.id === 'ex-status') { S.pick.status = t.value; if (t.value === 'missing') S.pick.score = 0; $('sec-excuse').outerHTML = excuseHTML(); }
    else if (t.id === 'ex-score') {
      var mx = ITEMS[S.pick.item].p, sv = t.value === '' ? null : clampNum(t.value, 0, mx);
      if (t.value !== '' && sv === null) t.value = '';            // not a number: discard it
      else if (sv !== null && String(sv) !== String(+t.value)) t.value = sv;   // out of range: pull it back inside 0 to the item's points
      S.pick.score = sv;
    }
    else if (t.dataset && t.dataset.mki != null) { S.mkOn[t.dataset.mki] = t.checked; $('mk-out').innerHTML = makeupOut(); if ($('sec-proj')) $('sec-proj').outerHTML = projectionHTML(); }
    else if (t.id === 'want-letter') { if ($('want-pct')) $('want-pct').value = t.value; FIN.want = t.value === '' ? null : +t.value; saveState(); $('want-out').innerHTML = wantOut(finalPlan(), t.value === '' ? null : +t.value); }
    else if (t.dataset && t.dataset.pjx != null) { var P = pjState(); if (t.checked) P.ex[t.dataset.pjx] = true; else delete P.ex[t.dataset.pjx]; $('sec-proj').outerHTML = projectionHTML(); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target; if (!D || !t.dataset) return;
    if (t.id === 'lec-pct') {
      LEC = t.value === '' ? null : clampNum(t.value, 0, 100); lecSet(LEC);
      var P0 = finalPlan(); if ($('fin-dyn')) $('fin-dyn').innerHTML = (P0.done || P0.excused) ? '' : finalDyn(P0);
      if ($('fin-out')) { var s0 = $('fin-score'); $('fin-out').innerHTML = finalOut(P0, s0 && s0.value !== '' ? clampNum(s0.value, 0, P0.M) : null); }
      if ($('want-out')) { var wp = $('want-pct'); $('want-out').innerHTML = wantOut(P0, wp && wp.value !== '' ? clampNum(wp.value, 0, 100) : null); }
      if ($('pj-out')) $('pj-out').innerHTML = pjOutHTML();
      return;
    }
    if (t.id === 'want-pct') { var wv = t.value === '' ? null : clampNum(t.value, 0, 100); if ($('want-letter')) $('want-letter').value = ''; FIN.want = wv; saveState(); $('want-out').innerHTML = wantOut(finalPlan(), wv); return; }
    if (t.id === 'fin-pct') { var pv2 = t.value === '' ? null : clampNum(t.value, 0, 100), PP = finalPlan(); if ($('fin-score')) $('fin-score').value = pv2 == null ? '' : Math.round(pv2 * PP.M) / 100; FIN.score = pv2 == null ? null : Math.round(pv2 * PP.M) / 100; saveState(); $('fin-out').innerHTML = finalOut(PP, FIN.score); return; }
    if (t.id === 'fin-score') { var fv = t.value === '' ? null : clampNum(t.value, 0, ITEMS.filter(function (x) { return x.key === 'exam3'; })[0].p); FIN.score = fv; saveState(); $('fin-out').innerHTML = finalOut(finalPlan(), fv); if ($('fin-pct')) $('fin-pct').value = fv == null ? '' : Math.round(fv / finalPlan().M * 1000) / 10; return; }
    if (t.dataset.pj != null) {
      var v =Math.max(0, Math.min(100, +t.value || 0)); pjState().pct[t.dataset.pj] = v;
      document.querySelectorAll('[data-pj="' + t.dataset.pj + '"]').forEach(function (el) { if (el !== t) el.value = v; });
      $('pj-out').innerHTML = pjOutHTML();
    } else if (t.id === 'pj-target') { pjState().target = Math.max(0, Math.min(100, +t.value || 0)); $('pj-out').innerHTML = pjOutHTML(); }
    else if (t.id === 'mk-credit') {
      S.mkCredit = clampNum(t.value, 0, 100) || 0; $('mkc').textContent = S.mkCredit + '%';
      $('mk-out').innerHTML = makeupOut(); if ($('pj-out')) $('pj-out').innerHTML = pjOutHTML();
    }
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t || !D) return;
    if (t.id === 'ex-add') {
      var it = ITEMS[S.pick.item], sc = $('ex-score') ? clampNum($('ex-score').value, 0, it.p) : 0;
      if (S.pick.status !== 'missing' && sc === null) { $('ex-score').focus(); return; }
      if (S.exc.some(function (x) { return x.item === S.pick.item; })) return;
      S.exc.push({ item: S.pick.item, status: S.pick.status, score: S.pick.status === 'missing' ? 0 : sc }); $('sec-excuse').outerHTML = excuseHTML();
    } else if (t.dataset.exrm != null) { S.exc.splice(+t.dataset.exrm, 1); $('sec-excuse').outerHTML = excuseHTML(); }
    else if (t.id === 'ex-clear') { S.exc = []; $('sec-excuse').outerHTML = excuseHTML(); }
    else if (t.dataset.set != null) { var P = pjState(); remItems().forEach(function (it) { P.pct[it.key] = t.dataset.set === 'usual' ? P.usual : +t.dataset.set; }); $('sec-proj').outerHTML = projectionHTML(); }
  });

  /* ---- boot ---- */
  (async function () {
    var pv = new URLSearchParams(location.search).get('preview'), banner = '';
    if (pv) {
      // Instructor "view as": the server runs the same function a student's own login runs (bios102_grades_payload) and audits it.
      PREVIEW = true;
      try {
        D = await window.sfSupabase.bios102GradesViewAs(session.sessionToken, pv);
        var au = D && D.audit || {};
        var ok = au.rows_sent != null && au.rows_sent <= 1 && !au.other_students_named && !au.other_emails_present;
        banner = '<div class="note amber" style="position:sticky;top:64px;z-index:5"><b>Instructor view as ' + esc(pv) + '</b>: this is the exact response the server gives that student’s own login. ' +
          (au.note ? esc(au.note) + '. ' : '<b>Privacy check: ' + (ok ? 'passed' : 'FAILED') + '.</b> The server sent <b>' + (au.rows_sent == null ? '?' : au.rows_sent) + ' row</b> (' + (au.bytes || '?') + ' bytes); other students’ names in it: <b>' + (au.other_students_named || 0) + '</b>; other students’ emails in it: <b>' + (au.other_emails_present || 0) + '</b>. ') +
          'Nothing here changes any grade. This view is logged. <a href="/BIOS102/grades.html">Back to the gradebook</a></div>';
      } catch (err) { $('app').innerHTML = '<div class="card2"><h2>View as is for instructors</h2><p class="lead">Log in with an instructor account to view a student’s page.</p></div>'; return; }
    }
    else try { D = await window.sfSupabase.bios102GradesMine(session.sessionToken); }
    catch (err) { $('app').innerHTML = '<div class="card2"><h2>Could not load your grades</h2><p class="lead">Please try again in a moment. If it keeps happening, tell your instructor.</p></div>'; return; }
    if (!pv && (!D || !D.found || !D.data || !D.data.cv)) {
      // Instructors have no student row. bios102_grades_load only answers instructor sessions, so success means send them to the gradebook.
      try { await window.sfSupabase.bios102GradesLoad(session.sessionToken); D = null; $('app').innerHTML = '<div class="card2"><h2>You are signed in as an instructor</h2><p class="lead">Taking you to the gradebook. <a href="/BIOS102/grades.html">Open the gradebook</a>. To see a student’s view, use “Preview as this student” there.</p></div>'; location.replace('/BIOS102/grades.html'); return; } catch (e) { /* not an instructor: fall through to the student message */ }
    }
    if (!D || !D.found || !D.data || !D.data.cv) { D = null; $('app').innerHTML = banner + '<div class="card2"><h2>Your grades are not available here yet</h2><p class="lead">Nothing has been set up for your account on this page. Please check with your instructor.</p></div>'; return; }
    await BIOS.loadGradeScale(session.sessionToken);
    data = D.data; cv = data.cv;
    // exams a student is already excused from start with that excuse switched on, so the comparison is ready
    autoExcused().forEach(function (k) { var i = ITEMS.findIndex(function (x) { return x.key === k; }); if (i >= 0) S.exc.push({ item: i, status: 'missing', score: 0 }); });
    if (!PREVIEW) { try { var st = await window.sfSupabase.bios102GradesStateGet(session.sessionToken) || {}; LEC = isNum(st.lec) ? st.lec : null; FIN.score = isNum(st.exam3) ? st.exam3 : null; FIN.want = isNum(st.want) ? st.want : null; } catch (e) { /* start blank */ } }
    render();
    if (banner) $('app').insertAdjacentHTML('afterbegin', banner);
  })();
})();
</script>
</body>
</html>
